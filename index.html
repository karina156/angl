{h:"Косвенная речь: сдвиг времён", th:`<p>Когда пересказываем чужие слова после <b>said / told</b> в прошлом, время <b>сдвигается на шаг назад</b>.</p>
<table><tr><th>Прямая речь</th><th>Косвенная речь</th></tr><tr><td>Present Simple: "I <b>like</b> it."</td><td>She said she <b>liked</b> it.</td></tr><tr><td>Present Continuous: "I'<b>m working</b>."</td><td>…she <b>was working</b>.</td></tr><tr><td>Past Simple / Present Perfect: "I <b>saw</b> / <b>have seen</b> it."</td><td>…she <b>had seen</b> it.</td></tr><tr><td>will: "I'<b>ll call</b>."</td><td>…she <b>would call</b>.</td></tr><tr><td>can: "I <b>can</b> help."</td><td>…she <b>could</b> help.</td></tr><tr><td>must: "I <b>must</b> go."</td><td>…she <b>had to</b> go.</td></tr></table>
<p><b>Сдвиг не обязателен</b>, если факт до сих пор верен: <i>He said the Earth <b>is</b> round.</i></p>`, q:[
["m","\"I'm tired.\" → She said she ___ tired.",["is","was","has been"],1,"Present → Past."],
["m","\"I will help.\" → He said he ___ help.",["will","would","can"],1,"Will → would."],
["m","\"I saw the film.\" → She said she ___ the film.",["saw","had seen","has seen"],1,"Past → Past Perfect."],
["m","\"I can swim.\" → He said he ___ swim.",["can","could","would"],1,"Can → could."],
["m","\"We're leaving.\" → They said they ___ .",["are leaving","were leaving","left"],1,"Continuous сдвиг."]]},
{h:"say и tell; слова места и времени", th:`<table><tr><th>say</th><th>tell</th></tr><tr><td>say <b>something</b> (to someone)</td><td>tell <b>someone</b> something</td></tr><tr><td><i>She <b>said</b> (that) she was busy.</i></td><td><i>She <b>told me</b> (that) she was busy.</i></td></tr><tr><td><s>She said me</s></td><td><s>She told that</s></td></tr></table>
<p><b>Слова меняются</b>, когда меняется точка зрения:</p>
<table><tr><td>now → then</td><td>today → that day</td></tr><tr><td>yesterday → the day before / the previous day</td><td>tomorrow → the next day / the following day</td></tr><tr><td>here → there</td><td>this → that</td></tr><tr><td>ago → before</td><td>last week → the week before</td></tr></table>`, q:[
["m","She ___ me she was busy.",["said","told","says to"],1,"Tell + someone."],
["m","He ___ that he was hungry.",["told","said","told to"],1,"Say that…"],
["t","\"I'll come tomorrow.\" → She said she would come the ___ day.",["next","following"],"Tomorrow → the next day."],
["t","\"I met him yesterday.\" → He said he had met him the day ___ .",["before"],"Yesterday → the day before."],
["t","\"I live here.\" → She said she lived ___.",["there"],"Here → there."]]},
{h:"Косвенные вопросы и просьбы", th:`<p><b>Вопросы:</b> прямой порядок слов, без do/does/did, без «?».</p>
<ul><li>"Where <b>do you live</b>?" → He asked me where <b>I lived</b>.</li><li>"<b>Are</b> you OK?" → She asked <b>if / whether</b> I was OK. (да/нет-вопрос → if / whether)</li></ul>
<p><b>Просьбы и приказы:</b> ask / tell + someone + <b>(not) to</b> + V.</p>
<ul><li>"Please sit down." → She <b>asked me to sit</b> down.</li><li>"Don't be late!" → He <b>told us not to be</b> late.</li></ul>
<p><b>Вежливые вопросы</b> тоже с прямым порядком: <i>Could you tell me where <b>the station is</b>?</i> (не <s>where is the station</s>)</p>`, q:[
["t","\"Where do you work?\" → She asked me where I ___ .",["worked"],"Прямой порядок, сдвиг."],
["t","\"Are you hungry?\" → He asked ___ I was hungry.",["if","whether"],"Да/нет → if."],
["t","\"Please help me.\" → She asked me ___ help her.",["to"],"Ask + to."],
["t","\"Don't touch it!\" → He told me ___ to touch it.",["not"],"Not to."],
["h","Найдите ошибку: «Could you tell me where is the bank?»",["where the bank is","could you tell me where the bank is"],"Прямой порядок."]]},
{h:"Глаголы передачи речи", th:`<p>Вместо постоянного <i>said</i> — точные глаголы (повышают Lexical Resource):</p>
<table><tr><th>Глагол</th><th>Схема</th><th>Пример</th></tr><tr><td>advise, warn, remind, encourage</td><td>+ someone + to V</td><td><i>The doctor <b>advised me to rest</b>.</i></td></tr><tr><td>suggest, recommend</td><td>+ -ing / that…</td><td><i>She <b>suggested going</b> out.</i></td></tr><tr><td>admit, deny</td><td>+ -ing</td><td><i>He <b>denied stealing</b> the money.</i></td></tr><tr><td>promise, refuse, agree, offer</td><td>+ to V</td><td><i>She <b>refused to answer</b>.</i></td></tr><tr><td>apologise for, insist on, accuse sb of</td><td>+ -ing</td><td><i>He <b>apologised for being</b> late.</i></td></tr><tr><td>claim, explain, state</td><td>+ that</td><td><i>The report <b>claims that</b>…</i></td></tr></table>
<p><b>Ошибка:</b> <s>She suggested me to go</s> → <i>She suggested (that) I go / suggested going.</i></p>`, q:[
["t","He denied ___ (take) the money.",["taking"],"Deny + -ing."],
["t","She refused ___ (answer) my question.",["to answer"],"Refuse + to."],
["t","He apologised ___ being late.",["for"],"Apologise for."],
["t","The doctor advised me ___ (stop) smoking.",["to stop"],"Advise sb to."],
["h","Найдите ошибку: «She suggested me to see a doctor.»",["suggested that i see a doctor","suggested seeing a doctor","she suggested that i see a doctor","she suggested seeing a doctor"],"Suggest + that / -ing."]]},
{h:"Лексика: СМИ и новости", th:`<table><tr><td>the media / mass media</td><td>СМИ</td></tr><tr><td>news coverage</td><td>освещение в новостях</td></tr><tr><td>a headline</td><td>заголовок</td></tr><tr><td>a reliable / biased source</td><td>надёжный / предвзятый источник</td></tr><tr><td>fake news / misinformation</td><td>фейки / дезинформация</td></tr><tr><td>go viral</td><td>стать вирусным</td></tr><tr><td>freedom of the press</td><td>свобода прессы</td></tr><tr><td>invade someone's privacy</td><td>вторгаться в личную жизнь</td></tr><tr><td>sensationalism</td><td>погоня за сенсациями</td></tr></table>
<p><b>Reporting verbs в эссе:</b> <i>Critics <b>argue</b> that…, Some <b>claim</b> that…, It has been <b>suggested</b> that…, Research <b>shows</b> that…</i></p>`, q:[
["t","Предвзятый источник: a ___ source.",["biased"],"Biased."],
["t","Стать вирусным: go ___.",["viral"],"Go viral."],
["t","Critics ___ that social media spreads fake news. (утверждают)",["argue","claim"],"Argue / claim."],
["h","Найдите ошибку: «The news are often biased.»",["is","the news is often biased"],"News — ед. ч."],
["h","Найдите ошибку: «The article said us that prices were rising.»",["told us","said that","the article told us that prices were rising"],"Tell us / say that."]]},
{h:"Discussion essay: обе стороны", th:`<p><b>Discussion essay</b> («Discuss both views and give your own opinion»):</p>
<ol><li><b>Введение:</b> перефраз + указание на обе позиции + (кратко) своё мнение.</li><li><b>Body 1:</b> первая позиция — <i>Some people <b>believe</b> that… <b>They argue</b> that…</i></li><li><b>Body 2:</b> вторая позиция — <i>On the other hand, others <b>claim</b> that…</i></li><li><b>Вывод:</b> своё мнение явно — <i>In conclusion, <b>although</b>…, I believe…</i></li></ol>
<p><b>Важно:</b> мнение обязательно — без него Task Response не выше 6. Косвенная речь и reporting verbs помогают нейтрально излагать чужие взгляды.</p>`, q:[
["t","Some people ___ that newspapers will disappear. (считают)",["believe","think","argue","claim"],"Reporting verb."],
["t","On the ___ hand, others claim that…",["other"],"On the other hand."],
["h","Найдите ошибку: «Some people say that the newspapers are dying.» (газеты вообще)",["newspapers","some people say that newspapers are dying"],"Обобщение без the."],
["h","Найдите ошибку: «They asked what did the government plan.»",["what the government planned","they asked what the government planned"],"Прямой порядок."],
["h","Перефразируйте: «\"I'll never do it again,\" he said.» → He promised ___ never do it again.",["to"],"Promise + to."]]},
];

{h:"Герундий: после каких слов", th:`<p><b>Герундий (-ing)</b> — глагол в роли существительного.</p>
<ul><li><b>Подлежащее:</b> <i><b>Swimming</b> is good for you.</i></li><li><b>После предлогов</b> — всегда: <i>interested <b>in learning</b>, good <b>at cooking</b>, <b>before leaving</b>, <b>without saying</b></i></li><li><b>После глаголов:</b> enjoy, finish, mind, avoid, consider, suggest, keep, miss, practise, deny, admit, imagine, can't stand, can't help, give up, look forward to</li></ul>
<p><b>Ловушка — to-предлог:</b> <i>look forward <b>to</b> seeing</i>, <i>be used <b>to</b> working</i>, <i>object <b>to</b> paying</i> — здесь to — предлог, после него -ing.</p>`, q:[
["m","I enjoy ___ in the rain.",["to walk","walking","walk"],1,"Enjoy + -ing."],
["m","I'm looking forward to ___ you.",["see","seeing","seen"],1,"Look forward to + -ing."],
["m","She's good at ___ .",["draw","drawing","to draw"],1,"После предлога → -ing."],

{h:"Инфинитив: после каких слов", th:`<p><b>to + V</b> используется:</p>
<ul><li><b>После глаголов:</b> want, decide, hope, plan, agree, refuse, promise, manage, afford, learn, offer, seem, expect, would like</li><li><b>Цель</b> («чтобы»): <i>I went to the shop <b>to buy</b> milk.</i> (не <s>for buy</s>)</li><li><b>После прилагательных:</b> <i>It's easy <b>to learn</b>. I'm happy <b>to help</b>.</i></li><li><b>too / enough:</b> <i>too tired <b>to work</b>, old enough <b>to vote</b></i></li></ul>
<p><b>Без to</b> (bare infinitive): после модальных, <b>make</b> и <b>let</b>: <i>She <b>made me cry</b>. <b>Let</b> me <b>go</b>.</i> Но в пассиве: <i>I was made <b>to</b> wait.</i></p>`, q:[
["t","I decided ___ (study) abroad.",["to study"],"Decide + to."],

["h","Найдите ошибку: «I came here for learn English.»",["to learn","i came here to learn english"],"Цель → to."]]},
{h:"Меняется смысл: stop, remember, try", th:`<table><tr><th>Глагол</th><th>+ -ing</th><th>+ to V</th></tr><tr><td><b>stop</b></td><td>прекратить: <i>I stopped <b>smoking</b>.</i></td><td>остановиться, чтобы: <i>I stopped <b>to smoke</b>.</i></td></tr><tr><td><b>remember / forget</b></td><td>помнить (о прошлом): <i>I remember <b>meeting</b> him.</i></td><td>не забыть сделать: <i>Remember <b>to lock</b> the door.</i></td></tr><tr><td><b>try</b></td><td>попробовать как эксперимент: <i>Try <b>restarting</b> it.</i></td><td>стараться: <i>I tried <b>to open</b> it, but couldn't.</i></td></tr><tr><td><b>regret</b></td><td>жалеть о сделанном: <i>I regret <b>saying</b> it.</i></td><td>с сожалением сообщать: <i>We regret <b>to inform</b> you…</i></td></tr></table>

{h:"Лексика: здоровье и образ жизни", th:`<table><tr><td>lead a healthy lifestyle</td><td>вести здоровый образ жизни</td></tr><tr><td>physical / mental health</td><td>физ. / псих. здоровье</td></tr><tr><td>obesity</td><td>ожирение</td></tr><tr><td>life expectancy</td><td>продолжительность жизни</td></tr><tr><td>preventive medicine</td><td>профилактика</td></tr><tr><td>be addicted to</td><td>зависеть от (+ -ing!)</td></tr><tr><td>take up a sport</td><td>начать заниматься</td></tr><tr><td>burnout</td><td>выгорание</td></tr></table>

{h:"Task 1: столбчатая диаграмма и таблица", th:`<p><b>Bar chart / table</b> — часто сравнение категорий, а не только время.</p>
<ol><li><b>Введение:</b> <i>The bar chart <b>compares</b> the percentage of… in five countries in 2020.</i></li><li><b>Overview:</b> самое большое / маленькое, главная разница. <i>Overall, Spain had <b>the highest</b> proportion, while…</i></li><li><b>Body:</b> группируйте похожие данные, не описывайте каждую цифру подряд.</li></ol>
<p><b>Слова для долей:</b> the proportion / percentage of, a quarter (25%), a third (33%), just over half, the majority, a minority, nearly two thirds.</p>
<p><b>Сравнение:</b> <i>twice as many as, considerably higher than, the second most popular, compared with, followed by</i>.</p>`, q:[
["t","25% = a ___",["quarter"],"A quarter."],
["t","Spain had the highest percentage, ___ by Italy. (за ней следует)",["followed"],"Followed by."],
["h","Перефразируйте: «52% of people use buses.» → Just ___ half of people use buses.",["over"],"Just over half."],
["h","Найдите ошибку: «The percent of women was higher.»",["percentage","the percentage of women was higher"],"The percentage of."],
["h","Найдите ошибку: «The most popular sport was football, following by tennis.»",["followed by","followed"],"Followed by."]]},
{h:"Неделя целиком: -ing или to", th:`<table><tr><th>-ing</th><th>to + V</th><th>V без to</th></tr><tr><td>enjoy, avoid, finish, mind, suggest, consider, keep, can't stand, look forward to, be used to, после предлогов</td><td>want, decide, hope, plan, agree, refuse, manage, afford, would like; цель; после прилагательных</td><td>модальные, make, let, had better, would rather</td></tr></table>
<p><b>Глагол + объект + to:</b> want / ask / tell / advise / allow / expect <b>someone to do</b>: <i>I want <b>you to</b> come.</i> (не <s>I want that you come</s>)</p>`, q:[
["m","I want ___ me.",["that you help","you to help","you help"],1,"Want sb to."],
["h","Найдите ошибку: «I avoid to eat sugar.»",["avoid eating","i avoid eating sugar"],"Avoid + -ing."],
["h","Найдите ошибку: «She made me to wait for an hour.»",["made me wait","she made me wait for an hour"],"Make + V."],
["h","Найдите ошибку: «I can't afford buying a car.»",["to buy","i can't afford to buy a car"],"Afford + to."],
["h","Перефразируйте: «Do you object if I open the window?» → Do you mind ___ the window?",["if i open","my opening","me opening"],"Mind + -ing / if."]]}
];
DAYX[23] = [
{h:"Предположения о настоящем: must, might, can't", th:`<p>Модальные выражают <b>степень уверенности</b>:</p>
<table><tr><th>Уверенность</th><th>Форма</th><th>Пример</th></tr><tr><td>~95% да</td><td><b>must</b></td><td><i>She's not answering. She <b>must be</b> busy.</i></td></tr><tr><td>~50%</td><td><b>may / might / could</b></td><td><i>He <b>might be</b> at home.</i></td></tr><tr><td>~95% нет</td><td><b>can't / couldn't</b></td><td><i>That <b>can't be</b> true!</i></td></tr></table>
<p><b>Процесс сейчас:</b> must / might <b>be + -ing</b>: <i>The light's on. They <b>must be watching</b> TV.</i></p>
<p><b>Ловушка:</b> противоположность must (уверенность) — <b>can't</b>, а не <s>mustn't</s>.</p>`, q:[
["m","She's been working all day. She ___ be tired.",["can't","must","mustn't"],1,"Уверены да → must."],
["m","That ___ be Tom — he's in London.",["must","can't","might"],1,"Уверены нет → can't."],
["m","I'm not sure. He ___ be ill.",["must","might","can't"],1,"50% → might."],
["m","The music is loud. They ___ having a party.",["must be","must","can't be"],0,"Процесс → must be + -ing."],
["m","Противоположность «must be» (уверенность):",["mustn't be","can't be","don't have to be"],1,"Can't be."]]},
{h:"Предположения о прошлом: must have, might have", th:`<p><b>Модальный + have + V3</b> — догадки о прошлом.</p>
<table><tr><td><b>must have</b> done</td><td>наверняка сделал</td><td><i>The ground is wet. It <b>must have rained</b>.</i></td></tr><tr><td><b>might / may / could have</b> done</td><td>возможно сделал</td><td><i>She <b>might have missed</b> the bus.</i></td></tr><tr><td><b>can't / couldn't have</b> done</td><td>не может быть, чтобы сделал</td><td><i>He <b>can't have seen</b> me — he was asleep.</i></td></tr></table>
<p><b>Произношение:</b> must've [ˈmʌstəv], might've, couldn't've.</p>`, q:[
["t","She's not here. She ___ (must / leave) already.",["must have left","must've left"],"Must have + V3."],
["t","I can't find my keys. I ___ (might / drop) them.",["might have dropped","might've dropped"],"Might have + V3."],
["t","He ___ (can't / write) this — he doesn't speak English.",["can't have written","cannot have written"],"Can't have + V3."],
["t","They ___ (must / be) asleep — nobody answered.",["must have been","must've been"],"Must have been."],
["h","Найдите ошибку: «She must has forgotten.»",["must have forgotten","she must have forgotten"],"Must have."]]},
{h:"should have, needn't have: критика и сожаление", th:`<ul><li><b>should have done</b> — надо было (а не сделал): <i>You <b>should have told</b> me!</i></li><li><b>shouldn't have done</b> — не надо было (а сделал): <i>I <b>shouldn't have eaten</b> so much.</i></li><li><b>needn't have done</b> — сделал, но было не нужно: <i>You <b>needn't have brought</b> food — we had plenty.</i></li><li><b>didn't need to do</b> — не было нужно (и, скорее всего, не делал): <i>I <b>didn't need to</b> wake up early, so I slept in.</i></li><li><b>could have done</b> — мог (но не сделал): <i>You <b>could have called</b>!</i></li></ul>`, q:[
["t","You ___ (should / tell) me earlier!",["should have told","should've told"],"Should have + V3."],
["t","I ___ (shouldn't / say) that. Sorry.",["shouldn't have said","should not have said"],"Shouldn't have."],
["t","You ___ (needn't / buy) milk — we have lots.",["needn't have bought","need not have bought"],"Needn't have."],
["t","You ___ (could / ask) for help!",["could have asked","could've asked"],"Could have."],
["h","Найдите ошибку: «I should of studied harder.»",["should have studied","i should have studied harder"],"Should have."]]},
{h:"Лексика: общество и преступность", th:`<table><tr><td>commit a crime</td><td>совершить преступление</td></tr><tr><td>the crime rate</td><td>уровень преступности</td></tr><tr><td>a deterrent</td><td>сдерживающий фактор</td></tr><tr><td>rehabilitation</td><td>реабилитация</td></tr><tr><td>a prison sentence</td><td>тюремный срок</td></tr><tr><td>community service</td><td>общественные работы</td></tr><tr><td>juvenile crime / young offenders</td><td>подростковая преступность</td></tr><tr><td>reoffend</td><td>совершить повторно</td></tr></table>

{h:"Part 2 + Part 3 полностью", th:`<p><b>Полный цикл:</b> Part 2 (карточка) плавно переходит в Part 3 (обсуждение темы шире).</p>
<p><b>Part 2:</b> <i>Describe a time when you lost something.</i> → используйте must have / might have для догадок: <i>I <b>must have left</b> it on the bus, or someone <b>might have taken</b> it.</i></p>
<p><b>Part 3:</b> <i>Why do people lose things more often nowadays?</i> → <i>Well, it <b>might be</b> because we're constantly distracted by phones. People <b>must be</b> more stressed than they used to be…</i></p>
<p><b>Приёмы для времени на раздумья:</b> <i>That's an interesting question… I've never really thought about it, but… It depends on…</i></p>`, q:[
["t","I ___ (must / leave) it on the bus.",["must have left","must've left"],"Догадка о прошлом."],
["t","That's an ___ question. (интересный)",["interesting"],"Interesting question."],
["h","Найдите ошибку: «Someone must stolen my wallet.»",["must have stolen","someone must have stolen my wallet"],"Must have stolen."],
["h","Найдите ошибку: «It mustn't be true — she was with me!»",["can't","it can't be true"],"Уверены нет → can't."],
["h","Перефразируйте: «I'm sure he forgot.» → He ___ forgotten.",["must have"],"Must have."]]},
{h:"Неделя целиком: модальные о прошлом", th:`<table><tr><th>Значение</th><th>Настоящее</th><th>Прошлое</th></tr><tr><td>уверен да</td><td>must be</td><td>must have been</td></tr><tr><td>возможно</td><td>might / may / could be</td><td>might / may / could have been</td></tr><tr><td>уверен нет</td><td>can't be</td><td>can't / couldn't have been</td></tr><tr><td>надо было</td><td>should do</td><td>should have done</td></tr><tr><td>было не нужно</td><td>needn't do</td><td>needn't have done</td></tr></table>
<p><b>Перефразы:</b> <i>I'm sure she was upset</i> = she must have been upset; <i>Perhaps he missed the train</i> = he might have missed; <i>It was a mistake to sell the car</i> = I shouldn't have sold it.</p>`, q:[
["m","Perhaps they got lost. =",["They must have got lost.","They might have got lost.","They can't have got lost."],1,"Perhaps → might have."],
["h","Перефразируйте: «I'm sure she wasn't at home.» → She ___ been at home.",["can't have","couldn't have"],"Уверены нет."],
["h","Перефразируйте: «It was a mistake to lend him money.» → I ___ lent him money.",["shouldn't have","should not have"],"Сожаление."],
["h","Перефразируйте: «Perhaps he didn't hear you.» → He ___ heard you.",["might not have","may not have"],"Возможно нет."],
["h","Найдите ошибку: «You needn't to have come.»",["needn't have come","you needn't have come"],"Needn't have + V3."]]}
];

{h:"Future Continuous", th:`<p><b>will be + -ing</b> — действие будет <b>в процессе</b> в определённый момент будущего.</p>
<ul><li><i>This time tomorrow I'<b>ll be lying</b> on the beach.</i></li><li><i>At 8 pm I'<b>ll be having</b> dinner, so call later.</i></li><li><i>Don't call at 10 — I'<b>ll be sleeping</b>.</i></li></ul>
<p><b>Вежливый вопрос о планах</b> (не просьба!): <i><b>Will</b> you <b>be using</b> the car tonight?</i> — мягче, чем <i>Will you use…?</i></p>
<p><b>Ход событий:</b> <i>I'<b>ll be seeing</b> Anna tomorrow anyway, so I can give it to her.</i> — это и так произойдёт.</p>`, q:[
["m","This time next week I ___ on the beach.",["will lie","will be lying","am lying"],1,"Процесс в момент будущего."],
["m","Don't call at 9 — I ___ .",["will work","will be working","work"],1,"В процессе в 9."],
["m","Вежливо о планах: ___ you be using the printer later?",["Do","Will","Are"],1,"Will you be using…"],
["m","At midnight we ___ .",["will be still dancing","will still be dancing","still will be dancing"],1,"Will still be + -ing."],
["m","Форма Future Continuous:",["will + V","will be + -ing","will have + V3"],1,"Will be + -ing."]]},
{h:"Future Perfect", th:`<p><b>will have + V3</b> — действие <b>завершится к</b> моменту в будущем.</p>

<p><b>Маркеры:</b> <b>by</b> + время (by Friday, by 2030, by then), <b>by the time</b> + Present Simple, <b>in</b> (через): <i>in two years' time</i>.</p>
<p><b>by vs until:</b> <i>Finish it <b>by</b> Friday</i> (не позже пятницы) vs <i>Wait <b>until</b> Friday</i> (всё время до пятницы).</p>`, q:[
["t","By 2030 I ___ (finish) my degree.",["will have finished","'ll have finished"],"By + Future Perfect."],
["t","By the time you get home, I ___ (go) to bed.",["will have gone","'ll have gone"],"Завершится к моменту."],

{h:"Сравнение всех форм будущего", th:`<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr><tr><td>will</td><td>решение, прогноз</td><td><i>I think AI will change everything.</i></td></tr><tr><td>going to</td><td>намерение, признаки</td><td><i>I'm going to retrain.</i></td></tr><tr><td>Present Cont.</td><td>договорённость</td><td><i>I'm starting a new job on Monday.</i></td></tr><tr><td>will be doing</td><td>процесс в момент</td><td><i>In 2040 we'll be working from home.</i></td></tr><tr><td>will have done</td><td>результат к моменту</td><td><i>By 2040 robots will have replaced…</i></td></tr><tr><td>be about to / be due to</td><td>вот-вот / по плану</td><td><i>The train is about to leave. The report is due to be published.</i></td></tr></table>`, q:[

{h:"Лексика: работа будущего", th:`<table><tr><td>automation</td><td>автоматизация</td></tr><tr><td>remote / hybrid working</td><td>удалённая / гибридная работа</td></tr><tr><td>the gig economy</td><td>экономика подработок</td></tr><tr><td>job security</td><td>гарантия занятости</td></tr><tr><td>retrain / upskill</td><td>переучиваться / повышать квалификацию</td></tr><tr><td>become obsolete</td><td>устареть</td></tr><tr><td>lifelong learning</td><td>обучение всю жизнь</td></tr><tr><td>a four-day working week</td><td>4-дневная неделя</td></tr><tr><td>be replaced by machines</td><td>быть заменённым машинами</td></tr></table>

{h:"Полный пробный IELTS: стратегия", th:`<p><b>Неделя пробного экзамена.</b> Порядок как на настоящем IELTS:</p>
<table><tr><th>Часть</th><th>Время</th><th>Главная стратегия</th></tr><tr><td>Listening</td><td>30 мин + 2 перенос (CD)</td><td>читать вопросы заранее; следить за ключевыми словами-синонимами</td></tr><tr><td>Reading</td><td>60 мин, 3 текста</td><td>~20 мин на текст; не застревать; True/False/Not Given — только по тексту</td></tr><tr><td>Writing</td><td>60 мин</td><td>Task 1 — 20 мин, Task 2 — 40 мин (она весит вдвое больше)</td></tr><tr><td>Speaking</td><td>11–14 мин</td><td>развёрнуто, но естественно; не учить ответы наизусть</td></tr></table>
<p><b>После теста:</b> выпишите все ошибки в дневник — по типу вопроса (Matching headings, Multiple choice…), а не просто «неправильно».</p>`, q:[

["h","By the end of the test, I ___ (answer) all 40 questions. (Future Perfect)",["will have answered"],"Will have + V3."],

{h:"Неделя целиком: будущее в эссе", th:`<p><b>Прогнозы в Task 2</b> («What will happen…?», «How will … change?»):</p>
<p><i>In the coming decades, automation <b>will</b> almost certainly <b>transform</b> the job market. By 2040, machines <b>will have taken over</b> many routine tasks, and people <b>will be working</b> more flexibly. However, this <b>is likely to</b> widen inequality unless governments <b>invest</b> in retraining.</i></p>
<p>Отметьте: will + наречие уверенности; Future Perfect; Future Continuous; be likely to; unless + Present.</p>
<p><b>Наречия уверенности с will:</b> will <b>almost certainly</b>, will <b>probably</b>, <b>probably won't</b>, will <b>undoubtedly</b>.</p>`, q:[

["h","Найдите ошибку: «Unless governments will act, the problem will grow.»",["act","unless governments act"],"Unless + Present."],
["h","Найдите ошибку: «By 2040, scientists will find a cure for cancer.» (к моменту)",["will have found","by 2040, scientists will have found a cure"],"By → will have found."],
["h","Найдите ошибку: «In 2050 people will be work from home.»",["will be working","people will be working from home"],"Will be + -ing."]]}
];
DAYX[26] = [
{h:"Связки добавления и причины", th:`<p><b>Coherence and Cohesion</b> — 25% оценки Writing. Связки показывают логику.</p>
<table><tr><th>Функция</th><th>Внутри предложения</th><th>Между предложениями</th></tr><tr><td>Добавление</td><td>and, as well as, not only… but also</td><td><b>Moreover</b>, <b>Furthermore</b>, <b>In addition</b>, <b>What is more</b></td></tr><tr><td>Причина</td><td>because, since, as, <b>because of / due to</b> + сущ.</td><td><b>This is because</b>…</td></tr><tr><td>Следствие</td><td>so, so… that</td><td><b>Therefore</b>, <b>As a result</b>, <b>Consequently</b></td></tr></table>
<p><b>because vs because of:</b> <i>because <b>it rained</b></i> (предложение) vs <i>because of <b>the rain</b></i> (существительное).</p>`, q:[
["m","The match was cancelled ___ the rain.",["because","because of","so"],1,"+ сущ. → because of."],
["m","It was late. ___, we took a taxi.",["Because","Therefore","Although"],1,"Следствие → Therefore."],
["m","She speaks French. ___, she's fluent in Spanish.",["Moreover","However","Therefore"],0,"Добавление."],
["m","Flights were delayed ___ to fog.",["because","due","since"],1,"Due to."],
["m","Not only is it cheap, ___ it is also fast.",["and","but","so"],1,"Not only… but also."]]},
{h:"Связки контраста и уступки", th:`<table><tr><th>Тип</th><th>+ предложение</th><th>+ сущ. / -ing</th><th>Между предложениями</th></tr><tr><td>Контраст</td><td>but, whereas, while</td><td>—</td><td><b>However</b>, <b>On the other hand</b>, <b>In contrast</b></td></tr><tr><td>Уступка</td><td><b>although, even though</b></td><td><b>despite, in spite of</b></td><td><b>Nevertheless</b>, <b>Even so</b></td></tr></table>
<ul><li><i><b>Although</b> it was raining, we went out.</i></li><li><i><b>Despite</b> the rain / <b>Despite</b> being tired, we went out.</i></li><li><i>It was raining. <b>However</b>, we went out.</i></li></ul>
<p><b>Ошибки:</b> <s>Despite of</s>; <s>Although…, but…</s> (не ставим оба); <s>despite it was raining</s> → <i>despite the fact that it was raining</i>.</p>`, q:[
["t","___ the rain, we went for a walk. (despite / although)",["despite","in spite of"],"+ сущ. → despite."],
["t","___ she was tired, she kept working. (despite / although)",["although","even though","though"],"+ предложение → although."],
["t","It's expensive. ___, it's worth it. (Однако)",["however","nevertheless"],"Между предложениями."],
["h","Найдите ошибку: «Despite of the cost, many people buy it.»",["despite the cost","in spite of the cost"],"Despite без of."],
["h","Найдите ошибку: «Although he is rich, but he is unhappy.»",["although he is rich, he is unhappy","he is rich, but he is unhappy"],"Не although + but."]]},
{h:"Референция: this, these, such, the former", th:`<p><b>Cohesion</b> — не только связки, но и <b>ссылки назад</b>, чтобы не повторять слова.</p>
<ul><li><b>This / These + существительное:</b> <i>Many people work from home. <b>This trend</b> has…</i> (лучше, чем просто This)</li><li><b>Such + сущ.:</b> <i><b>Such policies</b> can reduce crime.</i></li><li><b>The former / the latter</b> (первое / второе): <i>Cars and bikes… <b>the latter</b> are cleaner.</i></li><li><b>Местоимения:</b> it, they, them, one, those: <i>Rural schools are smaller than <b>those</b> in cities.</i></li></ul>
<p><b>Синонимы:</b> students → learners → young people; government → the authorities → the state.</p>
<p><b>Перебор связок</b> — тоже ошибка. Не начинайте каждое предложение с Moreover.</p>`, q:[
["t","Many cities ban cars. ___ policies reduce pollution. (такие)",["such","these"],"Such / these + сущ."],
["t","Tea and coffee are popular, but the ___ contains more caffeine. (второе)",["latter"],"The latter."],

{h:"Advantages and disadvantages essay", th:`<p><b>Тип:</b> «What are the advantages and disadvantages…?» или «Do the advantages outweigh the disadvantages?»</p>

{h:"Неделя целиком: связный абзац", th:`<p><b>Пример абзаца Band 7:</b></p>

<p>Найдите: topic sentence, пример, следствие, контраст, ссылку назад (this growth), which о целом предложении.</p>
<p><b>Чек-лист абзаца:</b> одна идея → объяснение → пример → вывод; 1–3 связки, а не 6; ссылки this/such вместо повторов.</p>`, q:[

{h:"Инверсия после отрицательных наречий", th:`<p><b>Инверсия</b> — вспомогательный глагол перед подлежащим, как в вопросе. Делает фразу эмфатичной и формальной.</p>

{h:"Условная инверсия и акцент с do", th:`<p><b>Инверсия вместо if</b> (формально):</p>

{h:"Task 1: процесс", th:`<p><b>Process diagram</b> — описать этапы. Ключ: <b>пассив</b> и <b>последовательность</b>.</p>
<ol><li><b>Введение:</b> <i>The diagram <b>illustrates</b> how … <b>is produced</b>.</i></li><li><b>Overview:</b> количество этапов, начало и конец: <i>Overall, there are <b>eight stages</b>, beginning with… and ending with…</i></li><li><b>Body:</b> этапы по порядку.</li></ol>
<p><b>Связки последовательности:</b> First / Initially, Next, Then, After that, Subsequently, Once…, Finally.</p>
<p><b>Пассив:</b> <i>The beans <b>are harvested</b>, <b>then</b> they <b>are dried</b> in the sun. <b>Once</b> they <b>have been dried</b>, they <b>are roasted</b>.</i></p>
<p><b>Natural process</b> (жизненный цикл) — чаще актив: <i>The eggs <b>hatch</b>.</i></p>`, q:[

["t","___ they have been dried, they are roasted. (как только)",["once","after"],"Once."],
["t","Overall, there are six ___ in the process.",["stages","steps"],"Stages."],
["h","Найдите ошибку: «Then the leaves dry in a machine.» (искусств. процесс)",["are dried","then the leaves are dried in a machine"],"Пассив."],
["h","Найдите ошибку: «Firstly, the milk is heat to 70 °C.»",["is heated","the milk is heated"],"Is + V3."]]},
{h:"Неделя целиком: эмфаза в Writing и Speaking", th:`<p><b>Средства эмфазы</b> уровня C1:</p>

{h:"It-cleft: It is … that", th:`<p><b>Cleft sentence</b> (расщеплённое предложение) выделяет одну часть: <b>It is / was + выделенное + that / who + остальное</b>.</p>
<table><tr><th>Обычное</th><th>Выделение</th></tr><tr><td>Anna broke the vase.</td><td><b>It was Anna who</b> broke the vase. (а не Том)</td></tr><tr><td>I met him in Paris.</td><td><b>It was in Paris that</b> I met him.</td></tr><tr><td>Stress causes most problems.</td><td><b>It is stress that</b> causes most problems.</td></tr></table>
<p><b>Для эссе:</b> <i><b>It is</b> governments, not individuals, <b>that</b> should take responsibility.</i> — сильный тезис.</p>
<p><b>Ошибка:</b> <s>It is stress which causes</s> — допустимо, но <b>that</b> универсальнее; для людей — <b>who</b>.</p>`, q:[
["m","___ was my brother who called.",["This","It","He"],1,"It was … who."],
["m","It was in 2015 ___ we met.",["when","that","which"],1,"It was … that."],
["m","Выделите «Anna»: Anna won.",["It was Anna who won.","Anna it was who won.","Was Anna who won."],0,"It was Anna who…"],
["m","It is education ___ changes lives.",["what","that","who"],1,"Вещь → that."],
["m","Cleft sentence нужен, чтобы:",["сократить текст","выделить часть","задать вопрос"],1,"Эмфаза."]]},
{h:"What-cleft: What I need is…", th:`<p><b>What + подлежащее + глагол + is / was + выделенное</b>:</p>
<ul><li><i>I need a holiday.</i> → <i><b>What I need is</b> a holiday.</i></li><li><i>Pollution worries me.</i> → <i><b>What worries me is</b> pollution.</i></li><li><i>He lost his job.</i> → <i><b>What happened was (that)</b> he lost his job.</i></li><li>Действие: <i><b>What you should do is</b> talk to her.</i> (без to!)</li></ul>
<p><b>Варианты:</b> <i><b>All I want is</b>… (всё, что) / <b>The reason why</b>… <b>is that</b>… / <b>The thing that</b>… <b>is</b>…</i></p>
<p><b>Speaking Part 3:</b> <i>What I find really interesting is…</i> — естественный способ начать ответ.</p>`, q:[

{h:"Номинализация: глагол → существительное", th:`<p><b>Номинализация</b> — превращение глаголов и прилагательных в существительные. Главная черта академического стиля.</p>
<table><tr><th>Разговорно</th><th>Академично</th></tr><tr><td>Prices <b>increased</b> sharply.</td><td>There was a sharp <b>increase</b> in prices.</td></tr><tr><td>People are <b>aware</b> of…</td><td>There is growing <b>awareness</b> of…</td></tr><tr><td>If we <b>reduce</b> waste…</td><td>The <b>reduction</b> of waste…</td></tr><tr><td>Because they <b>failed</b>…</td><td>Due to their <b>failure</b>…</td></tr></table>
<p><b>Суффиксы:</b> -tion (reduce → reduction), -ment (develop → development), -ance/-ence (perform → performance), -ness (aware → awareness), -ity (able → ability), -al (approve → approval).</p>`, q:[

{h:"Problem and solution essay", th:`<p><b>Тип:</b> «What problems does … cause? What solutions can you suggest?» (или causes and solutions).</p>
<ol><li><b>Введение:</b> перефраз + анонс: <i>This essay will discuss the main <b>causes</b> of this problem and suggest some <b>solutions</b>.</i></li><li><b>Body 1 — проблемы / причины:</b> <i>The main cause of… is… This <b>results in</b>…</i></li><li><b>Body 2 — решения:</b> <i>One possible solution would be to… This <b>could be achieved</b> by…</i></li><li><b>Вывод.</b></li></ol>
<p><b>Каждое решение</b> должно отвечать на конкретную проблему из Body 1.</p>

{h:"Неделя целиком: академический стиль", th:`<p><b>Пример переписывания:</b></p>

{h:"Безличный пассив: It is said that…", th:`<p><b>Безличный пассив</b> — передача общих мнений, слухов и данных без указания источника. Очень академично.</p>

{h:"Безличный пассив: перефразирование", th:`<p>Частое задание: перевести из одной схемы в другую.</p>
<ol><li><i>People say that she is a genius.</i></li><li>→ <i><b>It is said that</b> she is a genius.</i></li><li>→ <i>She <b>is said to be</b> a genius.</i></li></ol>
<p><b>Прошлое:</b> <i>People believe that the fire <b>started</b> at night.</i> → <i>The fire <b>is believed to have started</b> at night.</i></p>
<p><b>Процесс сейчас:</b> <i>People think he <b>is hiding</b>.</i> → <i>He <b>is thought to be hiding</b>.</i></p>
<p><b>Если глагол-мнение в прошлом:</b> <i>People <b>thought</b> that…</i> → <i>It <b>was thought</b> that… / He <b>was thought</b> to be…</i></p>`, q:[
["t","People say he is a liar. → He is said ___ a liar.",["to be"],"To be."],
["t","People believe the ship sank in 1900. → The ship is believed to ___ in 1900.",["have sunk"],"Прошлое → to have sunk."],
["t","People think she is working abroad. → She is thought to ___ abroad.",["be working"],"Процесс → to be working."],
["t","Experts estimate that 2 million people live here. → It ___ estimated that…",["is"],"It is estimated."],
["h","Найдите ошибку: «The painting is believed to be stolen last year.»",["to have been stolen","is believed to have been stolen"],"Прошлое + пассив."]]},
{h:"Hedging: смягчение утверждений", th:`<p><b>Hedging</b> — осторожные формулировки. В академическом тексте категоричность (<i>always, everyone, prove</i>) — ошибка Task Response.</p>
<table><tr><th>Категорично</th><th>Смягчено</th></tr><tr><td>Social media <b>causes</b> depression.</td><td>Social media <b>may contribute to</b> depression.</td></tr><tr><td><b>Everyone</b> uses phones.</td><td><b>The vast majority of</b> people use phones.</td></tr><tr><td>This <b>proves</b> that…</td><td>This <b>suggests</b> that…</td></tr><tr><td>It <b>is</b> the main reason.</td><td>It <b>is arguably / likely</b> the main reason.</td></tr></table>
<p><b>Средства:</b> may, might, could, tend to, appear to, seem to, likely, possibly, arguably, to some extent, in many cases.</p>`, q:[
["t","Young people ___ to spend more time online. (склонны)",["tend"],"Tend to."],
["t","This ___ that diet affects mood. (предполагает)",["suggests","indicates"],"Suggests."],
["t","Social media ___ contribute to anxiety. (может)",["may","might","can","could"],"Modal hedging."],
["t","This is ___ the most important factor. (пожалуй, можно утверждать)",["arguably","probably","possibly"],"Arguably."],
["h","Смягчите: «All teenagers are addicted to phones.» → ___ teenagers are addicted to phones.",["many","most","a lot of","some"],"Not all."]]},
{h:"Лексика: здравоохранение", th:`<table><tr><td>healthcare system</td><td>система здравоохранения</td></tr><tr><td>public / private healthcare</td><td>гос. / частная медицина</td></tr><tr><td>access to healthcare</td><td>доступ к медицине</td></tr><tr><td>an ageing population</td><td>стареющее население</td></tr><tr><td>chronic disease</td><td>хроническое заболевание</td></tr><tr><td>vaccination</td><td>вакцинация</td></tr><tr><td>a pandemic / an outbreak</td><td>пандемия / вспышка</td></tr><tr><td>medical breakthrough</td><td>прорыв в медицине</td></tr><tr><td>be underfunded / understaffed</td><td>недофинансирован / нехватка персонала</td></tr></table>
<p><b>Безличный пассив в теме:</b> <i>It is estimated that one in five adults… / Obesity is thought to be…</i></p>`, q:[
["t","Стареющее население: an ___ population.",["ageing","aging"],"Ageing."],
["t","Нехватка персонала: under___.",["staffed"],"Understaffed."],
["t","It is ___ that 1 in 5 adults is obese. (подсчитано)",["estimated"],"It is estimated."],
["h","Найдите ошибку: «Obesity is thought being a major problem.»",["to be","obesity is thought to be a major problem"],"Thought to be."],
["h","Смягчите: «Vaccines prevent all diseases.» → Vaccines ___ prevent many diseases.",["can","help","may"],"Hedging."]]},
{h:"Task 1: карты", th:`<p><b>Maps</b> — изменения места за время (обычно две карты: было / стало).</p>
<ol><li><b>Введение:</b> <i>The maps <b>illustrate</b> the changes to… between 1990 and 2020.</i></li><li><b>Overview:</b> главные изменения: <i>Overall, the area became more <b>urbanised</b>, with… <b>being replaced</b> by…</i></li><li><b>Body:</b> по районам или по направлениям.</li></ol>
<p><b>Пассив для изменений:</b> was built / was demolished / was replaced by / was converted into / was extended / was relocated.</p>
<p><b>Расположение:</b> in the north-east, to the south of, next to, opposite, along the river.</p>`, q:[
["t","The old factory ___ (demolish).",["was demolished"],"Пассив."],
["t","The farm was converted ___ a housing estate.",["into"],"Converted into."],
["t","The park was replaced ___ a car park.",["by","with"],"Replaced by."],
["h","Найдите ошибку: «A new school built in the north.»",["was built","a new school was built in the north"],"Пассив."],
["h","Найдите ошибку: «The forest was replaced to houses.»",["by houses","replaced by"],"Replaced by."]]},
{h:"Неделя целиком: объективный тон", th:`<p><b>Объективность</b> = безличный пассив + hedging + номинализация.</p>
<p><s>I think social media is terrible because everyone is addicted.</s></p>
<p>→ <i><b>It is widely believed that</b> social media <b>may</b> have a negative impact on mental health. <b>A significant proportion of</b> young people <b>appear to</b> spend excessive time online, <b>which is thought to</b> contribute to anxiety.</i></p>
<p><b>Важно:</b> позицию в эссе всё равно высказываем явно (I believe…) — во введении и выводе. Hedging — для аргументов, а не для отказа от мнения.</p>`, q:[
["m","Which is hedged?",["This always happens.","This tends to happen.","This happens to everyone."],1,"Tend to."],
["h","Перефразируйте: «People know that smoking is harmful.» → Smoking ___ to be harmful.",["is known"],"Is known to be."],
["h","Перефразируйте: «Experts believe the city was founded in 900.» → The city is believed to ___ in 900.",["have been founded"],"To have been + V3."],
["h","Найдите ошибку: «It is believe that…»",["it is believed that","believed"],"Is believed."],
["h","Перефразируйте: «Social media seems to cause stress.» → Social media ___ to cause stress.",["appears","seems"],"Appears to."]]}
];

{h:"Причастные обороты с -ing", th:`<p><b>Participle clause</b> — сокращённое придаточное. Делает текст компактнее.</p>
<table><tr><th>Полное</th><th>Сокращённое</th></tr><tr><td><i>When I walked home, I saw…</i></td><td><i><b>Walking</b> home, I saw…</i></td></tr><tr><td><i>Because she felt ill, she left.</i></td><td><i><b>Feeling</b> ill, she left.</i></td></tr><tr><td><i>The man who is sitting there…</i></td><td><i>The man <b>sitting</b> there…</i></td></tr></table>
<p><b>Главное правило:</b> подлежащее оборота = подлежащее главного предложения.</p>
<p><s>Walking home, it started to rain.</s> — получается, что шёл дождь! → <i>While I was walking home, it started to rain.</i> (dangling participle)</p>`, q:[
["m","___ the news, she started crying.",["Hearing","Heard","To hear"],0,"Активно, одновременно → -ing."],
["m","The woman ___ to Tom is my aunt.",["talked","talking","talks"],1,"Who is talking → talking."],
["m","Which is wrong?",["Walking home, I saw a fox.","Walking home, it started raining.","Feeling tired, I went to bed."],1,"Dangling participle."],
["m","___ ill, he stayed at home.",["Felt","Feeling","Feel"],1,"Причина → -ing."],
["m","Participle clause делает текст:",["длиннее","компактнее","разговорнее"],1,"Компактнее."]]},
{h:"Обороты с V3 и having done", th:`<p><b>V3 (пассивный смысл):</b></p>
<ul><li><i><b>Built</b> in 1890, the bridge is still in use.</i> = which was built</li><li><i><b>Shocked</b> by the news, she sat down.</i></li><li><i>The data <b>collected</b> in the survey…</i></li></ul>
<p><b>Having + V3 — сначала одно, потом другое:</b></p>
<ul><li><i><b>Having finished</b> work, I went home.</i> = After I had finished…</li><li><i><b>Having lived</b> abroad, she understands other cultures.</i></li><li>Пассив: <i><b>Having been told</b> the truth, he apologised.</i></li></ul>`, q:[
["t","___ (write) in 1850, the novel is still popular. (пассивный смысл)",["written"],"V3."],
["t","___ (finish) my essay, I went to bed. (сначала одно)",["having finished"],"Having + V3."],
["t","The report ___ (publish) yesterday shows…",["published"],"Which was published → published."],
["t","___ (shock) by the price, I left the shop.",["shocked"],"V3 — пассив."],
["t","___ (lose) my keys, I couldn't get in.",["having lost"],"Сначала → having lost."]]},
{h:"Обороты с союзами: while, after, before, when", th:`<p>Причастие можно оставить с союзом для ясности:</p>
<ul><li><i><b>While studying</b> in London, I met many people.</i></li><li><i><b>After graduating</b>, she moved abroad.</i></li><li><i><b>Before leaving</b>, check the windows.</i></li><li><i><b>When asked</b> about the problem, he refused to comment.</i> (пассив)</li><li><i><b>If used</b> correctly, the medicine is safe.</i></li></ul>
<p><b>Также:</b> <i><b>Not knowing</b> what to do, I called my mum.</i> (отрицание — not перед причастием)</p>
<p><b>With + сущ. + -ing</b> (обстоятельство): <i><b>With prices rising</b>, many people are struggling.</i></p>`, q:[
["t","___ studying in Moscow, I lived with my aunt. (пока)",["while"],"While + -ing."],
["t","After ___ (graduate), she found a job.",["graduating"],"After + -ing."],
["t","When ___ (ask) about it, he said nothing.",["asked"],"Пассив → V3."],
["t","___ knowing the answer, I stayed silent. (не зная)",["not"],"Not knowing."],
["h","Найдите ошибку: «Having not finished, I stayed late.»",["not having finished","not having finished, i stayed late"],"Not перед having."]]},

["h","Сократите: «As emissions are rising, governments must act.» → With emissions ___, governments must act.",["rising"],"With + -ing."]]},
{h:"Полный Speaking-тест", th:`<p><b>Speaking — 3 части, 11–14 минут:</b></p>
<table><tr><th>Часть</th><th>Что</th><th>Длина ответа</th></tr><tr><td>Part 1</td><td>4–5 мин, о себе (work, home, hobbies)</td><td>2–3 предложения</td></tr><tr><td>Part 2</td><td>1 мин подготовка + 2 мин монолог</td><td>говорить до остановки</td></tr><tr><td>Part 3</td><td>4–5 мин, абстрактное обсуждение</td><td>4–6 предложений</td></tr></table>
<p><b>Критерии (по 25%):</b> Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation.</p>
<p><b>Для 7+:</b> говорите без длинных пауз, используйте идиоматику естественно, сложные структуры (условные, причастия, cleft) — без ошибок в простых.</p>
<p><b>Если не поняли вопрос:</b> <i>Sorry, could you repeat the question? / Do you mean…?</i> — это нормально и не снижает балл.</p>`, q:[
["t","Сколько минут длится монолог в Part 2? (число)",["2"],"2 минуты."],
["t","Sorry, could you ___ the question?",["repeat"],"Repeat."],
["m","Which is correct?",["Being a child, my grandmother told me stories.","When I was a child, my grandmother told me stories.","Been a child, my grandmother told me stories."],1,"Иначе выходит, что ребёнком была бабушка."],
["h","Сократите: «After I had finished school, I moved to Kazan.» → ___ finished school, I moved to Kazan.",["having"],"Having + V3."],
["h","Сократите: «The people who live next door are noisy.» → The people ___ next door are noisy.",["living"],"Living."]]},
{h:"Неделя целиком: компактный текст", th:`<p><b>До:</b> <i>The report was published in May. It shows that unemployment has risen. Because unemployment is rising, many young people are moving abroad.</i></p>
<p><b>После:</b> <i>The report, <b>published</b> in May, shows that unemployment has risen. <b>With unemployment rising</b>, many young people are moving abroad.</i></p>
<p><b>Чек-лист причастий:</b></p>
<ol><li>-ing — активный смысл, одновременно;</li><li>V3 — пассивный смысл;</li><li>having + V3 — раньше главного действия;</li><li>подлежащее совпадает с главным предложением;</li><li>not — перед причастием.</li></ol>`, q:[
["m","Which is correct?",["Finishing the test, the bell rang.","Having finished the test, I handed it in.","Finished the test, I handed it in."],1,"Подлежащее совпадает, having + V3."],
["h","Сократите: «The bridge, which was built in 1900, is famous.» → The bridge, ___ in 1900, is famous.",["built"],"V3."],
["h","Сократите: «Because I didn't know the way, I got lost.» → Not ___ the way, I got lost.",["knowing"],"Not knowing."],
["h","Сократите: «When she was asked about her plans, she smiled.» → When ___ about her plans, she smiled.",["asked"],"When asked."],
["h","Исправьте: «Looking out of the window, the mountains were beautiful.» → Looking out of the window, I ___ the beautiful mountains.",["saw"],"Подлежащее оборота = I."]]}
];

{h:"Коллокации: make и do", th:`<p><b>Коллокации</b> — слова, которые «дружат». Lexical Resource 7+ требует точных сочетаний.</p>
<table><tr><th>make (создать, результат)</th><th>do (действие, работа)</th></tr><tr><td>make a decision, a mistake, a mess, progress, an effort, money, a difference, a suggestion, an appointment, friends</td><td>do homework, research, business, damage, harm, your best, exercise, a favour, the shopping, a course</td></tr></table>
<p><b>Типичные ошибки:</b> <s>do a mistake</s> → make a mistake; <s>make research</s> → do research; <s>do a decision</s> → make a decision; <s>make sport</s> → do sport.</p>`, q:[
["m","I ___ a mistake in the test.",["did","made","had"],1,"Make a mistake."],
["m","She ___ research on climate change.",["makes","does","takes"],1,"Do research."],
["m","We need to ___ a decision.",["do","make","get"],1,"Make a decision."],
["m","Could you ___ me a favour?",["make","do","give"],1,"Do a favour."],
["m","Small actions can ___ a big difference.",["do","make","have"],1,"Make a difference."]]},
{h:"Коллокации: прилагательное + существительное", th:`<table><tr><th>Вместо</th><th>Коллокация</th></tr><tr><td>big problem</td><td>a <b>serious / major / pressing</b> problem</td></tr><tr><td>big rain</td><td><b>heavy</b> rain</td></tr><tr><td>strong coffee ✓, но не strong rain</td><td>strong wind, <b>heavy</b> traffic</td></tr><tr><td>big chance</td><td>a <b>good / strong</b> chance</td></tr><tr><td>very important</td><td><b>vital / crucial / essential</b></td></tr><tr><td>high price ✓</td><td>high price, <b>steep</b> increase, <b>sharp</b> fall</td></tr><tr><td>big effect</td><td>a <b>significant / profound / detrimental</b> effect</td></tr></table>

{h:"Идиомы для Speaking", th:`<p><b>Идиомы</b> — для Speaking (в Writing — почти никогда). Использовать естественно и точно.</p>
<table><tr><td>a piece of cake</td><td>очень легко</td></tr><tr><td>once in a blue moon</td><td>очень редко</td></tr><tr><td>hit the books</td><td>засесть за учёбу</td></tr><tr><td>be over the moon</td><td>быть счастливой</td></tr><tr><td>cost an arm and a leg</td><td>стоить целое состояние</td></tr><tr><td>under the weather</td><td>неважно себя чувствовать</td></tr><tr><td>a breath of fresh air</td><td>глоток свежего воздуха (что-то новое)</td></tr><tr><td>get the hang of</td><td>освоиться, наловчиться</td></tr><tr><td>on the go</td><td>в движении, постоянно занят</td></tr></table>
<p><b>Ошибка:</b> вставлять идиомы ради идиом (<i>It's raining cats and dogs</i> — звучит устаревше). 2–3 уместные за тест достаточно.</p>`, q:[
["t","The test was a piece of ___. (очень легко)",["cake"],"A piece of cake."],
["t","I go to the cinema once in a blue ___.",["moon"],"Once in a blue moon."],
["t","The new phone cost an arm and a ___.",["leg"],"Cost an arm and a leg."],
["t","I was over the ___ when I got the results.",["moon"],"Over the moon."],
["t","It took me a week to get the ___ of the new software.",["hang"],"Get the hang of."]]},
{h:"Лексика: культура и искусство", th:`<table><tr><td>cultural heritage</td><td>культурное наследие</td></tr><tr><td>a work of art / a masterpiece</td><td>произведение / шедевр</td></tr><tr><td>an exhibition / a gallery</td><td>выставка / галерея</td></tr><tr><td>performing arts</td><td>исполнительские виды искусства</td></tr><tr><td>fund the arts / arts funding</td><td>финансировать искусство</td></tr><tr><td>be preserved for future generations</td><td>быть сохранённым для будущих поколений</td></tr><tr><td>thought-provoking</td><td>заставляющий задуматься</td></tr><tr><td>mainstream / niche</td><td>массовый / узкий</td></tr><tr><td>broaden one's horizons</td><td>расширить кругозор</td></tr></table>

{h:"Part 2: 10 карточек на время", th:`<p><b>Тренировка Part 2</b> — главное, научиться говорить <b>2 минуты без остановки</b>.</p>
<p><b>Метод 4 пунктов:</b> 1 минута подготовки → ключевые слова к каждому пункту карточки + 1 идея «почему».</p>
<p><b>Если идеи кончились:</b></p>
<ul><li>расскажите предысторию: <i>Before that, I had never…</i></li><li>сравните: <i>Compared to other…, this one was…</i></li><li>чувства: <i>What I remember most is how I felt…</i></li><li>что было бы иначе: <i>If I hadn't gone, I would never have…</i></li></ul>
<p><b>Темы карточек:</b> a person you admire, a place you visited, a skill you learned, a gift, a book, a decision, a time you helped someone, an app, a law you'd change, a celebration.</p>`, q:[
["t","What I remember ___ is the atmosphere. (больше всего)",["most"],"What I remember most."],
["t","If I hadn't gone, I would never ___ met her.",["have"],"Would never have met."],
["h","Найдите ошибку: «I'd like to talk about a person who I admire him.»",["who i admire","a person who i admire","a person i admire"],"Без him."],
["h","Найдите ошибку: «It was the first time I see snow.»",["had seen","it was the first time i had seen snow"],"Was the first time + Past Perfect."],
["h","Найдите ошибку: «He taught me how to do decisions.»",["make decisions","how to make decisions"],"Make decisions."]]},
{h:"Неделя целиком: естественная лексика", th:`<p><b>Как растёт Lexical Resource:</b></p>
<ol><li><b>Band 6:</b> достаточно слов, но ошибки в коллокациях.</li><li><b>Band 7:</b> менее частые слова, <b>коллокации</b>, некоторые идиомы, перефразирование.</li><li><b>Band 8:</b> широкий диапазон, естественно и точно, редкие ошибки.</li></ol>
<p><b>Стратегия:</b> учите слова <b>блоками</b> (collocation chunks), а не по одному: не «decision», а «make a tough decision». В Speaking — 2–3 идиомы, в Writing — ноль идиом, но много коллокаций.</p>`, q:[

// The study mode (S.cfg): which weekdays and how many hours a week. The weekly template is written for
// 6 days and 13 hours; minutes are scaled by hours/13 and the week's tasks are spread over the chosen days.
// Task ids come from the template, so ticks survive a change of mode.
const BASE = [], BYID = {}; // all tasks
const DEF_CFG = {days:[1,1,1,1,1,1,0], hours:13};
function cfg(){ const c = S.cfg || DEF_CFG; const days = c.days.filter(Boolean).length >= 2 ? c.days : DEF_CFG.days; return {days, hours: Math.min(25, Math.max(4, Number(c.hours)||13))}; }
const studyDays = () => cfg().days.map((on,i)=>on?i:-1).filter(i=>i>=0);
// Review weeks and weeks 37–38 get a recap lesson per day built from earlier lessons:
// the rule is folded (recall first, then check), plus the hardest task of each lesson.
const RECAP = new Set([...REVIEW, 37, 38]);
const WEAK_DEF = {37:[14,18,23], 38:[27,30,31]};
function weakWeeks(w){
  const sel = (S.weakSel ||= {}); if(sel[w]) return sel[w];
  const cnt = {}; Object.keys(S.err||{}).forEach(q => { const x = Number(q.split(":")[1]); if(DAYX[x] && !RECAP.has(x)) cnt[x] = (cnt[x]||0) + S.err[q].n; });
  const top = Object.keys(cnt).map(Number).sort((a,b) => cnt[b]-cnt[a]).filter(x => w===37 ? x < 26 || x===27 : true);
  const other = w===37 ? 38 : 37, taken = new Set(sel[other]||[]);
  const pick = [...top.filter(x=>!taken.has(x)), ...WEAK_DEF[w]].filter((x,i,a) => a.indexOf(x)===i).slice(0,3).sort((a,b)=>a-b);
  if(today() >= add(START,(w-1)*7)) sel[w] = pick; // frozen once the week starts, so saved answers keep their questions
  return pick;
}
let recapsBuilt = false;
function buildRecaps(){
  recapsBuilt = true;
  for(const w of RECAP){
    const src = (w===37 || w===38 ? weakWeeks(w) : [w-3,w-2,w-1]).filter(x => DAYX[x] && !RECAP.has(x));
    DAYX[w] = src.flatMap(x => [[0,1,2],[3,4,5]].map(js => {
      const Ls = js.map(j => DAYX[x][j]).filter(Boolean);
      return {h:`Неделя ${x}: ${Ls.map(L=>L.h).join(" · ")}`,
        th:`<p class="hint">Сначала вспомните правило сами, потом откройте и проверьте себя.</p>${Ls.map(L=>`<details class="phr"><summary>${L.h}</summary>${L.th}</details>`).join("")}`,
        q: Ls.map(L => L.q[L.q.length-1])};

}
function buildBase(){

    const flat = []; tpl.forEach((day,d)=> day.forEach(([skill,min,kind],i)=> flat.push({id:`w${w}d${d}t${i}`, w, d, skill, kind, min: Math.max(10, Math.round(min*f/5)*5)})));

// A moved task is cut into pieces of up to 30 minutes so it can be spread over several days.
const partsOf = t => { const p = []; for(let m = t.min; m > 0; m -= 30) p.push(Math.min(30,m)); return p; };
const pieceDone = (t,k) => !!(S.done[t.id] || S.done[t.id+"#"+k]);

var DDM = {};
function lessonDoneOn(w, date){ const m = DDM[w] ||= Object.fromEntries(weekDays(w).map(d => [d.date, d.done])); return !!m[date]; }

// ---------- rescheduling ----------
// Missed tasks are spread evenly over the remaining days of the week (+30 min a day, Sunday up to +120),
// then over the next review week (+60 min a day). Whatever still does not fit is backlog.
function plan(){
  const T = today(), moved = {}, extra = {}, backlog = [], parentMoved = {}, pieces = {};
  const overdue = BASE.filter(t => !isDone(t.id) && (t.date < T || S.skipped[t.date]));
  const SD = cfg().days, cap = s => SD[dow(s)] ? 30 : 120;
  const queue = [];
  for(const t of overdue){ const ps = partsOf(t); ps.forEach((m,k)=>{ if(!pieceDone(t,k)) queue.push({id:t.id+"#"+k, parent:t.id, w:t.w, skill:t.skill, kind:t.kind, date:t.date, min:m, part:k+1, of:ps.length}); }); }
  for(const t of queue){
    pieces[t.id] = t;
    let from = t.date < T ? (S.skipped[T] ? add(T,1) : T) : add(t.date,1);
    if(from < START) from = START;
    let placed = null;
    const sunday = add(from, 6-dow(from));
    let best = null;
    for(let s = from; s <= sunday; s = add(s,1)){
      if(S.skipped[s] || s > END) continue;
      const e = extra[s]||0;
      if(e + t.min <= cap(s) && (best===null || e < (extra[best]||0))) best = s;
    }
    placed = best;
    if(!placed){
      const wk = Math.max(1, weekOf(from));
      const rw = [...REVIEW].find(r => r > wk || (r===wk && dow(from)<6));
      if(rw){
        let b2 = null;
        for(const d of studyDays()){ const s = add(START,(rw-1)*7+d); if(s < from || S.skipped[s]) continue; const e = extra[s]||0; if(e + t.min <= 60 && (b2===null || e < (extra[b2]||0))) b2 = s; }
        placed = b2;
      }
    }
    if(placed){ moved[t.id] = placed; extra[placed] = (extra[placed]||0) + t.min; (parentMoved[t.parent] ||= []).push(placed); }
    else backlog.push(t);
  }
  return {moved, extra, backlog, parentMoved, pieces, overdueCount: overdue.length};
}
function tasksOn(s, P){
  const own = BASE.filter(t => t.date===s);
  const incoming = Object.entries(P.moved).filter(([,d])=>d===s).map(([id])=>P.pieces[id]);
  return {own, incoming};
}

function pctOf(list){ if(!list.length) return 0; return Math.round(100*list.filter(t=>isDone(t.id)).length/list.length); }

function taskRow(t, s, P, opts){
  const info = taskInfo(t.w, t.skill, t.kind);
  const done = opts.incoming ? !!S.done[t.id] : isDone(t.id);
  const movedTo = P.parentMoved[t.id];
  const meta = [];
  meta.push(`<span class="chip">${SKILL[t.skill]}</span>`);
  if(opts.incoming) meta.push(`<span class="moved">перенесено с ${fmt(t.date)}${t.of>1?`, часть ${t.part} из ${t.of}`:""}</span>`);
  if(!opts.incoming && movedTo && !done) meta.push(`<span class="moved">перенесено: ${[...new Set(movedTo)].map(d=>fmt(d)).join(", ")}</span>`);
  info.links.forEach(([n,u]) => meta.push(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`));
  if(info.anchor) meta.push(`<a href="${info.anchor}">открыть на сайте</a>`);
  const gpt = info.gpt ? `<div><button class="gpt" data-prompt="${t.id}">Сделать с ChatGPT</button></div>` : "";
  const sp = spentLabel(t.id, t.min); if(sp) meta.push(sp);
  const running = S.timer && S.timer.id === t.id;
  return `<li class="task${done?" done":""}"><input type="checkbox" id="cb-${t.id}" data-task="${t.id}" ${done?"checked":""} aria-label="Готово"><div><label class="tt" for="cb-${t.id}">${esc(info.title)}</label><div class="tmeta">${meta.join("")}</div>${gpt}</div><span class="tside"><span class="tmin">${t.min} мин</span>${done?"":`<button class="tplay${running?" on":""}" data-tmstart="${t.id}" aria-label="Запустить таймер на ${t.min} минут">${running?"идёт":"▶"}</button>`}</span></li>`;
}

function viewCalendar(){
  const T = today(), P = plan();
  if(!selDate) selDate = T < START ? START : T;
  if(!calMonth) calMonth = selDate.slice(0,7);
  const [y,m] = calMonth.split("-").map(Number);
  const first = `${calMonth}-01`, gridStart = add(first, -dow(first));
  const daysInMonth = new Date(Date.UTC(y,m,0)).getUTCDate();
  const cells = [];
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(d=>cells.push(`<div class="dow">${d}</div>`));
  const totalCells = Math.ceil((dow(first)+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const s = add(gridStart,i), inMonth = s.slice(0,7)===calMonth, inProg = s>=START && s<=END;
    if(!inMonth || !inProg){ cells.push(`<div class="day out" aria-hidden="true"><span class="n">${Number(s.slice(8))}</span></div>`); continue; }
    const {own,incoming} = tasksOn(s,P);
    const stay = own.filter(t => !P.parentMoved[t.id] || isDone(t.id));
    const all = stay.concat(incoming);
    const min = all.reduce((a,t)=>a+t.min,0);
    const cls = ["day"]; if(REVIEW.has(weekOf(s))) cls.push("review"); if(s===T) cls.push("today"); if(s===selDate) cls.push("sel");
    const dots = all.slice(0,6).map(t=>`<i class="${(t.parent?S.done[t.id]:isDone(t.id))?"d":""}"></i>`).join("");
    cells.push(`<button class="${cls.join(" ")}" data-day="${s}" aria-label="${fmt(s)}"><span class="n">${Number(s.slice(8))}</span><span class="m">${min?String(Math.round(min/6)/10).replace(".",",")+" ч":S.skipped[s]?"пропуск":"выходной"}</span>${incoming.length?`<span class="mv">+${incoming.length}</span>`:""}<span class="dots">${dots}</span></button>`);
  }
  const monthName = new Date(Date.UTC(y,m-1,1)).toLocaleDateString("ru-RU",{month:"long",year:"numeric",timeZone:"UTC"});
  const {own,incoming} = tasksOn(selDate,P);
  const w = weekOf(selDate);
  const list = own.map(t=>taskRow(t,selDate,P,{})).join("") + incoming.map(t=>taskRow(t,selDate,P,{incoming:true})).join("");
  const backlogMin = P.backlog.reduce((a,t)=>a+t.min,0);
  let notice = "";
  if(backlogMin > 0) notice = `<div class="notice warn">Отставание: ${P.backlog.length} заданий (${Math.round(backlogMin/60)} ч) не помещаются до ближайшей недели-повторения. Можно сократить дополнительные материалы или сдвинуть дату экзамена.</div>`;
  else if(P.overdueCount) notice = `<div class="notice info">Пропущенные задания (${P.overdueCount}) перенесены на следующие дни: не больше +30 минут в будни и до 2 часов в воскресенье.</div>`;
  const canSkip = selDate >= T && selDate <= END && own.length;
  return `
  <h2>Календарь <em>занятий</em></h2>
  <p class="sub">Отмечайте выполненные задания. Если день пропущен, его задания сами распределятся по оставшимся дням недели, а остаток уйдёт в ближайшую неделю-повторение.</p>
  ${notice}
  <div class="grid2">
    <section class="panel" aria-label="Календарь">
      <div class="calhead">
        <button class="iconbtn" data-cal="-1" aria-label="Предыдущий месяц">←</button>
        <strong>${monthName}</strong>
        <button class="iconbtn" data-cal="1" aria-label="Следующий месяц">→</button>
        <label class="sim" for="simDate">Сегодня (для проверки)<input type="date" id="simDate" value="${today()}" min="${START}" max="${END}"></label>
      </div>
      <div class="cal">${cells.join("")}</div>
      <div class="legend"><span style="--c:var(--lime)">неделя-повторение</span><span style="--c:var(--ok)">сделано</span><span style="--c:var(--accent)">сегодня</span></div>
    </section>
    <section class="panel" aria-label="Задания дня">
      <div class="dayhead"><h3>${fmt(selDate,{weekday:"long",day:"numeric",month:"long"})}</h3><span class="wk">Неделя ${w} · ${esc(W[w][0])}</span></div>
      ${list ? `<ul class="tasks">${list}</ul>` : `<p class="empty">${S.skipped[selDate]?"День пропущен, задания перенесены.":"Свободный день. Сюда переносятся пропущенные задания недели."}</p>`}
      <div class="btnrow">
        ${canSkip ? (S.skipped[selDate] ? `<button class="btn" data-unskip="${selDate}">Вернуть день</button>` : `<button class="btn danger" data-skip="${selDate}">Не смогу заниматься в этот день</button>`) : ""}
        ${S.sim ? `<button class="btn" id="simReset">Вернуть настоящую дату</button>` : ""}
      </div>
    </section>

// One path through the day: lesson, cards, warm-up, mistakes. Each step shows whether it is done.
// "?" hint next to terms: hover or tap shows the explanation.
function tip(t){ return `<span class="tip" tabindex="0" role="note" aria-label="${esc(t)}" data-tip="${esc(t)}">?</span>`; }
function daySteps(day){
  const w = Math.min(39, Math.max(1, weekOf(day))), days = weekDays(w);
  let d = days.find(x => x.date===day), rest = false;
  if(!d){ rest = true; d = days.find(x => !x.done && x.date <= day) || days.find(x => !x.done); }
  const wm = warmToday(), wd = wm.ids.filter(id=>wm.ans[id]!==undefined).length;
  const errDue = Object.values(S.err||{}).filter(e=>e.due<=today()).length, cardsDue = qzAllItems().filter(x=>qzDue(x.key)).length, cardsToday = (S.clog||{})[today()]||0;
  const L = DAYX[w], heads = d && L ? L.filter((_,j)=>Math.min(days.length-1, Math.floor(j*days.length/L.length))===d.k).map(x=>x.h) : [];
  const answered = d ? d.items.filter(it => S.ans[it.key]!==undefined).length : 0;
  return [
    d && {ok:d.done, short:"урок дня", label:`Урок: ${esc(heads.join(" · ") || W[w][0])}`, sub:`${rest?"сегодня выходной, можно догнать · ":""}неделя ${w}, день ${d.k+1} · заданий ${answered} из ${d.items.length}`, attrs:`href="#course" data-golesson="${w}:${d.k}"`, btn:d.done?"Открыть":answered?"Продолжить":"Начать"},
    {ok:cardsDue===0 || cardsToday>=10, short:"карточки слов", label:"Карточки слов", sub:cardsDue?`к повторению ${cardsDue}, сегодня пройдено ${cardsToday}`:"на сегодня всё повторено", attrs:`href="#cards" data-qzset="due"`, btn:"Повторить"},
    {ok:wd===5, short:"разминка", label:`Разминка: 5 вопросов из прошлых недель${tip("Короткая проверка старых тем, чтобы они не забывались. Каждый день новые вопросы.")}`, sub:`сделано ${wd} из 5`, attrs:`href="#practice" data-prgo-home="warm"`, btn:"Открыть"},
    {ok:errDue===0, short:"работа над ошибками", label:`Работа над ошибками${tip("Каждый неверный ответ возвращается через 1, 3 и 7 дней, пока вы не ответите верно три раза подряд.")}`, sub:errDue?`${errDue} ${plural(errDue,"ошибка","ошибки","ошибок")} к повторению`:"ошибок к повторению нет", attrs:`href="#practice" data-prgo-home="err"`, btn:"Открыть"}
  ].filter(Boolean);
}
function lessonOfDay(day){
  const st = daySteps(day), next = st.findIndex(x => !x.ok);
  return `<section class="block ld">
    <div class="block-head"><h2>План <em>на сегодня</em></h2><span class="pill">${next<0?"всё сделано ✓":`шаг ${next+1} из ${st.length}`}</span></div>
    <ol class="ld-steps">${st.map((x,i) => `<li class="ld-s${x.ok?" ok":""}${i===next?" next":""}"><span class="ld-c">${x.ok?"✓":i+1}</span><div><b>${x.label}</b><span class="hint">${x.sub}</span></div><a class="btn${i===next?" primary":""}" ${x.attrs}>${x.btn}</a></li>`).join("")}</ol>
  </section>`;
}

let STEPS_PREV = null, LAST_ACT = 0;
["click","keydown"].forEach(t => document.addEventListener(t, () => LAST_ACT = Date.now(), true));
function stepToast(){
  try {
    const st = daySteps(today()), n = st.filter(x => x.ok).length;
    if(STEPS_PREV!==null && n > STEPS_PREV && Date.now() - LAST_ACT < 3000){ const nx = st.find(x => !x.ok); toast(nx ? `Шаг выполнен ✓ Дальше: ${nx.short}` : "Все шаги на сегодня сделаны. Отличная работа!", 4500); }
    STEPS_PREV = n;
  } catch(e){}
}

function viewHome(){

  const examDays = Math.max(0, Math.round((toD(END)-toD(T))/DAY));
  const day = before ? START : T;

  const list = own.map(t=>taskRow(t,day,P,{})).join("") + incoming.map(t=>taskRow(t,day,P,{incoming:true})).join("");

    const opts = q[1].map((o,j)=>{ let c="opt"; if(a!==undefined){ if(j===q[2]) c+=" right"; else if(j===a) c+=" wrong"; } return `<button class="${c}" data-q="${key}" data-o="${j}" ${a!==undefined?"disabled":""}>${esc(o)}</button>`; }).join("");
    return `<div class="q"><p>${i+1}. ${esc(q[0])}</p><div class="opts">${opts}</div>${a!==undefined?`<div class="why">${esc(q[3])}</div>`:""}</div>`;
  }).join("");
  const tq = EXT[w] || (REVIEW.has(w) ? [w-3,w-2,w-1].flatMap(k=>EXT[k]||[]) : []);
  let n = qs.length;
  const typedBlock = (list, pre) => list.map((q,i)=>{
    const key = `${w}-${pre}${i}`, a = S.ans[key];
    let res = "";
    if(a!==undefined){ answered++;
      const fix = q[0].startsWith("Найдите ошибку");
      const ok = q[1].some(x => norm(x)===norm(a) || (fix && (" "+norm(a)+" ").includes(" "+norm(x)+" "))) || altOk(keyToQid(key), a);
      if(ok) right++;
      res = typedRes(q, a, ok, keyToQid(key)); }
    n++;
    return `<div class="q"><p>${n}. ${esc(q[0])}</p><div class="opts"><input class="tin" id="in-${key}" data-tin="${key}" value="${a!==undefined?esc(a):""}" ${a!==undefined?"disabled":""} autocomplete="off" spellcheck="false" aria-label="Ответ"><button class="opt" data-check="${key}" ${a!==undefined?"disabled":""}>Проверить</button></div>${res}</div>`;
  }).join("");
  const typed = typedBlock(tq, "t");
  const hq = HARD[w] || (REVIEW.has(w) ? [w-3,w-2,w-1].flatMap(k=>HARD[k]||[]) : []);
  const hard = typedBlock(hq, "h");
  const total = qs.length + tq.length + hq.length;
  if(!total) return "";
  return `<div class="ex">${qs.length?`<p class="exh">Выберите ответ</p>`:""}${html}${tq.length?`<p class="exh">Впишите ответ</p>${typed}`:""}${hq.length?`<p class="exh">Сложнее: ошибки, перефразирование, контекст</p><p class="hint">Где нужно найти ошибку, впишите исправленный фрагмент или всё предложение. Где пропусков несколько, впишите ответы через пробел.</p>${hard}`:""}<div class="btnrow" style="margin-top:0;align-items:center"><span class="score">${right} / ${total} верно</span>${answered?`<button class="btn" data-reset="${w}">Пройти заново</button>`:""}</div></div>`;
}
const flip = {}, order = {};
const queue = w => (order[w] ||= CARDS[w].map((c,i)=>i)).filter(i=>!S.known[`${w}-${i}`]);
function flash(w){
  const deck = CARDS[w], left = queue(w);
  const known = deck.length - left.length;
  if(!left.length) return `<p class="empty">Все ${deck.length} слов выучены. <button class="btn" data-cardreset="${w}">Повторить заново</button></p>`;
  const i = left[0], c = deck[i], f = flip[w];
  return `<div class="cards"><button class="card" data-flip="${w}"><span class="w">${esc(c[0])}</span><span class="t">${f?esc(c[1]):"нажмите, чтобы увидеть перевод"}</span></button>
  <div class="btnrow" style="margin-top:0;align-items:center"><button class="btn primary" data-know="${w}-${i}">Знаю</button><button class="btn" data-later="${w}">Ещё раз</button><span class="score">${known} / ${deck.length}</span></div></div>`;
}
