// Spread the lists over the course: each topic goes to the weeks that match its level and the week's theme,
// and the spelling list fills the rest, so every study week gets about the same number of new words.
const VPLAN = {home:[1,2,3], work:[5,6,7], study:[9,10,11], pv:[13,14,15], task1:[17,18,19,25,26,27], crime:[21,22,23], pv2:[29,30], idioms:[31,33,34,35]};
const STUDY_WEEKS = Object.keys(W).map(Number).filter(w => !REVIEW.has(w) && w <= 35);
const VWEEK = {}; // word key -> week
const VTARGET = (() => {
  const load = Object.fromEntries(STUDY_WEEKS.map(w => [w, (CARDS[w]||[]).length]));
  VOCAB.forEach(st => { const ws = VPLAN[st.id]; if(!ws) return; st.items.forEach((_,i) => { const w = ws[Math.floor(i*ws.length/st.items.length)]; VWEEK[`v${st.id}-${i}`] = w; load[w]++; }); });
  const sp = VOCAB.find(s => s.id==="spell");
  const target = Math.ceil((Object.values(load).reduce((a,b)=>a+b,0) + sp.items.length) / STUDY_WEEKS.length);
  let wi = 0;
  sp.items.forEach((_,i) => { while(wi < STUDY_WEEKS.length-1 && load[STUDY_WEEKS[wi]] >= target) wi++; const w = STUDY_WEEKS[wi]; VWEEK[`vspell-${i}`] = w; load[w]++; });
  return target;
})();
const VSET = Object.fromEntries(VOCAB.map(st => [st.id, st]));
function vocabOf(w){ const out = []; VOCAB.forEach(st => st.items.forEach(([en,ru],i) => { const key = `v${st.id}-${i}`; if(VWEEK[key]===w) out.push({key, en, ru, set:st.id}); })); return out; }
function weekItems(w){ return (CARDS[w]||[]).map((c,i)=>({key:`${w}-${i}`, en:c[0], ru:c[1]})).concat(vocabOf(w)); }
const curWeek = () => Math.max(1, Math.min(39, weekOf(today())));

// ---------- dictionary ----------
let dictFilter = "all", dictTrain = null, dictFlip = false, dictSet = "all";
function allWords(){
  const out = [];
  Object.entries(CARDS).forEach(([w,deck]) => deck.forEach((c,i) => out.push({key:`${w}-${i}`, en:c[0], ru:c[1], ex:"", topic:`Неделя ${w} · ${W[w][1]}`, w:Number(w), own:false, known:!!S.known[`${w}-${i}`]})));
  VOCAB.forEach(st => st.items.forEach(([en,ru],i) => out.push({key:`v${st.id}-${i}`, en, ru, ex:"", topic:st.name, set:st.id, w:VWEEK[`v${st.id}-${i}`], own:false, lib:true, known:!!S.known[`v${st.id}-${i}`]})));
  (S.words||[]).forEach(x => out.push({key:"u"+x.id, id:x.id, en:x.en, ru:x.ru, ex:x.ex||"", topic:x.topic||"Мои слова", w:99, own:true, known:!!x.known}));
  return out.sort((a,b) => a.w - b.w);
}
function setKnown(key, val){
  if(key.startsWith("u")){ const x = (S.words||[]).find(x=>"u"+x.id===key); if(x) x.known = val; }
  else { if(val) S.known[key]=1; else delete S.known[key]; }
}
function viewDict(){
  const words = allWords();
  const learning = words.filter(x=>!x.known), known = words.length - learning.length;
  const shown = words.filter(x => (dictFilter==="all" || (dictFilter==="learn" && !x.known) || (dictFilter==="known" && x.known) || (dictFilter==="own" && x.own) || (dictFilter==="lib" && x.lib))
    && (dictSet==="all" || (dictSet==="now" && (x.own || x.w <= curWeek())) || (dictSet==="weeks" && !x.lib && !x.own) || x.set===dictSet));
  const rows = shown.map(x => `<li class="wrow${x.known?" kn":""}" data-search="${esc((x.en+" "+x.ru+" "+x.topic).toLowerCase())}">
      <div class="wen">${esc(x.en)}${x.ex?`<small>${esc(x.ex)}</small>`:""}</div><div class="wru">${esc(x.ru)}</div><span class="pill wtopic" title="${esc(x.topic)}">${esc(x.own ? x.topic : "Неделя "+x.w)}</span>
      <div class="wact"><button class="wbtn${x.known?" on":""}" data-wknown="${x.key}">${x.known?"знаю ✓":"учу"}</button>${x.own?`<button class="linkbtn" data-wdel="${x.id}">удалить</button>`:""}</div></li>`).join("");
  const chip = (id,label,n) => `<button class="fchip${dictFilter===id?" on":""}" data-dfilter="${id}">${label} <span>${n}</span></button>`;
  let train = "";
  if(dictTrain){
    const cur = words.find(x=>x.key===dictTrain);
    train = cur ? `<section class="panel trainp"><div class="cards"><button class="card" data-dflip="1"><span class="w">${esc(cur.en)}</span><span class="t">${dictFlip?esc(cur.ru)+(cur.ex?" · "+esc(cur.ex):""):"нажмите, чтобы увидеть перевод"}</span></button>
      <div class="btnrow" style="margin-top:0"><button class="btn primary" data-dtk="${cur.key}">Знаю</button><button class="btn" data-dtnext="1">Ещё раз</button><button class="btn" data-dtstop="1">Закончить</button></div></div></section>` : "";
  }
  return `<div class="block-head"><h2>Мой <em>словарь</em></h2><a class="pillbtn dark" href="#cards">Учить карточками ↗</a></div>
  <p class="sub">${allWords().filter(x=>x.lib).length} слов по темам IELTS разложены по неделям курса: в учебную неделю около ${VTARGET} новых слов, это 4–5 в день за 15 минут. В недели повторения новых слов нет, только карточки «Повторить сегодня». Тренировка берёт только слова до текущей недели. Отмечайте выученные, тренируйтесь карточками и добавляйте новые слова из подкастов, текстов и разговоров с ChatGPT.</p>
  <div class="ach-tiles"><div class="tile c-accent"><span class="tile-h">${words.length}</span><span>слов в словаре</span></div><div class="tile c-lime"><span class="tile-h">${known}</span><span>выучено</span></div><div class="tile c-pink"><span class="tile-h">${learning.length}</span><span>учу сейчас</span></div></div>
  <div class="grid2 dictgrid">
    <section class="panel"><div class="dtools"><input id="dictSearch" class="tin dsearch" placeholder="Поиск по слову или переводу" autocomplete="off" aria-label="Поиск"><div class="fchips">${chip("all","Все",words.length)}${chip("learn","Учу",learning.length)}${chip("known","Знаю",known)}${chip("own","Мои",(S.words||[]).length)}</div>
      <select id="dictSet" class="tin dset" aria-label="Тема"><option value="all">Все темы</option><option value="now"${dictSet==="now"?" selected":""}>По плану до текущей недели</option><option value="weeks"${dictSet==="weeks"?" selected":""}>Слова из уроков курса</option>${VOCAB.map(st=>`<option value="${st.id}"${dictSet===st.id?" selected":""}>${esc(st.name)} · ${st.items.length}</option>`).join("")}</select>
      ${dictSet!=="all"&&dictSet!=="weeks"?`<p class="hint">Список слов: <a href="${VOCAB_SRC}${VOCAB.find(s=>s.id===dictSet).url}" target="_blank" rel="noopener">yourielts.ru ↗</a>, перевод наш. Слова этой темы разложены по неделям, номер недели справа.</p>`:""}</div>
      <ul class="wlist">${rows || `<p class="empty">Здесь пока пусто.</p>`}</ul></section>
    <form class="panel achform" id="wordForm"><h3>Добавить слово</h3>
      <label for="wEn">Слово или выражение</label><input id="wEn" required autocomplete="off" placeholder="to come up with">
      <label for="wRu">Перевод</label><input id="wRu" required autocomplete="off" placeholder="придумать">
      <label for="wEx">Пример</label><textarea id="wEx" rows="2" placeholder="She came up with a great idea."></textarea>
      <label for="wTopic">Тема</label><input id="wTopic" autocomplete="off" placeholder="например, Speaking Part 2" list="topicList"><datalist id="topicList">${[...new Set(Object.values(W).map(x=>x[1]))].filter(x=>x!=="—").map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
      <button class="btn primary" type="submit">Добавить в словарь</button></form>
  </div>`;
}
function nextTrain(skip){
  const pool = allWords().filter(x=>!x.known && x.key!==skip && (x.own || x.w <= curWeek()));
  dictTrain = pool.length ? pool[Math.floor(Math.random()*pool.length)].key : null; dictFlip = false;
  if(!dictTrain) toast("Все слова выучены");
}

// ---------- Quizlet-style cards ----------
// Sets: one per week, "my dictionary words", "due today", and sets the user imports.
// Every answer moves a word between Leitner boxes 0–5; box n comes back after 0,1,2,4,8,16 days.
const BOX_DAYS = [0,1,2,4,8,16];
const QZ = {set:null, mode:"cards", i:0, side:false, order:null, sort:{}, learn:null, test:null, match:null, editing:false};
function qzSets(){
  const sets = [];
  const due = qzAllItems().filter(x => qzDue(x.key));
  sets.push({id:"due", name:"Повторить сегодня", items:due, tag:"интервальное повторение"});
  STUDY_WEEKS.filter(w => w <= curWeek()+1 || QZ.set==="w"+w).forEach(w => { const items = weekItems(w); if(items.length) sets.push({id:"w"+w, name:`Неделя ${w}: ${W[w][1]}`, items, tag:w===curWeek()?"эта неделя":w>curWeek()?"следующая неделя":"набор недели"}); });
  if((S.words||[]).length) sets.push({id:"mine", name:"Мои слова из словаря", items:S.words.map(x=>({key:"u"+x.id, en:x.en, ru:x.ru})), tag:"словарь"});
  (S.sets||[]).forEach(st => sets.push({id:"s"+st.id, name:st.name, items:st.items.map((it,i)=>({key:`s${st.id}-${i}`, en:it[0], ru:it[1]})), tag:"мой набор", own:true}));
  return sets;
}
function qzAllItems(){
  const out = [];
  Object.keys(CARDS).forEach(w => CARDS[w].forEach((c,i)=>out.push({key:`${w}-${i}`, en:c[0], ru:c[1]})));
  VOCAB.forEach(st => st.items.forEach(([en,ru],i)=>out.push({key:`v${st.id}-${i}`, en, ru})));
  (S.words||[]).forEach(x => out.push({key:"u"+x.id, en:x.en, ru:x.ru}));
  (S.sets||[]).forEach(st => st.items.forEach((it,i)=>out.push({key:`s${st.id}-${i}`, en:it[0], ru:it[1]})));
  return out;
}
function qzDue(key){ const b = (S.leit||{})[key]; return b && b.due <= today() && b.box < 5; }
function qzMark(key, ok){
  const L = (S.leit ||= {}); const b = L[key] || {box:0, due:today()};
  logCard();
  b.box = ok ? Math.min(5, b.box+1) : 0;
  b.due = add(today(), BOX_DAYS[b.box]);
  L[key] = b;
  if(ok && b.box >= 3) setKnown(key, true);
  if(!ok) setKnown(key, false);
}
function qzMastery(items){ if(!items.length) return 0; return Math.round(100*items.reduce((a,x)=>a+Math.min(5,((S.leit||{})[x.key]||{box:0}).box),0)/(items.length*5)); }
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function qzCur(){ return qzSets().find(s=>s.id===QZ.set); }
function qzDistractors(item, items, n){
  const pool = shuffle((items.length >= 4 ? items : qzAllItems()).filter(x=>x.key!==item.key && x.ru!==item.ru));
  return shuffle([item.ru, ...pool.slice(0,n).map(x=>x.ru)]);
}

function viewCards(){
  const sets = qzSets();
  const cur = qzCur();
  if(!cur) QZ.set = null;
  const tiles = sets.map((st,k)=>{
    const m = qzMastery(st.items), cls = ["c-accent","c-lime","c-pink","c-black"][k%4];
    return `<button class="qset ${cls}${QZ.set===st.id?" sel":""}" data-qzset="${st.id}" ${st.items.length?"":"disabled"}><span class="qset-n">${esc(st.name)}</span><span class="pills"><span class="pill">${st.items.length} ${plural(st.items.length,"карточка","карточки","карточек")}</span><span class="pill">${esc(st.tag)}</span></span><span class="lvl-bar"><span class="bar"><i style="width:${m}%"></i></span><span class="pct">${m}%</span></span></button>`;
  }).join("");
  return `<div class="block-head"><h2>Карточки <em>как в Quizlet</em></h2><button class="pillbtn dark" data-qznew="1">+ Создать набор</button></div>
  <p class="sub">Выберите набор и режим. Каждый ответ двигает слово по интервальным коробкам: знакомое возвращается через 1, 2, 4, 8 и 16 дней, ошибка — снова завтра. Выученные здесь слова отмечаются и в словаре.</p>
  ${QZ.editing ? qzEditor() : ""}
  <div class="qsets">${tiles}</div>
  ${QZ.set && cur ? qzStudy(cur) : ""}`;
}
function plural(n,a,b,c){ const m=n%10, h=n%100; return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c; }

function qzEditor(){
  return `<form class="panel achform qedit" id="qzForm"><h3>Новый набор</h3>
  <label for="qzName">Название</label><input id="qzName" required placeholder="Например, IELTS Speaking: hobbies" autocomplete="off">
  <label for="qzText">Слова: каждая строка «слово - перевод». Можно вставить список из Quizlet (через табуляцию) или из заметок.</label>
  <textarea id="qzText" rows="7" placeholder="to come up with - придумать&#10;to look forward to - ждать с нетерпением&#10;significant - значительный"></textarea>
  <div class="btnrow"><button class="btn primary" type="submit">Сохранить набор</button><button class="btn" type="button" data-qzcancel="1">Отмена</button></div></form>`;
}
function qzParse(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.split(/\t| [-–—] | ?[-–—] ?|;|=/);
    return m.length>=2 ? [m[0].trim(), m.slice(1).join(" ").trim()] : null;
  }).filter(x=>x && x[0] && x[1]);
}

function qzStudy(st){
  const modes = [["cards","Карточки"],["learn","Заучивание"],["test","Тест"],["match","Подбор"]];
  const tabs = modes.map(([id,l])=>`<button class="fchip${QZ.mode===id?" on":""}" data-qzmode="${id}">${l}</button>`).join("");
  const body = QZ.mode==="learn" ? qzLearn(st) : QZ.mode==="test" ? qzTest(st) : QZ.mode==="match" ? qzMatch(st) : qzCards(st);
  return `<section class="panel qstudy" id="qstudy"><div class="qhead"><h3>${esc(st.name)}</h3><div class="fchips">${tabs}</div>${st.own?`<button class="linkbtn" data-qzdel="${st.id.slice(1)}">удалить набор</button>`:""}</div>${body}</section>`;
}

// mode 1: flip cards with "know / still learning" sorting
function qzCards(st){
  if(!QZ.order || QZ.order.length !== st.items.length) QZ.order = st.items.map((x,i)=>i);
  const left = QZ.order.filter(i => QZ.sort[st.items[i].key] === undefined);
  const knowN = Object.entries(QZ.sort).filter(([k,v])=>v && st.items.some(x=>x.key===k)).length;
  const learnN = Object.entries(QZ.sort).filter(([k,v])=>!v && st.items.some(x=>x.key===k)).length;
  if(!left.length) return `<div class="qdone"><p class="qbig">Готово!</p><p>Знаю: ${knowN} · Ещё учу: ${learnN}</p><div class="btnrow" style="justify-content:center">${learnN?`<button class="btn primary" data-qzagain="learnonly">Повторить ${learnN} несвыученных</button>`:""}<button class="btn" data-qzagain="all">Начать заново</button><button class="btn" data-qzmode="learn">Перейти к заучиванию</button></div></div>`;
  const it = st.items[left[0]];
  return `<div class="qprog"><span class="qcount bad">${learnN} ещё учу</span><span class="bar"><i style="width:${Math.round(100*(st.items.length-left.length)/st.items.length)}%"></i></span><span class="qcount good">${knowN} знаю</span></div>
  <div class="flip${QZ.side?" back":""}" data-qzflip="1" tabindex="0" role="button" aria-label="Перевернуть карточку"><div class="flip-in"><div class="face front"><span class="w">${esc(it.en)}</span><span class="t">нажмите или пробел</span></div><div class="face backf"><span class="w">${esc(it.ru)}</span><span class="t">${esc(it.en)}</span></div></div></div>
  <div class="btnrow qbtns"><button class="btn qno" data-qzsort="0">✕ Ещё учу</button><button class="btn" data-qzshuffle="1">Перемешать</button><button class="btn qyes" data-qzsort="1">✓ Знаю</button></div>
  <p class="hint" style="text-align:center">Клавиши: пробел — перевернуть, ← ещё учу, → знаю</p>`;
}

// mode 2: learn — each word must be answered right twice: by choice, then by typing
function qzLearn(st){
  if(!QZ.learn || QZ.learn.set !== st.id){
    QZ.learn = {set:st.id, queue:shuffle(st.items.map(x=>x.key)), stage:{}, done:[], fb:null};
  }
  const L = QZ.learn;
  const total = st.items.length, doneN = L.done.length;
  if(!L.queue.length) return `<div class="qdone"><p class="qbig">Все ${total} слов заучены</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-qzrestart="learn">Ещё раз</button><button class="btn" data-qzmode="test">Пройти тест</button></div></div>`;
  const it = st.items.find(x=>x.key===L.queue[0]);
  const stage = L.stage[it.key] || 0;
  const bar = `<div class="qprog"><span class="qcount">${doneN} / ${total}</span><span class="bar"><i style="width:${Math.round(100*doneN/total)}%"></i></span><span class="qcount">${stage? "впишите слово":"выберите перевод"}</span></div>`;
  const fb = L.fb ? `<div class="qfb ${L.fb.ok?"good":"bad"}">${L.fb.ok?"Верно!":"Правильно: "+esc(L.fb.right)}</div>` : "";
  if(L.fb) return bar + `<div class="qq"><span class="qprompt">${esc(stage===1 && !L.fb.ok ? it.en : it.en)}</span></div>${fb}<div class="btnrow" style="justify-content:center"><button class="btn primary" data-qznext="learn" id="qzNext">Дальше →</button></div>`;
  if(stage === 0){
    if(!L.opts || L.opts.key !== it.key) L.opts = {key:it.key, list:qzDistractors(it, st.items, 3)};
    return bar + `<div class="qq"><span class="qprompt">${esc(it.en)}</span></div><div class="qopts">${L.opts.list.map((o,j)=>`<button class="qopt" data-qzlearnopt="${j}"><span class="kbd">${j+1}</span>${esc(o)}</button>`).join("")}</div>`;
  }
  return bar + `<div class="qq"><span class="qprompt">${esc(it.ru)}</span></div><div class="qtype"><input class="tin" id="qzIn" placeholder="Впишите по-английски" autocomplete="off" spellcheck="false" aria-label="Ответ"><button class="btn primary" data-qzlearntype="1">Ответить</button></div><p class="hint" style="text-align:center"><button class="linkbtn" data-qzlearnskip="1">Не знаю</button></p>`;
}
function qzLearnAnswer(ok){
  const L = QZ.learn, key = L.queue[0], st = qzCur(), it = st.items.find(x=>x.key===key);
  const stage = L.stage[key] || 0;
  qzMark(key, ok);
  L.fb = {ok, right: stage===0 ? it.ru : it.en};
  if(ok){ if(stage===0){ L.stage[key]=1; L.queue.push(L.queue.shift()); } else { L.done.push(key); L.queue.shift(); } }
  else { L.stage[key]=0; const k = L.queue.shift(); L.queue.splice(Math.min(2,L.queue.length),0,k); }
  L.opts = null;
}

// mode 3: test — 10 mixed questions with a score
function qzTest(st){
  if(!QZ.test || QZ.test.set !== st.id){
    const pick = shuffle(st.items).slice(0, Math.min(10, st.items.length));
    const qs = pick.map((it,i)=>{
      const kind = ["mc","tf","write"][i%3];
      if(kind==="tf"){ const wrong = Math.random()<.5; const other = shuffle(qzAllItems().filter(x=>x.key!==it.key))[0]; return {kind, it, shown: wrong&&other?other.ru:it.ru, truth: !(wrong&&other)}; }
      if(kind==="mc") return {kind, it, opts:qzDistractors(it, st.items, 3)};
      return {kind, it};
    });
    QZ.test = {set:st.id, qs, ans:{}, sent:false};
  }
  const T = QZ.test;
  if(T.sent){
    const score = T.qs.filter((q,i)=>qzTestOk(q,T.ans[i])).length;
    const list = T.qs.map((q,i)=>{ const ok = qzTestOk(q,T.ans[i]); return `<li class="${ok?"good":"bad"}">${ok?"✓":"✕"} <b>${esc(q.it.en)}</b> — ${esc(q.it.ru)}</li>`; }).join("");
    return `<div class="qdone"><p class="qbig">${score} / ${T.qs.length}</p><p>${score===T.qs.length?"Идеально!":score>=T.qs.length*.7?"Хороший результат":"Повторите слова в режиме «Заучивание»"}</p></div><ul class="qres">${list}</ul><div class="btnrow" style="justify-content:center"><button class="btn primary" data-qzrestart="test">Новый тест</button></div>`;
  }
  const items = T.qs.map((q,i)=>{
    const a = T.ans[i];
    let body = "";
    if(q.kind==="mc") body = `<p class="qtitle">${i+1}. Перевод слова <b>${esc(q.it.en)}</b></p><div class="opts">${q.opts.map(o=>`<button class="opt${a===o?" chosen":""}" data-qztans="${i}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    else if(q.kind==="tf") body = `<p class="qtitle">${i+1}. <b>${esc(q.it.en)}</b> — это «${esc(q.shown)}»?</p><div class="opts"><button class="opt${a==="1"?" chosen":""}" data-qztans="${i}" data-v="1">Верно</button><button class="opt${a==="0"?" chosen":""}" data-qztans="${i}" data-v="0">Неверно</button></div>`;
    else body = `<p class="qtitle">${i+1}. Напишите по-английски: <b>${esc(q.it.ru)}</b></p><div class="opts"><input class="tin" data-qztin="${i}" value="${esc(a||"")}" autocomplete="off" spellcheck="false" aria-label="Ответ"></div>`;
    return `<div class="q">${body}</div>`;
  }).join("");
  return `<div class="ex">${items}<div class="btnrow"><button class="btn primary" data-qztsend="1">Проверить тест</button></div></div>`;
}
function qzTestOk(q,a){ if(a===undefined) return false; if(q.kind==="mc") return a===q.it.ru; if(q.kind==="tf") return (a==="1")===q.truth; return norm(a)===norm(q.it.en); }

// mode 4: match — pair 6 words with translations against the clock
function qzMatch(st){
  if(!QZ.match || QZ.match.set !== st.id){
    const pick = shuffle(st.items).slice(0, Math.min(6, st.items.length));
    const tiles = shuffle(pick.flatMap(it=>[{key:it.key, t:it.en}, {key:it.key, t:it.ru}])).map((x,i)=>({...x, id:i}));
    QZ.match = {set:st.id, tiles, gone:{}, sel:null, wrong:null, t0:null, time:null};
  }
  const M = QZ.match, best = (S.best||{})[st.id];
  if(M.time !== null) return `<div class="qdone"><p class="qbig">${(M.time/1000).toFixed(1).replace(".",",")} с</p><p>${best!==undefined && best===M.time?"Новый рекорд!":best!==undefined?"Рекорд: "+(best/1000).toFixed(1).replace(".",",")+" с":""}</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-qzrestart="match">Играть снова</button></div></div>`;
  return `<div class="qprog"><span class="qcount">Соедините слово и перевод</span><span class="qcount" id="qzTimer">${M.t0?((Date.now()-M.t0)/1000).toFixed(1).replace(".",","):"0,0"} с</span>${best!==undefined?`<span class="qcount">рекорд ${(best/1000).toFixed(1).replace(".",",")} с</span>`:""}</div>
  <div class="mgrid">${M.tiles.map(x=>`<button class="mtile${M.gone[x.id]?" gone":""}${M.sel===x.id?" sel":""}${M.wrong&&M.wrong.includes(x.id)?" wrong":""}" data-qzm="${x.id}" ${M.gone[x.id]?"disabled":""}>${esc(x.t)}</button>`).join("")}</div>`;
}
let qzTick = null;
function qzTimer(){ clearInterval(qzTick); qzTick = setInterval(()=>{ const el = document.getElementById("qzTimer"); const M = QZ.match; if(!el || !M || !M.t0 || M.time!==null){ clearInterval(qzTick); return; } el.textContent = ((Date.now()-M.t0)/1000).toFixed(1).replace(".",",")+" с"; }, 100); }

function qzReset(){ QZ.i=0; QZ.side=false; QZ.order=null; QZ.sort={}; QZ.learn=null; QZ.test=null; QZ.match=null; }
function qzRender(){ render(); const el = document.getElementById("qstudy"); return el; }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-qzset],[data-qzmode],[data-qzflip],[data-qzsort],[data-qzshuffle],[data-qzagain],[data-qzlearnopt],[data-qzlearntype],[data-qzlearnskip],[data-qznext],[data-qzrestart],[data-qztans],[data-qztsend],[data-qzm],[data-qznew],[data-qzcancel],[data-qzdel]");
  if(!b) return; const d = b.dataset;
  if(d.qzset){ const changed = QZ.set !== d.qzset; QZ.set = d.qzset; if(changed){ qzReset(); QZ.mode = "cards"; } render(); const el = document.getElementById("qstudy"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(d.qzmode){ QZ.mode = d.qzmode; QZ.learn=null; QZ.test=null; QZ.match=null; QZ.side=false; render(); return; }
  if(d.qzflip){ QZ.side = !QZ.side; const f = b; f.classList.toggle("back", QZ.side); return; }
  if(d.qzsort!==undefined){ const st = qzCur(); const left = QZ.order.filter(i => QZ.sort[st.items[i].key] === undefined); const it = st.items[left[0]]; const ok = d.qzsort==="1"; QZ.sort[it.key] = ok; qzMark(it.key, ok); QZ.side=false; save(); render(); return; }
  if(d.qzshuffle){ QZ.order = shuffle(QZ.order); QZ.side=false; render(); return; }
  if(d.qzagain){ const st = qzCur(); if(d.qzagain==="learnonly"){ Object.keys(QZ.sort).forEach(k=>{ if(QZ.sort[k]) {} else delete QZ.sort[k]; }); } else QZ.sort = {}; QZ.side=false; render(); return; }
  if(d.qzlearnopt!==undefined){ const L = QZ.learn; const it = qzCur().items.find(x=>x.key===L.queue[0]); qzLearnAnswer(L.opts.list[Number(d.qzlearnopt)]===it.ru); save(); render(); const n=document.getElementById("qzNext"); if(n) n.focus(); return; }
  if(d.qzlearntype){ const v = (document.getElementById("qzIn")||{}).value||""; if(!v.trim()) return; const it = qzCur().items.find(x=>x.key===QZ.learn.queue[0]); qzLearnAnswer(norm(v)===norm(it.en)); save(); render(); const n=document.getElementById("qzNext"); if(n) n.focus(); return; }
  if(d.qzlearnskip){ qzLearnAnswer(false); save(); render(); const n=document.getElementById("qzNext"); if(n) n.focus(); return; }
  if(d.qznext){ QZ.learn.fb = null; render(); const i=document.getElementById("qzIn"); if(i) i.focus(); return; }
  if(d.qzrestart){ if(d.qzrestart==="learn") QZ.learn=null; if(d.qzrestart==="test") QZ.test=null; if(d.qzrestart==="match") QZ.match=null; render(); return; }
  if(d.qztans!==undefined){ QZ.test.ans[d.qztans] = d.v; render(); return; }
  if(d.qztsend){ document.querySelectorAll("[data-qztin]").forEach(i=>{ QZ.test.ans[i.dataset.qztin] = i.value; }); QZ.test.sent = true; QZ.test.qs.forEach((q,i)=>qzMark(q.it.key, qzTestOk(q, QZ.test.ans[i]))); save(); render(); return; }
  if(d.qzm!==undefined){
    const M = QZ.match, id = Number(d.qzm); if(!M.t0){ M.t0 = Date.now(); qzTimer(); }
    M.wrong = null;
    if(M.sel === null || M.sel === id){ M.sel = M.sel===id ? null : id; render(); return; }
    const a = M.tiles[M.sel], c = M.tiles[id];
    if(a.key === c.key){ M.gone[a.id]=1; M.gone[c.id]=1; qzMark(a.key, true); }
    else { M.wrong = [a.id, c.id]; }
    M.sel = null;
    if(Object.keys(M.gone).length === M.tiles.length){ M.time = Date.now()-M.t0; const B = (S.best ||= {}); if(B[M.set]===undefined || M.time < B[M.set]) B[M.set] = M.time; }
    save(); render(); return;
  }
  if(d.qznew){ QZ.editing = true; render(); const n = document.getElementById("qzName"); if(n) n.focus(); return; }
  if(d.qzcancel){ QZ.editing = false; render(); return; }
  if(d.qzdel){ S.sets = (S.sets||[]).filter(x=>String(x.id)!==d.qzdel); QZ.set=null; save(); render(); return; }
});
document.addEventListener("submit", e => {
  if(e.target.id !== "qzForm") return;
  e.preventDefault();
  const name = document.getElementById("qzName").value.trim(), items = qzParse(document.getElementById("qzText").value);
  if(!name || !items.length){ toast("Добавьте название и хотя бы одну строку «слово - перевод»"); return; }
  const id = Date.now(); (S.sets ||= []).push({id, name, items});
  QZ.editing = false; QZ.set = "s"+id; qzReset(); QZ.mode="cards"; save(); render(); toast(`Набор сохранён: ${items.length} ${plural(items.length,"карточка","карточки","карточек")}`);
});
document.addEventListener("keydown", e => {
  if((location.hash.slice(1)) !== "cards" || !QZ.set) return;
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea"){
    if(e.key==="Enter" && e.target.id==="qzIn"){ const b = document.querySelector("[data-qzlearntype]"); if(b) b.click(); }
    return;
  }
  if(QZ.mode==="cards"){
    if(e.key===" "){ e.preventDefault(); const f = document.querySelector("[data-qzflip]"); if(f) f.click(); }
    if(e.key==="ArrowRight"){ const b = document.querySelector('[data-qzsort="1"]'); if(b) b.click(); }
    if(e.key==="ArrowLeft"){ const b = document.querySelector('[data-qzsort="0"]'); if(b) b.click(); }
  }
  if(QZ.mode==="learn"){
    if(/^[1-4]$/.test(e.key)){ const b = document.querySelector(`[data-qzlearnopt="${Number(e.key)-1}"]`); if(b) b.click(); }
    if(e.key==="Enter"){ const b = document.getElementById("qzNext"); if(b){ e.preventDefault(); b.click(); } }
  }
});

// ---------- notes ----------
// One note per week topic (S.notes[w]) plus free notes (S.free). The Notes page gathers all of them.
let noteTimer = null, notesQuery = "";
function linkKind(u){ return /youtu\.?be/.test(u)?"YouTube":/disk\.(360\.)?yandex/.test(u)?"Яндекс Диск":/docs\.google|drive\.google/.test(u)?"Google":"ссылка"; }
function linkList(w, small){
  const ls = (S.links||{})[w] || [];
  return ls.map(l=>`<li class="ulink"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title||l.url)} ↗</a><span class="pill">${linkKind(l.url)}</span>${small?"":`<button class="linkbtn" data-linkdel="${w}:${l.id}">удалить</button>`}</li>`).join("");
}
function linkBox(w){
  return `<div><h4>Мои ссылки по теме</h4><ul class="ulinks">${linkList(w)}</ul>
  <form class="linkform" data-linkform="${w}"><input class="tin" name="url" type="url" required placeholder="https://… видео, статья, упражнение" aria-label="Ссылка"><input class="tin" name="title" placeholder="Название (необязательно)" aria-label="Название"><button class="btn primary" type="submit">Добавить</button></form></div>`;
}
function noteBox(w){
  const txt = (S.notes||{})[w] || "";
  return `<div><h4>Мой конспект</h4><textarea class="note" data-note="${w}" rows="${Math.max(4, Math.min(14, txt.split("\n").length+1))}" placeholder="Правило своими словами, примеры, слова, ошибки, которые хочу запомнить…">${esc(txt)}</textarea><p class="hint">Сохраняется автоматически. Все конспекты собраны на странице <a href="#notes">«Конспекты»</a>.</p></div>`;
}
function viewNotes(){
  const wk = new Set([...Object.entries(S.notes||{}).filter(([,t])=>t&&t.trim()).map(([w])=>w), ...Object.entries(S.links||{}).filter(([,l])=>l.length).map(([w])=>w)]);
  const weekNotes = [...wk].map(w=>[w,(S.notes||{})[w]||""]).map(([w,t])=>({kind:"w", id:w, title:`Неделя ${w}: ${W[w][0]}`, sub:W[w][1], text:t, stage:STAGES[stageOf(Number(w))].name})).sort((a,b)=>a.id-b.id);
  const free = (S.free||[]).slice().sort((a,b)=>b.id-a.id).map(n=>({kind:"f", id:n.id, title:n.title||"Без названия", sub:fmt(n.date), text:n.text, stage:"Свободные"}));
  const all = weekNotes.concat(free);
  const card = n => `<article class="ncard" data-search="${esc((n.title+" "+n.text).toLowerCase())}"><div class="ncard-h"><div><h3>${esc(n.title)}</h3><span class="pill">${esc(n.stage)}</span> <span class="pill">${esc(n.sub)}</span></div>${n.kind==="w"?`<a class="pillbtn" href="#${STAGES[stageOf(Number(n.id))].id}" data-openweek="${n.id}">К теме ↗</a>`:`<button class="linkbtn" data-freedel="${n.id}">удалить</button>`}</div>
    ${n.kind==="w" && ((S.links||{})[n.id]||[]).length ? `<ul class="ulinks">${linkList(n.id,true)}</ul>` : ""}
    <textarea class="note" ${n.kind==="w"?`data-note="${n.id}"`:`data-free="${n.id}"`} rows="${Math.max(4, Math.min(16, n.text.split("\n").length+1))}">${esc(n.text)}</textarea></article>`;
  const toc = all.length ? `<nav class="ntoc">${all.map((n,i)=>`<a href="#notes" data-ntoc="${i}">${esc(n.title)}</a>`).join("")}</nav>` : "";
  return `<div class="block-head"><h2>Мои <em>конспекты</em></h2><button class="pillbtn dark" data-freenew="1">+ Новый конспект</button></div>
  <p class="sub">Здесь собираются конспекты из всех недель и свободные заметки. Их можно править прямо тут, изменения сохраняются автоматически.</p>
  <div class="ntools"><input id="notesSearch" class="tin dsearch" placeholder="Поиск по конспектам" value="${esc(notesQuery)}" autocomplete="off" aria-label="Поиск по конспектам"></div>
  ${all.length ? `<div class="nlayout">${toc}<div class="nlist">${all.map(card).join("")}</div></div>` : `<div class="panel empty">Пока нет ни одного конспекта. Откройте любую неделю в «Курсе», вкладку «Мой конспект», или создайте свободный конспект кнопкой выше.</div>`}`;
}

// ---------- timer ----------
// Every task has a planned time (its minutes in the calendar). The floating timer counts down from it,
// shows overtime in orange, and adds the real time to S.spent[taskId] (seconds).
let tickH = null;
function tmNow(){ const T = S.timer; if(!T) return 0; return T.acc + (T.running ? (Date.now()-T.start)/1000 : 0); }
function tmStart(id, label, normMin){
  if(S.timer && S.timer.id !== id) tmStop(false);
  if(!S.timer) S.timer = {id, label, norm:normMin*60, acc:0, running:true, start:Date.now(), warned:false};
  else if(!S.timer.running){ S.timer.running = true; S.timer.start = Date.now(); }
  save(); tmDraw(); tmLoop();
}
function tmPause(){ const T = S.timer; if(!T || !T.running) return; T.acc = tmNow(); T.running = false; save(); tmDraw(); }
function tmStop(markDone){
  const T = S.timer; if(!T) return;
  const secs = Math.round(tmNow());
  (S.spent ||= {})[T.id] = ((S.spent||{})[T.id]||0) + secs;
  logTimer(secs);
  if(markDone && BYID[T.id.split("#")[0]]){ S.done[T.id] = 1; logDone(T.id, true); }
  S.timer = null; save(); tmDraw(); render();
  toast(`Записано ${Math.max(1,Math.round(secs/60))} мин`);
}
const mmss = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); };
function tmDraw(){
  const el = document.getElementById("timer"); const T = S.timer;
  if(!T){ el.hidden = true; return; }
  const used = tmNow(), left = T.norm - used, over = left < 0;
  el.hidden = false;
  el.className = "timer" + (over ? " over" : "") + (T.running ? "" : " paused");
  el.innerHTML = `<div class="tm-l"><span class="tm-k">${over?"сверх нормы":"осталось"}</span><span class="tm-v">${over?"+":""}${mmss(Math.abs(left))}</span><span class="tm-t">${esc(T.label)}</span></div>
  <div class="tm-ring" style="--p:${Math.min(100, 100*used/T.norm)}"></div>
  <div class="tm-b">${T.running?`<button class="tmb" data-tm="pause" aria-label="Пауза">❚❚</button>`:`<button class="tmb" data-tm="play" aria-label="Продолжить">▶</button>`}<button class="tmb" data-tm="plus" title="+5 минут к норме">+5</button><button class="tmb ok" data-tm="done" title="Закончить и отметить выполненным">✓</button><button class="tmb" data-tm="stop" title="Остановить без отметки">■</button></div>`;
  if(over && !T.warned){ T.warned = true; save(); toast("Время на задание вышло. Можно закончить или добавить 5 минут"); }
}
function tmLoop(){ clearInterval(tickH); tickH = setInterval(()=>{ if(!S.timer || !S.timer.running){ clearInterval(tickH); return; } tmDraw(); }, 500); }
function spentLabel(id, min){ const s = (S.spent||{})[id]; if(!s) return ""; const m = Math.round(s/60); return `<span class="${m>min?"overc":"inc"}">потрачено ${m} из ${min} мин</span>`; }
function weekTime(w){
  const ts = BASE.filter(t=>t.w===w); const plan = ts.reduce((a,t)=>a+t.min,0);
  const spent = Math.round(((S.spent||{})["topic-"+w]||0)/60 + ts.reduce((a,t)=>a + ((S.spent||{})[t.id]||0) + Object.entries(S.spent||{}).filter(([k])=>k.startsWith(t.id+"#")).reduce((x,[,v])=>x+v,0),0)/60);
  const bySkill = {}; ts.forEach(t=>bySkill[t.skill]=(bySkill[t.skill]||0)+t.min);
  return {plan, spent, bySkill};
}
const hm = m => m>=60 ? `${Math.floor(m/60)} ч${m%60?" "+(m%60)+" мин":""}` : `${m} мин`;

document.addEventListener("click", e => {
  const b = e.target.closest("[data-tm],[data-tmstart],[data-freenew],[data-freedel],[data-ntoc],[data-openweek],[data-topictimer]"); if(!b) return; const d = b.dataset;
  if(d.tm==="pause") tmPause();
  else if(d.tm==="play") tmStart(S.timer.id, S.timer.label, S.timer.norm/60);
  else if(d.tm==="plus"){ S.timer.norm += 300; S.timer.warned = false; save(); tmDraw(); }

function logDone(id, on){
  const L = (S.doneAt ||= {});
  if(!on){ delete L[id]; Object.keys(L).filter(k=>k.startsWith(id+"#")).forEach(k=>delete L[k]); return; }
  const base = BYID[id.split("#")[0]]; if(!base) return;

}
function logTimer(secs){ const T = (S.tlog ||= {}); T[today()] = (T[today()]||0) + secs; }

function dayStats(){
  const by = {};

  Object.entries(S.doneAt||{}).forEach(([id,x]) => { const o = g(x.d); o.task += x.m; const sk = BYID[id.split("#")[0]].skill; o.skills[sk] = (o.skills[sk]||0) + x.m; });

function streaks(by){

// Question ids: "m:w:i" (EX choice), "t:w:i" (EXT typed), "h:w:i" (HARD typed).
function qbGet(qid){ if(!recapsBuilt) buildRecaps(); const [k,w,i] = qid.split(":");
  if(k==="d"){ const [j,n] = i.split("-").map(Number); const x = ((DAYX[w]||[])[j]||{q:[]}).q[n]; return x ? {k: x[0]==="m" ? "m" : "t", w:Number(w), q:x.slice(1)} : null; } const src = k==="m" ? EX : k==="t" ? EXT : HARD; const q = (src[w]||[])[i]; return q ? {k, w:Number(w), q} : null; }
function qbAll(maxW){
  const out = [];
  [["m",EX],["t",EXT],["h",HARD]].forEach(([k,src]) => Object.keys(src).map(Number).filter(w => w <= maxW).forEach(w => src[w].forEach((_,i) => out.push(`${k}:${w}:${i}`))));
  Object.keys(DAYX).map(Number).filter(w => w <= maxW && !RECAP.has(w)).forEach(w => DAYX[w].forEach((L,j) => L.q.forEach((_,i) => out.push(`d:${w}:${j}-${i}`))));
  return out;
}
function qbRight(qid, a){
  const g = qbGet(qid); if(!g) return false;
  if(g.k==="m") return Number(a)===g.q[2];
  const fix = g.q[0].startsWith("Найдите ошибку");
  return g.q[1].some(x => norm(x)===norm(a) || (fix && (" "+norm(a)+" ").includes(" "+norm(x)+" "))) || altOk(qid, a);
}
// Exercise keys on the week pages ("5-2", "5-t1", "8-h4" in review weeks) -> question id.
function keyToQid(key){
  const dm = key.match(/^(\d+)-d(\d+)-(\d+)$/); if(dm) return `d:${dm[1]}:${dm[2]}-${dm[3]}`;
  const m = key.match(/^(\d+)-([th]?)(\d+)$/); if(!m) return null;
  const w = +m[1], k = m[2] || "m", i = +m[3], src = k==="m" ? EX : k==="t" ? EXT : HARD;
  if(src[w]) return `${k}:${w}:${i}`;
  if(!REVIEW.has(w)) return null;
  let n = i; for(let x = w-3; x < w; x++){ const L = (src[x]||[]).length; if(n < L) return `${k}:${x}:${n}`; n -= L; }
  return null;

  const qs = M ? M.items.map((q,i) => { const a = M.ans[i], did = a!==undefined;
    return `<div class="q"><p>${i+1}. ${esc(q.q)}</p><div class="opts">${q.opts.map((o,j)=>`<button class="opt${did&&j===q.a?" right":""}${did&&j===a&&a!==q.a?" wrong":""}" data-aimo="${k}|${i}|${j}" ${did?"disabled":""}>${esc(o)}</button>`).join("")}</div>${did?`<div class="why">${esc(q.why||"")}</div>`:""}</div>`; }).join("") : "";
  return `${qs?`<div class="ex">${qs}</div>`:""}<button class="btn" style="margin-top:10px" data-aimore="${k}" ${AIST["m"+k]==="busy"?"disabled":""}>${M?"Ещё 5 заданий":"Ещё 5 заданий от Claude"}</button>${aiState("m"+k)}`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-aiexp],[data-aimore],[data-aimo]"); if(!b) return; const d = b.dataset;
  if(d.aimo){ const [k,i,j] = d.aimo.split("|"); AIM[k].ans[i] = Number(j); logCard(); render(); return; }
  const k = d.aiexp || d.aimore, [w, dk] = k.split(":").map(Number), day = weekDays(w)[dk]; if(!day) return;
  const topic = dayHeads(w, day).join("; "), lvl = levelWord(w);
  if(d.aiexp){
    const prev = AIX[k];
    const p = `Explain in Russian, simply and warmly, to a learner of English (level ${lvl}, goal IELTS 7.5) this grammar/vocabulary topic: ${topic}.\n${prev ? "The learner did not understand this previous explanation, so explain it differently, with a different analogy:\n"+prev+"\n" : ""}Give: the core idea in 2 sentences, 3 short English examples with Russian translation, and 2 typical mistakes Russian speakers make. Max 180 words. Plain text only: no markdown, no headings, use "- " for list items.`;
    if(AIST["x"+k]==="busy") return; AIST["x"+k] = "busy"; render();
    try { const r = await AI(p, {modelTier:"quick", cache:false}); AIX[k] = r.text.trim(); delete AIST["x"+k]; } catch(err){ AIST["x"+k] = aiErr(err); }
    render(); return;
  }
  const r = await aiJSON("m"+k, `Create 5 new multiple-choice English exercises for a learner (level ${lvl}, goal IELTS 7.5) on: ${topic}. Make them a bit harder one after another. Each has 3 options and exactly one correct answer. Return ONLY JSON: {"items":[{"q":"sentence with ___","opts":["a","b","c"],"a":index of the correct option,"why":"one short reason in Russian"}]}. Random seed: ${Date.now()%1000}`, "quick");
  if(r && Array.isArray(r.items)) AIM[k] = {items: r.items.filter(q => q && q.q && Array.isArray(q.opts) && Number.isInteger(q.a)).slice(0,5), ans:{}};
  render();
});

// Speaking transcript: typed or dictated with the browser's speech recognition, when it is allowed.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function spDictate(){
  if(!SR){ toast("Диктовка не поддерживается этим браузером, напечатайте ответ"); return; }
  if(SP.sr){ SP.sr.stop(); return; }
  const r = new SR(); r.lang = "en-GB"; r.continuous = true; r.interimResults = false;
  r.onresult = ev => { for(let i = ev.resultIndex; i < ev.results.length; i++) if(ev.results[i].isFinal) SP.text = ((SP.text||"") + " " + ev.results[i][0].transcript).trim(); const el = document.getElementById("spText"); if(el) el.value = SP.text; };
  r.onerror = ev => { toast(ev.error==="not-allowed" ? "Браузер не дал доступ к микрофону, напечатайте ответ" : "Диктовка остановилась"); };
  r.onend = () => { SP.sr = null; render(); };
  SP.sr = r; r.start(); render();
}
function spAiHTML(){
  const last = (S.spk||[]).filter(x => x.fb).slice(-1)[0];
  return `<h4 style="margin-top:16px">Проверка ответа</h4>
  <p class="hint">Надиктуйте ответ (или напечатайте его по памяти сразу после), и ${AI?"Claude":"ChatGPT"} оценит беглость, лексику и грамматику. Произношение по тексту оценить нельзя.</p>
  <textarea class="note" id="spText" data-sptext="1" rows="5" placeholder="Текст вашего ответа на английском">${esc(SP.text||"")}</textarea>
  <div class="btnrow" style="margin-top:6px">${SR?`<button class="btn" data-spdict="1">${SP.sr?"Остановить диктовку":"Надиктовать"}</button>`:""}${AI?`<button class="btn primary" data-spai="1" ${AIST.sp==="busy"?"disabled":""}>Проверить ответ</button>`:`<button class="gpt" data-spgptt="1">Проверить ответ с ChatGPT</button>`}</div>
  ${aiState("sp")}${SP.fb ? aiFbHTML(SP.fb, "Speaking без произношения") : last ? `<details class="phr"><summary>Прошлая проверка · ${fmt(last.d)} · ${bandTxt(last.fb.overall)}</summary>${aiFbHTML(last.fb, "Speaking без произношения")}</details>` : ""}`;
}
document.addEventListener("input", e => { if(e.target.dataset && e.target.dataset.sptext) SP.text = e.target.value; });
const GPT_FB = "\n\nAnswer in this format: estimated band for each criterion with one-line reasons (in Russian), then the 5 most important corrections (my words → better version → why, in Russian), then three priorities for next time.";
document.addEventListener("click", e => {
  const b = e.target.closest("[data-spgptt],[data-gptq]"); if(!b) return;
  if(b.dataset.spgptt){ const text = (SP.text||"").trim(); if(wc(text) < 20){ toast("Сначала надиктуйте или напечатайте ответ"); return; } copyAndOpen(aiSpeakPrompt(text).split("Return ONLY")[0].replace(/\n?Also add "phrases"[^\n]*/, "\nAlso suggest five natural phrases I could have used and four Part 3 questions on this theme.") + GPT_FB); return; }
  const g = qbGet(b.dataset.gptq); if(!g) return;
  copyAndOpen(`I'm learning English. Exercise: ${g.q[0]}\nReference answer: ${g.q[1].join(" | ")}\nMy answer: ${b.dataset.a}\n\nIs my answer also correct? Explain briefly in Russian. If it is correct, I will mark it as right on my study site.`);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-spdict],[data-spai],[data-aiq]"); if(!b) return; const d = b.dataset;
  if(d.spdict){ spDictate(); return; }
  if(d.spai){
    const text = (SP.text||"").trim(); if(wc(text) < 40){ toast("Нужно хотя бы 40 слов ответа"); return; }
    const f = await aiJSON("sp", aiSpeakPrompt(text)); if(!f) return;
    SP.fb = f; (S.spk ||= []).push({d:today(), i:SP.i, fb:f, text}); save(); render(); return;
  }
  if(d.aiq){
    const qid = d.aiq, g = qbGet(qid); if(!g) return;
    const r = await aiJSON("q:"+qid, aiQPrompt(g.q, d.a), "quick"); if(!r) return;
    AIQ[qid] = (r.ok ? "Claude: ответ верный. " : "Claude: ответ неверный. ") + (r.why||"");
    if(r.ok){ const A = (S.alt ||= {}); (A[qid] ||= []).push(norm(d.a)); const E = S.err || {}; if(E[qid]){ if(E[qid].n <= 1) delete E[qid]; else E[qid].n--; } save(); }
    render();
  }
});

"B. This pattern, known as the forgetting curve, has been confirmed by many later studies. The good news is that the curve can be changed. Each time we review information, it is forgotten more slowly than before. This is the idea behind spaced repetition: reviewing material after one day, then three days, then a week.",

{id:"r3", k:"R", lvl:"B2", title:"The four-day working week", p:[
"A. In 2022, around 60 British companies took part in the world's largest trial of a four-day working week. Employees worked 80 per cent of their usual hours for 100 per cent of their pay, on the condition that they maintained 100 per cent of their productivity. At the end of the six-month trial, 56 of the companies decided to continue, and 18 made the change permanent.",
"B. The benefits reported by employees were considerable. Levels of burnout fell, sleep improved and the number of sick days dropped by around two thirds. Many participants said that the extra day off allowed them to deal with household tasks and spend more time with their families, which reduced stress during the working week.",
"C. Critics, however, argue that the results may not apply to every sector. The companies in the trial volunteered to take part, so they were likely to be organisations that were already enthusiastic about flexible working. In industries such as healthcare or retail, where staff must be physically present, reducing hours without hiring more people may be impossible.",
"D. Some economists also point out that productivity is difficult to measure in many office jobs. If companies cannot reliably measure output, they may not notice a gradual decline in performance until it is too late. In their view, longer and more varied trials are needed before governments consider changing employment law.",

"A. Of the roughly 7,000 languages spoken in the world today, linguists estimate that around 40 per cent are endangered. Many of these have fewer than 1,000 speakers, most of whom are elderly. When the last fluent speaker of a language dies, the language is usually lost for ever, together with the knowledge, stories and ways of seeing the world that it carried.",
"B. Languages disappear for a variety of reasons. In the past, governments sometimes banned minority languages in schools. Today the pressure is usually economic: parents choose to raise their children in a dominant language because they believe it will give them better job prospects. Within two or three generations, the original language may no longer be passed on at all.",
"C. Yet decline is not inevitable. Hebrew, which had not been used as an everyday spoken language for centuries, was revived in the late nineteenth and early twentieth centuries and now has millions of native speakers. More recently, Welsh has grown in popularity thanks to bilingual education and Welsh-language television.",
"D. Technology may also help. Communities are recording elderly speakers, creating online dictionaries and even developing language-learning apps. Critics warn, however, that recordings alone cannot keep a language alive: what matters is whether children use it at home and with friends."],

{id:"r5", k:"R", lvl:"C1", title:"The paradox of choice", p:[
"A. Conventional economic theory assumes that more choice is always better: if consumers have more options, they are more likely to find one that exactly matches their preferences. In the early 2000s, however, the psychologist Barry Schwartz popularised a contrary view, arguing that an abundance of options can paralyse decision-making and leave people less satisfied with what they eventually choose.",
"B. The most frequently cited evidence comes from a study in a Californian supermarket. Shoppers who were offered 24 varieties of jam were more likely to stop at the display, but only 3 per cent went on to buy a jar. When just six varieties were offered, 30 per cent made a purchase. The researchers concluded that excessive choice had discouraged action.",
"C. Subsequent research has painted a more complicated picture. A 2010 analysis that combined the results of 50 experiments found that, on average, the size of a choice set had virtually no effect on satisfaction or willingness to buy. Whether more options helped or hindered appeared to depend on circumstances, such as how familiar people were with the product and how easy the options were to compare.",
"D. What emerges is not a simple rule but a set of conditions. Large assortments are likely to be counterproductive when choices are complex, time is short and people lack clear preferences. Conversely, experts who know exactly what they want may welcome a wide range. For businesses, the lesson is less about cutting options than about helping customers navigate them, for instance by grouping products or offering recommendations."],

{t:"tf", cx:"R-tfng", q:"The 2010 analysis found that large choice sets always reduce satisfaction.", a:"FALSE"},
{t:"mc", cx:"R-end", q:"Large assortments tend to be counterproductive when…", opts:["…customers are experts.","…choices are complex and time is short.","…products are grouped.","…prices are low."], a:1},
{t:"mc", cx:"R-feat", q:"Who claimed that too many options can make people less satisfied?", opts:["conventional economists","Barry Schwartz","the 2010 analysts","supermarket managers"], a:1},

{id:"r6", k:"R", lvl:"C1", title:"Rewilding Europe", p:[
"A. Rewilding is an approach to conservation that aims to restore natural processes rather than manage landscapes in fine detail. Instead of mowing meadows or controlling water levels, rewilders reintroduce key species and then largely step back, allowing ecosystems to develop with minimal human intervention.",
"B. One of the best-known examples is the Oostvaardersplassen in the Netherlands, where red deer, wild horses and cattle were released onto reclaimed land in the 1980s. The animals were intended to recreate the grazing pressure of the wild herbivores that once roamed Europe. For years the project was celebrated; however, in the harsh winter of 2017–18, thousands of animals starved, prompting public outrage and a change in management.",
"C. Advocates maintain that such setbacks reflect specific design flaws, notably the absence of large predators and the fencing that prevented animals from migrating, rather than failures of the concept itself. Elsewhere, the return of wolves to parts of Germany and beavers to Scotland is credited with improving biodiversity and reducing flooding downstream.",
"D. Opposition is strongest among farmers, who fear losses of livestock and land. Rewilding projects that have won local support have typically involved communities from the outset, offering compensation for damage and creating income from nature tourism. Without such measures, critics argue, rewilding risks being seen as a project imposed by urban elites on rural populations."],

// Reading and Listening practice on our own texts. Results feed the codifier: a type you have tried is "тренирую",
// 80% right over at least 6 questions of that type marks it as mastered.
const RLS = {cur:null, ans:{}, checked:false, playing:false, plays:0, t0:0};
const TFO = {tf:["TRUE","FALSE","NOT GIVEN"], yn:["YES","NO","NOT GIVEN"]};
function rlOk(q, a){ if(a===undefined || a==="") return false; if(q.t==="mc") return Number(a)===q.a; if(TFO[q.t]) return a===q.a; return q.a.some(x => norm(x)===norm(a)); }
function rlQ(q, i){
  const a = RLS.ans[i], ck = RLS.checked, ok = ck && rlOk(q, a);
  let body;
  if(q.t==="gap") body = `<input class="tin" data-rlin="${i}" value="${a!==undefined?esc(a):""}" ${ck?"disabled":""} autocomplete="off" spellcheck="false" aria-label="Ответ">`;
  else { const opts = q.t==="mc" ? q.opts.map((o,j)=>[j, `${"ABCDEFG"[j]}. ${o}`]) : TFO[q.t].map(o=>[o,o]);
    body = opts.map(([v,l]) => { let c = "opt"; if(String(a)===String(v)) c += ck ? (ok?" right":" wrong") : " on"; if(ck && !ok && String(v)===String(q.a)) c += " right"; return `<button class="${c}" data-rlo="${i}" data-v="${v}" ${ck?"disabled":""}>${esc(l)}</button>`; }).join(""); }
  const right = q.t==="mc" ? `${"ABCDEFG"[q.a]}. ${q.opts[q.a]}` : TFO[q.t] ? q.a : q.a[0];
  return `<div class="q"><p>${i+1}. ${esc(q.q)}</p><div class="opts">${body}</div>${ck?`<div class="why"><b class="${ok?"okc":"badc"}">${ok?"Верно":"Неверно"}</b>${ok?"":` · правильно: ${esc(right)}`}</div>`:""}</div>`;
}
function rlRender(){
  if(!RLS.cur) return `<p class="hint">Свои тексты в формате IELTS, от B1 до C1. Listening озвучивает браузер английским голосом: слушайте один раз, как на экзамене, текст записи откроется после проверки. Типы вопросов автоматически отмечаются в кодификаторе.</p><div class="rl-grid">${RL.map(x => { const r = (S.rl||{})[x.id]; return `<button class="rl-card" data-rl="${x.id}"><span class="pill">${x.k==="R"?"Reading":"Listening"} · ${x.lvl}</span><b>${esc(x.title)}</b><span class="hint">${r?`лучший результат ${r.best} из ${x.qs.length}`:`${x.qs.length} вопросов`}</span></button>`; }).join("")}</div>`;
  const x = RL.find(r => r.id===RLS.cur), ck = RLS.checked, score = x.qs.filter((q,i)=>rlOk(q, RLS.ans[i])).length;
  const body = x.k==="R" ? `<div class="rl-text">${x.p.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`
    : `<div class="btnrow" style="margin-top:0">${"speechSynthesis" in window?`<button class="btn primary" data-rlplay="1">${RLS.playing?"Остановить":RLS.plays?"Слушать ещё раз":"Слушать запись"}</button>`:`<span class="hint">Этот браузер не умеет озвучивать текст, откройте текст записи.</span>`}<span class="hint">${RLS.plays?`прослушано: ${RLS.plays}`:"на экзамене запись звучит один раз"}</span></div>
      ${ck || !("speechSynthesis" in window) ? `<details class="phr"><summary>Текст записи</summary>${x.lines.map(([s,t])=>`<p><b>${s}:</b> ${esc(t)}</p>`).join("")}</details>` : ""}`;
  return `<div class="rl-head"><button class="linkbtn" data-rlback="1">← все тексты</button><span class="pill">${x.k==="R"?"Reading":"Listening"} · ${x.lvl}</span></div><h3>${esc(x.title)}</h3>${body}
  <div class="rl-qs">${x.qs.map((q,i)=>rlQ(q,i)).join("")}</div>
  <div class="btnrow">${ck?`<p class="calc-res">Верно ${score} из ${x.qs.length}</p><button class="btn" data-rlredo="1">Пройти заново</button>`:`<button class="btn primary" data-rlcheck="1">Проверить ответы</button>`}</div>`;
}
function rlVoices(){ const v = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); const gb = v.filter(v => /GB/i.test(v.lang)); return gb.length ? gb.concat(v) : v; }
function rlPlay(x){
  if(RLS.playing){ speechSynthesis.cancel(); RLS.playing = false; render(); return; }
  const vs = rlVoices(), who = [...new Set(x.lines.map(l=>l[0]))];
  RLS.playing = true; RLS.plays++; render();
  x.lines.forEach(([s,t], i) => {
    const u = new SpeechSynthesisUtterance(t), k = who.indexOf(s);
    u.lang = "en-GB"; u.rate = x.lvl==="C1" ? 1 : 0.92; if(vs.length) u.voice = vs[k % vs.length]; u.pitch = k ? 0.9 : 1.05;
    if(i===x.lines.length-1) u.onend = () => { RLS.playing = false; render(); };
    speechSynthesis.speak(u);
  });
}
function rlCheck(x){
  RLS.checked = true; if("speechSynthesis" in window) speechSynthesis.cancel(); RLS.playing = false;
  const score = x.qs.filter((q,i)=>rlOk(q, RLS.ans[i])).length, R = (S.rl ||= {}), r = R[x.id];
  R[x.id] = {best: Math.max(score, r ? r.best : 0), last: score, d: today()};
  const st = (S.rlStat ||= {}), C = (S.codex ||= {});
  x.qs.forEach((q,i) => [q.cx, x.part].filter(Boolean).forEach(cx => { const s = (st[cx] ||= {n:0, ok:0}); s.n++; if(rlOk(q, RLS.ans[i])) s.ok++; }));
  Object.keys(st).forEach(cx => { if(!C[cx]) C[cx] = "doing"; if(C[cx]==="doing" && st[cx].n >= 6 && st[cx].ok/st[cx].n >= 0.8) C[cx] = today(); });
  if(RLS.t0) logTimer(Math.min(3600, Math.round((Date.now()-RLS.t0)/1000)));
  save(); render();
}
document.addEventListener("input", e => { const i = e.target.dataset && e.target.dataset.rlin; if(i!==undefined) RLS.ans[i] = e.target.value; });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-rl],[data-rlback],[data-rlo],[data-rlplay],[data-rlcheck],[data-rlredo]"); if(!b) return; const d = b.dataset;
  const x = RL.find(r => r.id===RLS.cur);
  if(d.rl){ Object.assign(RLS, {cur:d.rl, ans:{}, checked:false, plays:0, t0:Date.now()}); render(); const p = document.getElementById("practice-rl"); if(p) p.scrollIntoView({block:"start"}); return; }
  if(d.rlback){ if(RLS.playing) speechSynthesis.cancel(); Object.assign(RLS, {cur:null, playing:false}); render(); return; }
  if(d.rlo!==undefined){ RLS.ans[d.rlo] = d.v; render(); return; }
  if(d.rlplay && x){ rlPlay(x); return; }
  if(d.rlcheck && x){ rlCheck(x); return; }
  if(d.rlredo){ Object.assign(RLS, {ans:{}, checked:false, plays:0, t0:Date.now()}); render(); }
});

// Mock mode: official British Council test + exam timer + answer sheet + band.
const MK = {tEnd:0};
function mkRender(){
  const M = S.mock;
  if(!M) return `<p>Пройдите официальный пробный тест British Council в режиме экзамена: таймер, бланк на 40 ответов, затем сверка с ключом на сайте BC и подсчёт band.</p><div class="btnrow" style="margin-top:0"><button class="btn primary" data-mk="L">Listening · 30 мин</button><button class="btn primary" data-mk="R">Reading · 60 мин</button><a class="btn" href="#practice-es" data-mkgo="es">Writing → редактор эссе</a><a class="btn" href="#practice-sp" data-mkgo="sp">Speaking → тренажёр</a></div>`;
  const name = M.skill==="L" ? "Listening" : "Reading", url = MAT ? MAT.ieltsMocks[M.skill==="L"?"listening":"reading"] : "#";
  const left = Math.max(0, (M.end - Date.now())/1000);
  const n = M.mark.filter(x=>x===1).length;
  const cells = range(0,39).map(i => M.phase==="answer"
    ? `<label class="mk-c"><span>${i+1}</span><input data-mkans="${i}" value="${esc(M.ans[i]||"")}" autocomplete="off" spellcheck="false"></label>`
    : `<div class="mk-c mk-m${M.mark[i]===1?" ok":M.mark[i]===0?" bad":""}"><span>${i+1}</span><b>${esc(M.ans[i]||"—")}</b><button data-mkmark="${i}" data-v="1" aria-label="верно">✓</button><button data-mkmark="${i}" data-v="0" aria-label="неверно">✗</button></div>`).join("");
  return `<div class="mk-head"><h3>${name}: пробный тест</h3><a class="pillbtn" href="${esc(url)}" target="_blank" rel="noopener">Открыть тест British Council ↗</a>${M.phase==="answer"?`<span class="es-t on" id="mkT">${mmss(left)}</span>`:""}</div>
  <p class="hint">${M.phase==="answer"?`Откройте тест в соседней вкладке и записывайте ответы в бланк ниже, как на экзамене. ${M.skill==="L"?"Запись слушайте один раз.":"Отдельного времени на перенос ответов нет."}`:"Сверьте ответы с ключом на сайте British Council и отметьте каждый: ✓ или ✗."}</p>
  <div class="mk-grid">${cells}</div>
  ${M.phase==="answer"?`<div class="btnrow"><button class="btn primary" data-mkphase="check">Закончить и проверить</button><button class="btn" data-mkphase="cancel">Отменить</button></div>`
  :`<p class="calc-res">Верно ${n} из 40 → band <b>${rawBand(M.skill, n)}</b> <small class="hint">(стандартная шкала Academic; у разных тестов она отличается на ±1 ответ)</small></p><div class="btnrow"><button class="btn primary" data-mkphase="save">Сохранить в достижения</button><button class="btn" data-mkphase="cancel">Отменить</button></div>`}`;
}

  const w = rvWeek(), R = (S.reflect||{})[w] || {}, weak = R.weak || [];
  const past = Object.entries(S.reflect||{}).filter(([k])=>Number(k)!==w).sort((a,b)=>b[0]-a[0]);
  return `${dow(today())===6?`<p class="rv-sun">Сегодня воскресенье: время подвести итог недели.</p>`:""}

  <p class="hint">Отмеченные навыки подсветятся в следующей неделе в разделе уровня. Сохраняется автоматически.</p></form>

function rvFocus(w){ const R = (S.reflect||{})[w-1]; if(!R || !(R.weak||[]).length) return ""; return `<div class="rv-focus">По итогам недели ${w-1} уделите больше внимания: <b>${R.weak.map(k=>SKILL[k]).join(", ")}</b>.${R.hard?` Было трудно: «${esc(R.hard)}».`:""}</div>`; }

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-pq],[data-pcheck],[data-sp],[data-spgpt],[data-es],[data-mk],[data-mkphase],[data-mkmark],[data-mkgo],[data-rvweak],[data-rvconf],[data-prgo]"); if(!b) return; const d = b.dataset;
  if(d.pq || d.pcheck){
    const ns = d.pq || d.pcheck, qid = d.qid; let a;
    if(d.pq) a = Number(d.po); else { const el = document.getElementById(`pin-${ns}-${qid.replace(/:/g,"_")}`); a = el ? el.value.trim() : ""; if(!a) return; }

      return `<li class="cx ${s.st}" style="--p:${s.pct}%"><div class="cx-n">${esc(it[1])}<small>${/^[LR]-/.test(it[0])?"отмечается по Reading и Listening на сайте или вручную: ☆ → ★":weeksLabel(it[2])}</small></div><span class="cx-s">${lbl}</span><div class="cx-a"><button class="linkbtn" data-codexgpt="${it[0]}" title="Потренировать с ChatGPT">ChatGPT</button><button class="wbtn${s.st==="master"?" on":""}" data-codex="${it[0]}">${s.st==="master"?"★":"☆"}</button></div></li>`; }).join("");
    const p = Math.round(sec.items.reduce((a,it)=>a+codexStatus(sec,it).pct,0)/sec.items.length);
    return `<details class="cxsec" ${sec.id==="L"||sec.id==="W"?"open":""}><summary><span class="cxt">${sec.name}</span><span class="wp"><span class="bar"><i style="width:${p}%"></i></span><span class="pct">${p}%</span></span></summary><ul class="cxl">${rows}</ul></details>`;
  }).join("");
  const total = Math.round(got/all);
  return `  <div class="block-head" style="margin-top:32px"><h2>Кодификатор${tip("Список всего, что проверяют на IELTS: грамматика, лексика, типы вопросов. Показывает, что уже пройдено.")}</h2><span class="pill">освоено ${total}%</span></div>
  <div class="cxlegend"><span class="cx-dot master"></span>освоено <span class="cx-dot done"></span>пройдено в курсе <span class="cx-dot doing"></span>в процессе <span class="cx-dot now"></span>сейчас по плану <span class="cx-dot todo"></span>впереди</div>
  <div class="cxwrap">${secs}</div>`;
}
function viewIelts(){
  const tiles = EXAM.map(e => `<a class="tile ${e.c} ex-tile" href="#ex-${e.k}"><span class="tile-h">${e.k}</span><span class="ex-facts"><b>${e.time}</b><span>${e.q}</span><span>${e.parts}</span></span></a>`).join("");

  const cv = ["L","R","W","S"].map(k => calcVals[k]);
  const filled = cv.every(v => v !== "");
  const ov = filled ? roundBand(cv.reduce((a,v)=>a+Number(v),0)/4) : null;
  const opt = v => ["",...range(0,18).map(x=>x/2)].map(x => `<option value="${x}"${String(x)===String(v)?" selected":""}>${x===""?"—":x}</option>`).join("");
  return `<h2>Всё об <em>IELTS</em></h2><p class="sub">Формат IELTS Academic, как считают баллы и что нужно для 7.5. Кодификатор всего, что проверяют на экзамене, теперь во вкладке «Прогресс».</p>
  <div class="ach-tiles ex-tiles">${tiles}</div>
  <p class="hint">Listening, Reading и Writing сдают подряд без перерывов, это около 2 ч 40 мин. Speaking бывает в тот же день или в другой день в пределах недели. Официальное описание формата есть на <a href="https://ielts.org/take-a-test/test-types/ielts-academic-test" target="_blank" rel="noopener">ielts.org ↗</a>.</p>



  <h2 style="margin-top:32px">Формат <em>по частям</em></h2>
  <div class="grid2 exgrid">${format}</div>

  <h2 style="margin-top:32px">Как считают <em>баллы</em></h2>
  <div class="grid2 exgrid">
    <section class="panel"><h3>Итоговый балл</h3><p>Каждая часть оценивается от 0 до 9 с шагом 0,5. Итог равен среднему из четырёх, округлённому до ближайшей половины:</p>
      <ul class="exl"><li>среднее 6,25 → <b>6,5</b> (.25 округляют вверх до половины)</li><li>среднее 6,75 → <b>7,0</b> (.75 округляют вверх до целого)</li><li>среднее 6,125 → <b>6,0</b></li></ul>
      <h4>Калькулятор</h4><div class="calc">${["L","R","W","S"].map(k=>`<label>${{L:"Listening",R:"Reading",W:"Writing",S:"Speaking"}[k]}<select data-calc="${k}">${opt(calcVals[k])}</select></label>`).join("")}</div>
      <p class="calc-res">${ov===null?"Выберите баллы всех четырёх частей":`Итог: <b>${ov}</b> ${ov>=7.5?"· цель 7.5 достигнута 🎉":`· до 7.5 не хватает ${(7.5-ov).toFixed(1)}`}`}</p>
      <p class="hint">Пример набора на 7.5: Listening 8, Reading 8, Writing 7, Speaking 7 (среднее 7,5). Или L 8, R 7.5, W 7, S 7 (среднее 7,375 → 7,5).</p></section>
    <section class="panel"><h3>Сколько правильных ответов нужно</h3><p>В Listening и Reading по 40 вопросов, каждый ответ стоит 1 балл. Перевод в band немного отличается от теста к тесту, ниже примерная шкала. Официальные ориентиры: 16 → 5, 23 → 6, 30 → 7, 35 → 8.</p>
      <div class="calc">${["L","R"].map(k=>`<label>${k==="L"?"Listening":"Reading"}: верных из 40<input type="number" min="0" max="40" inputmode="numeric" data-raw="${k}" value="${rawVals[k]}" placeholder="0–40"></label>`).join("")}</div>
      <p class="calc-res">${["L","R"].filter(k=>rawVals[k]!=="").map(k=>`${k==="L"?"Listening":"Reading"}: <b>${rawBand(k, Math.max(0,Math.min(40,Number(rawVals[k]))))}</b>`).join(" · ") || "Введите число верных ответов"}</p>
      <table class="rawt"><thead><tr><th>Band</th><th>Listening</th><th>Reading</th></tr></thead><tbody>${[9,8.5,8,7.5,7,6.5,6,5.5,5].map(b=>{ const r = k => { const i = RAW[k].findIndex(x=>x[1]===b); const lo = RAW[k][i][0], hi = i ? RAW[k][i-1][0]-1 : 40; return lo===hi?lo:`${lo}–${hi}`; }; return `<tr${b===7.5?' class="goal"':""}><td>${b}</td><td>${r("L")}</td><td>${r("R")}</td></tr>`; }).join("")}</tbody></table></section>
    <section class="panel"><h3>Как проверяют Writing и Speaking</h3><p>По четырём критериям, каждый весит 25%. В Writing Task 2 весит вдвое больше Task 1.</p>
      <div class="crit"><div><h4>Writing</h4><ul class="exl"><li>Task achievement (Task 1) / Task response (Task 2)</li><li>Coherence and cohesion</li><li>Lexical resource</li><li>Grammatical range and accuracy</li></ul></div>
      <div><h4>Speaking</h4><ul class="exl"><li>Fluency and coherence</li><li>Lexical resource</li><li>Grammatical range and accuracy</li><li>Pronunciation</li></ul></div></div>
      <p class="hint">Полные дескрипторы: <a href="https://ielts.org/take-a-test/your-results/ielts-scoring-in-detail" target="_blank" rel="noopener">ielts.org ↗</a></p></section>
    <section class="panel"><h3>Шкала 0–9</h3><ul class="bandl">${BANDS.map(([b,n,d])=>`<li${b===7||b===8?' class="hl"':""}><span class="bn">${b}</span><div><b>${n}</b><small>${d}</small></div></li>`).join("")}</ul></section>
  </div>
  <section class="panel" style="margin-top:24px"><h3>Полезно знать</h3><ul class="exl">
    <li>Academic нужен для учёбы за рубежом, General Training для работы и иммиграции. Listening и Speaking в них одинаковые, Reading и Writing разные. Этот курс готовит к Academic.</li>
    <li>Сдать можно на бумаге или на компьютере. Speaking в обоих случаях проходит с живым экзаменатором.</li>
    <li>Университеты обычно принимают результат, которому не больше двух лет.</li>
    <li>Бесплатные официальные пробные тесты есть в разделе <a href="#materials">Материалы</a>, полные пробники стоят в календаре на неделях 25, 32, 35–38.</li>
  </ul></section>`;
}

let lastRoute = null, flashSel = null;

  if(TOURI===null && !S.tourDone && !render.tourAsked){ render.tourAsked = 1; setTimeout(() => { if(!S.tourDone){ TOURI = 0; tourRender(); } }, 400); }
  header();

  if(r !== lastRoute){ view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter"); lastRoute = r; if(window.scrollY > 200) window.scrollTo({top:0}); }
  else view.classList.remove("enter");
  const si = STAGES.findIndex(s=>s.id===r);
  const sameRoute = view.dataset.route === r, openState = sameRoute ? Object.fromEntries([...view.querySelectorAll("details[id]")].map(d=>[d.id, d.open])) : null;

}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.day){ selDate = d.day; render(); return; }
  if(d.week){ const el = document.getElementById("week-"+d.week); if(el){ el.open = true; el.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
  if(d.cal){ const [y,m] = calMonth.split("-").map(Number); const t = new Date(Date.UTC(y,m-1+Number(d.cal),1)); calMonth = t.toISOString().slice(0,7); render(); return; }
  if(d.skip){ S.skipped[d.skip]=1; save(); render(); toast("Задания дня перенесены на другие дни"); return; }
  if(d.unskip){ delete S.skipped[d.unskip]; save(); render(); return; }
  if(b.id==="simReset"){ S.sim=""; selDate=null; calMonth=null; save(); render(); return; }
  if(d.q){ if(S.ans[d.q]===undefined){ S.ans[d.q]=Number(d.o); exAnswered(d.q, Number(d.o)); flashSel = `[data-q="${d.q}"][data-o="${d.o}"]`; save(); render(); } return; }
  if(d.dfilter){ dictFilter = d.dfilter; render(); return; }
  if(d.wknown){ const k = d.wknown; const cur = allWords().find(x=>x.key===k); setKnown(k, !(cur&&cur.known)); save(); render(); return; }
  if(d.wdel){ S.words = (S.words||[]).filter(x=>String(x.id)!==d.wdel); save(); render(); return; }
  if(d.dtstart){ nextTrain(); render(); return; }
  if(d.dflip){ dictFlip = !dictFlip; render(); const c=document.querySelector("[data-dflip]"); if(c) c.classList.add("flipped"); return; }
  if(d.dtk){ setKnown(d.dtk, true); logCard(); save(); nextTrain(d.dtk); render(); return; }
  if(d.dtnext){ nextTrain(dictTrain); render(); return; }
  if(d.dtstop){ dictTrain = null; render(); return; }
  if(d.linkdel){ const [w,id] = d.linkdel.split(":"); S.links[w] = (S.links[w]||[]).filter(l=>String(l.id)!==id); save(); render(); return; }
  if(d.achdel){ S.ach = (S.ach||[]).filter(a => String(a.id)!==d.achdel); save(); render(); return; }
  if(d.check){ const el = document.getElementById("in-"+d.check); if(el && el.value.trim()){ S.ans[d.check] = el.value.trim(); exAnswered(d.check, el.value.trim()); save(); render(); } return; }
  if(d.reset){ Object.keys(S.ans).filter(k=>k.startsWith(d.reset+"-")).forEach(k=>delete S.ans[k]); save(); render(); return; }
  if(d.flip){ flip[d.flip]=!flip[d.flip]; render(); const c = document.querySelector(`[data-flip="${d.flip}"]`); if(c){ c.classList.add("flipped"); } return; }
  if(d.know){ S.known[d.know]=1; logCard(); flip[d.know.split("-")[0]]=false; save(); render(); return; }
  if(d.later){ const w=d.later; const left=queue(w); if(left.length>1){ const o=order[w]; o.push(o.splice(o.indexOf(left[0]),1)[0]); } flip[w]=false; render(); return; }
  if(d.cardreset){ Object.keys(S.known).filter(k=>k.startsWith(d.cardreset+"-")).forEach(k=>delete S.known[k]); save(); render(); return; }
  let prompt = null;
  if(d.prompt){ const t = BYID[d.prompt.split("#")[0]]; prompt = taskInfo(t.w, t.skill, t.kind).gpt; }
  if(d.codexgpt) prompt = codexPrompt(d.codexgpt);
  if(d.promptw){ const w = Number(d.promptw); prompt = d.kind==="explain" ? explainPrompt(w) : speakPrompt(w); }
  if(prompt){
    try { await navigator.clipboard.writeText(prompt); toast("Промпт скопирован. Вставьте его в ChatGPT и включите голосовой режим"); }
    catch(err){ toast("Не удалось скопировать автоматически"); }
    const a = document.createElement("a"); a.href = "https://chatgpt.com/"; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
  }
});

function countUp(){
  const el = document.querySelector("#view.enter .hero-side .big"); if(!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const end = Number(el.textContent); if(!end) return; const t0 = performance.now();
  const step = t => { const k = Math.min(1,(t-t0)/700); el.textContent = Math.round(end*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
