<style>
/* Layout: grey canvas with rounded white and colour blocks (periwinkle, pink, lime, black), pill buttons. */
:root{
  --bg:#EDEDED;--surface:#FFFFFF;--ink:#161616;--muted:#666666;--line:#E0E0E0;
  --accent:#6B7BF4;--accent-ink:#FFFFFF;--accent-soft:#E2E5FD;

  --band:#161616;--band-soft:#EEF7D2;

  --f-display:"Evolventa","Didact Gothic","Century Gothic",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212;--surface:#1E1E1E;--ink:#F1F1F1;--muted:#A6A6A6;--line:#2E2E2E;
  --accent:#8592FF;--accent-ink:#0E0E0E;--accent-soft:#272C52;--black:#000000;--orange:#FF8A5E;
  --band:#F1F1F1;--band-soft:#2A3318;--ok:#A9D85C;--ok-soft:#26331A;--warn:#F08B78;--warn-soft:#3D221C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212;--surface:#1E1E1E;--ink:#F1F1F1;--muted:#A6A6A6;--line:#2E2E2E;
  --accent:#8592FF;--accent-ink:#0E0E0E;--accent-soft:#272C52;--black:#000000;--orange:#FF8A5E;
  --band:#F1F1F1;--band-soft:#2A3318;--ok:#A9D85C;--ok-soft:#26331A;--warn:#F08B78;--warn-soft:#3D221C;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:22px;margin:0;font-weight:400;letter-spacing:-.01em}
.band{font-size:13px;color:var(--on-color);background:var(--lime);padding:3px 12px;border-radius:999px}
.overall{display:none!important;flex:1 1 260px;display:flex;align-items:center;gap:10px;min-width:0}
.overall .lbl{font-size:13px;color:var(--muted);white-space:nowrap}
.bar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.pct{font-family:var(--f-mono);font-size:13px;min-width:3.5ch;text-align:right;font-variant-numeric:tabular-nums}
.sync{font-size:12px;color:var(--muted);margin-left:auto}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);background:var(--surface);padding:8px 16px;border-radius:999px;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--black);color:#FFFFFF}
main{padding-block:28px 64px}
h2{font-family:var(--f-display);font-size:clamp(26px,4vw,38px);margin:0 0 8px;text-wrap:balance;font-weight:400;text-transform:uppercase;line-height:1.1}
h3{font-size:19px;margin:0 0 8px;font-weight:400}
h2 em{font-style:normal;color:var(--orange)}
.shelf{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:12px 4px 0;margin:0 0 24px;border-bottom:3px solid var(--ink)}
.spine{flex:none;width:30px;border:0;border-radius:4px 4px 2px 2px;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:6px 0;color:#FFFFFF;background:var(--c)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.04em;position:relative;z-index:1;white-space:nowrap}
.spine i{position:absolute;inset:auto 0 0;background:rgba(255,255,255,.35)}
.spine.light{color:var(--on-color)}
.spine.cur{outline:2px solid var(--ink);outline-offset:2px}
.spine:hover{transform:translateY(-4px)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.95fr);grid-template-areas:"main main side" "t1 t2 side";gap:12px;margin-bottom:56px}
.hero-main{grid-area:main;background:var(--surface);border-radius:var(--r);padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero-side{grid-area:side;background:var(--accent);color:#FFFFFF;border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:6px;min-height:280px;min-width:0}
.hero-side .eyebrow{text-transform:uppercase;letter-spacing:.06em;font-size:13px;opacity:.85}
.hero-side .big{font-size:clamp(80px,12vw,140px);line-height:.9;margin-top:auto}
.hero-side .big-sub{font-size:15px;opacity:.9;margin-bottom:12px}
.hero-side .bar{background:rgba(255,255,255,.3)}.hero-side .bar>i{background:#FFFFFF}
.h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5.4vw,60px);line-height:1.02;text-transform:uppercase;margin:0 0 14px;text-wrap:balance}
.h1 em{font-style:normal;color:var(--orange)}
.tile{border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px;justify-content:space-between;min-height:130px;color:var(--on-color);min-width:0}
.tile .tile-h{font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1}
.hero .c-pink{grid-area:t1}.hero .c-lime{grid-area:t2}
.c-pink{background:var(--pink);color:var(--on-color)}.c-lime{background:var(--lime);color:var(--on-color)}.c-accent{background:var(--accent);color:#FFFFFF}.c-black{background:var(--black);color:#FFFFFF}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"main main" "side side" "t1 t2"}}
@media (max-width:480px){.hero{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side" "t1" "t2"}}
.pillbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:999px;padding:9px 18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:14px}
.pillbtn{cursor:pointer}.pillbtn:disabled{opacity:.4;cursor:default}
.pillbtn.dark{background:var(--black);color:#FFFFFF;border-color:var(--black)}
.block{margin-bottom:56px}
.block-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.block-head h2{margin:0}
.lvls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.lvls{grid-template-columns:minmax(0,1fr)}}
.lvl{border-radius:var(--r);padding:20px;min-height:200px;display:flex;flex-direction:column;gap:10px;text-decoration:none;transition:transform .2s}
.lvl:hover{transform:translateY(-3px)}
.lvl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl-name{background:#FFFFFF;color:#161616;border-radius:999px;padding:4px 16px;font-size:20px}
.lvl-desc{margin:8px 0 0;max-width:42ch;font-size:15px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#FFFFFF;color:#161616;border-radius:999px;padding:3px 12px;font-size:12px}
.lvl-bar{display:flex;align-items:center;gap:10px;margin-top:auto}
.c-accent .bar,.c-black .bar{background:rgba(255,255,255,.3)}.c-accent .bar>i,.c-black .bar>i{background:#FFFFFF}
.c-pink .bar,.c-lime .bar{background:rgba(255,255,255,.6)}.c-pink .bar>i,.c-lime .bar>i{background:#161616}
.sub{color:var(--muted);margin:0 0 20px;max-width:65ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border-radius:var(--r);padding:20px}
.notice{border-radius:16px;padding:12px 18px;margin-bottom:16px;font-size:14px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--pink);color:var(--on-color)}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calhead strong{font-size:16px;min-width:9ch}
.iconbtn{border:0;background:var(--black);color:#FFFFFF;border-radius:999px;padding:5px 14px;cursor:pointer}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

.day{position:relative;border:0;border-radius:12px;background:var(--bg);min-height:58px;padding:4px 6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}

.day.review{background:var(--lime);color:var(--on-color)}

.day.today{box-shadow:inset 0 0 0 2px var(--accent)}

.day.sel .dots i.d{background:#FFFFFF}
.day .mv{position:absolute;top:4px;right:6px;font-size:10px;color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* tasks */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dayhead .wk{font-size:13px;color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 14px;background:var(--bg);border-radius:16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}

.skill::after{content:"";position:absolute;top:-4px;right:16px;width:14px;height:22px;background:var(--black);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.skill:nth-child(odd){transform:rotate(-1.2deg)}

.skill:nth-child(4n+2){background:var(--lime);color:var(--on-color)}
.skill:nth-child(4n+3){background:var(--accent);color:#FFFFFF}
.skill:nth-child(4n+4){background:var(--black);color:#FFFFFF}
.skill .bar{background:rgba(255,255,255,.55)}
.skill .bar>i{background:var(--black)}
.skill:nth-child(4n+3) .bar>i,.skill:nth-child(4n+4) .bar>i{background:#FFFFFF}
.skill:nth-child(4n+4) .bar{background:rgba(255,255,255,.2)}
.skill .k{font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.skill .v{display:flex;align-items:center;gap:8px;margin-top:6px}
.stagebar{display:flex;align-items:center;gap:12px;margin:8px 0 20px;max-width:560px}
.stagebar .bar{height:12px}
.weeks{display:flex;flex-direction:column;gap:12px}
details.week{background:var(--surface);border-radius:var(--r);scroll-margin-top:140px}

.wn{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:5ch}
.wt{font-size:17px;min-width:0}

.wbody{padding:4px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px}

.links{margin:0;padding-left:18px}

.q{background:var(--bg);border-radius:16px;padding:12px 14px}
.q p{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{background:var(--lime);border-color:var(--lime);color:var(--on-color)}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.nag{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--lime);color:var(--on-color);border-radius:var(--r);padding:12px 18px;margin-bottom:16px;font-size:14px}.rl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.rl-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;font:inherit;color:inherit}.rl-card:hover{border-color:var(--ink)}.rl-head{display:flex;justify-content:space-between;align-items:center}.rl-text{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px 16px;line-height:1.6;margin:8px 0 14px}.opt.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}.fchip.jump{background:var(--accent);color:#fff;border-color:var(--accent)}.ld-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}.ld-s{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:14px 18px}.ld-s>div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.ld-c{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}.ld-s.ok .ld-c{background:var(--lime);border-color:var(--lime);color:var(--on-color)}.ld-s.ok b{color:var(--muted)}.pr-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 16px}.pr-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}.pr-tile span{font-size:12px;color:var(--muted)}.pr-tile.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}.pr-tile.on span{color:inherit;opacity:.75}.more-gpt{margin-top:4px}.ai-x{background:var(--surface);border-radius:var(--r);padding:12px 16px;margin-top:10px;font-size:14px;line-height:1.55}.pg-tabs{margin:8px 0 16px}.why{font-size:13px;color:var(--muted);margin-top:6px}.ai-v{color:var(--ink)}.ai-fb{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px}.ai-top .ach-band{margin:0}.ai-top{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}.ai-t{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}.ai-t td{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;vertical-align:top}.ai-b{font-weight:600;white-space:nowrap}.ai-fix li{margin-bottom:6px}.ai-rw{font-style:italic}.ai-busy{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
.okc{color:var(--ok);font-weight:400}.badc{color:var(--warn);font-weight:400}
.tin{font:inherit;border:1px solid var(--line);border-radius:999px;padding:5px 14px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 160px;max-width:260px}
.offs{display:flex;flex-direction:column;gap:8px}
.off{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--lime);color:var(--on-color);border-radius:16px;padding:12px 16px}
.off:nth-child(2n){background:var(--pink)}
.off-t{font-size:16px}.off-s{font-size:12px;opacity:.8}

.achform input,.achform select,.achform textarea{font:inherit;border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}

.ach{background:var(--bg);border-radius:16px;padding:12px 14px}

.ach-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ach .pill{border:1px solid var(--line)}
.ach-band{margin-left:auto;font-size:24px;color:var(--orange)}

1:`<p><b>Present Simple</b> — то, что бывает регулярно или верно всегда: привычки, расписание, факты.</p>
<ul><li>Форма: I/you/we/they <b>work</b>, he/she/it <b>works</b>. Вопрос: <b>Do</b> you work? <b>Does</b> she work? Отрицание: I <b>don't</b> work, she <b>doesn't</b> work.</li>
<li>Слова-подсказки: always, usually, often, sometimes, never, every day, on Mondays.</li>
<li>Окончание -s: watch → watches, study → studies, go → goes, have → has.</li></ul>
<p><b>Present Continuous</b> — то, что происходит прямо сейчас или в этот период.</p>
<ul><li>Форма: am/is/are + глагол-ing. I <b>am reading</b>, she <b>is working</b>, they <b>are playing</b>.</li>
<li>Слова-подсказки: now, right now, at the moment, Look!, Listen!, these days, this week.</li></ul>
<p><b>Глаголы состояния</b> (like, love, hate, want, need, know, understand, believe, seem, own) обычно не бывают в Continuous: <i>I know</i>, а не <i>I am knowing</i>.</p>
<p><b>Типичные ошибки:</b> забыть -s (<s>she work</s> → she works); <s>Do she like</s> → Does she like; <s>I am agree</s> → I agree.</p>`,
2:`<p><b>Past Simple</b> — законченное действие в прошлом, когда время известно или понятно.</p>
<ul><li>Правильные глаголы: + ed (worked, played, studied, stopped). Неправильные учим: go → went, see → saw, buy → bought, have → had.</li>
<li>Вопрос и отрицание через <b>did</b>, глагол в начальной форме: <b>Did</b> you <b>see</b>…? I <b>didn't go</b>.</li>
<li>Слова-подсказки: yesterday, last week, in 2020, ago, when I was a child.</li></ul>
<p><b>Used to</b> — прошлая привычка или состояние, которого больше нет: <i>I used to live in Kazan</i> (а теперь нет).</p>
<ul><li>Отрицание и вопрос: I <b>didn't use to</b>…, <b>Did</b> you <b>use to</b>…? (после did без -d).</li>
<li>Не путать с <i>be used to</i> = привыкнуть к чему-то: <i>I'm used to getting up early.</i></li></ul>
<p><b>Типичные ошибки:</b> <s>Did you went</s> → Did you go; <s>I use to play</s> (о прошлом) → I used to play.</p>`,
3:`<p><b>Past Continuous</b> — процесс в определённый момент прошлого: was/were + -ing.</p>
<ul><li><i>At 8 pm I was having dinner.</i> — в 8 вечера шёл процесс.</li>
<li>I/he/she/it <b>was</b>, you/we/they <b>were</b>.</li></ul>
<p><b>Вместе с Past Simple</b>: длинное действие (фон) — Continuous, короткое, которое его прерывает — Simple.</p>
<ul><li><i>I <b>was walking</b> home when it <b>started</b> to rain.</i></li>
<li><b>while</b> + обычно Continuous, <b>when</b> + обычно Simple.</li>
<li>Цепочка действий одно за другим — только Past Simple: <i>She got up, made coffee and left.</i></li></ul>
<p><b>Типичные ошибки:</b> <s>When I was watching TV, the phone was ringing</s> → the phone rang.</p>`,
5:`<p><b>Present Perfect</b> — have/has + 3-я форма. Связь прошлого с настоящим: важен результат или опыт, а не время.</p>
<ul><li>Опыт: <i>I have <b>been</b> to London. Have you <b>ever</b> tried sushi? I've <b>never</b> seen snow.</i></li>
<li>Результат сейчас: <i>I've lost my keys</i> (и сейчас их нет).</li>
<li><b>just</b> — только что, <b>already</b> — уже (в утверждении, перед глаголом), <b>yet</b> — уже/ещё (в вопросах и отрицаниях, в конце).</li></ul>
<p>3-я форма: правильные + ed, неправильные из третьей колонки: go → gone, see → seen, eat → eaten, write → written.</p>
<p><b>Типичные ошибки:</b> <s>I have seen him yesterday</s> → I saw him yesterday (точное время → Past Simple).</p>`,
6:`<p><b>Present Perfect или Past Simple?</b></p>
<ul><li>Есть точное прошедшее время (yesterday, in 2019, last week, ago) → <b>Past Simple</b>.</li>
<li>Время не важно или период ещё не закончился (today, this year, ever, never) → <b>Present Perfect</b>.</li></ul>
<p><b>for и since</b> с Present Perfect — действие началось в прошлом и продолжается сейчас:</p>
<ul><li><b>for</b> + период: for two years, for a long time.</li>
<li><b>since</b> + точка начала: since 2020, since Monday, since I was a child.</li>
<li>Вопрос: <i>How long have you lived here?</i></li></ul>
<p>По-русски «я живу здесь 3 года» — настоящее время, а по-английски <i>I <b>have lived</b> here for 3 years</i>.</p>`,
7:`<p><b>Три способа говорить о будущем</b></p>
<ul><li><b>will</b> — решение в момент речи, обещание, мнение о будущем: <i>I'll help you. I think it will rain.</i></li>
<li><b>be going to</b> — заранее принятое решение или прогноз по видимым признакам: <i>I'm going to study medicine. Look at the sky, it's going to rain.</i></li>
<li><b>Present Continuous</b> — договорённость на конкретное время: <i>I'm meeting Anna at 6.</i></li>
<li><b>Present Simple</b> — расписание: <i>The train leaves at 7.</i></li></ul>
<p>После when/if/as soon as о будущем ставим Present Simple: <i>I'll call you when I <b>arrive</b></i> (не <s>will arrive</s>).</p>`,
9:`<p><b>Сравнение прилагательных</b></p>
<ul><li>Короткие (1 слог): cheap → cheap<b>er</b> → the cheap<b>est</b>; big → big<b>ger</b> → the big<b>gest</b>.</li>
<li>На -y: easy → eas<b>ier</b> → the eas<b>iest</b>.</li>
<li>Длинные (2+ слога): <b>more</b> expensive → the <b>most</b> expensive.</li>
<li>Исключения: good → better → the best; bad → worse → the worst; far → further → the furthest.</li></ul>
<ul><li>Сравнение: <b>than</b> — <i>taller than me</i>. Равенство: <b>as … as</b> — <i>as tall as me</i>; <b>not as … as</b>.</li>
<li>Усиление: <b>much / far / a lot</b> + сравнительная степень: <i>much cheaper</i> (не <s>very cheaper</s>).</li></ul>
<p>В IELTS Writing Task 1 сравнения нужны постоянно: <i>significantly higher than, the lowest figure</i>.</p>`,
10:`<p><b>Модальные глаголы</b> — после них глагол без to (кроме have to).</p>
<ul><li><b>can / could</b> — умение (сейчас / в прошлом), просьба, разрешение: <i>Can I sit here?</i></li>
<li><b>must</b> — сильная необходимость от говорящего; <b>mustn't</b> — запрет.</li>
<li><b>have to</b> — необходимость из-за внешних правил; <b>don't have to</b> — нет необходимости (можно, но не нужно).</li>
<li><b>should / shouldn't</b> — совет.</li></ul>
<p>Главная ловушка: <i>mustn't</i> = нельзя, <i>don't have to</i> = не обязательно.</p>
<p><b>Типичные ошибки:</b> <s>must to go</s> → must go; <s>She cans</s> → She can; <s>Do you can</s> → Can you.</p>`,
11:`<p><b>Исчисляемые и неисчисляемые</b></p>
<ul><li>Исчисляемые: an apple, two apples → <b>many, a few, few</b>.</li>
<li>Неисчисляемые: water, money, advice, information, news, furniture, homework → <b>much, a little, little</b>, без a/an и без -s.</li>
<li>С обоими: some (утверждение), any (вопрос, отрицание), a lot of.</li></ul>
<p><b>Артикли</b></p>
<ul><li><b>a/an</b> — один из многих, впервые упоминаем: <i>I saw a dog.</i> an — перед гласным <b>звуком</b>: an hour, a university.</li>
<li><b>the</b> — конкретный, уже известный или единственный: <i>The dog was black. The sun. The internet.</i> Также музыкальные инструменты и the + превосходная степень.</li>
<li><b>без артикля</b> — вещи вообще во множественном или неисчисляемые: <i>I like music. Dogs are friendly.</i></li></ul>`

13:`<p><b>Present Perfect Continuous</b> — have/has been + -ing. Действие началось в прошлом и <b>длится до сих пор</b> или только что закончилось и виден результат.</p>
<ul><li>Длительность до сейчас: <i>I've been learning English <b>for</b> three years. She's been working here <b>since</b> May.</i></li>
<li>Видимый результат: <i>You're out of breath. <b>Have you been running</b>?</i></li>
<li>Вопрос о длительности: <i><b>How long have you been</b> waiting?</i></li></ul>
<p><b>Continuous или Simple?</b> Continuous — процесс и длительность (<i>I've been writing emails all morning</i>). Simple — результат и количество (<i>I've written ten emails</i>).</p>
<p>Глаголы состояния (know, like, own, believe) в Continuous не ставим: <i>I've <b>known</b> him for years</i>, а не <s>I've been knowing</s>.</p>
<p><b>Для IELTS Speaking Part 1:</b> <i>I've been working as … for …</i>, <i>I've been studying … since …</i> — так звучит естественно.</p>`,
14:`<p><b>Past Perfect</b> — had + 3-я форма. Действие произошло <b>раньше другого</b> прошлого действия.</p>
<ul><li><i>When I arrived, the film <b>had</b> already <b>started</b>.</i> (сначала начался фильм, потом я пришла)</li>
<li>С by the time, before, after, already, just, never … before: <i>I <b>had never seen</b> the sea before that trip.</i></li></ul>
<p><b>Past Perfect Continuous</b> — had been + -ing: длительность до момента в прошлом. <i>She was tired because she <b>had been working</b> all day.</i></p>
<p><b>Времена рассказа</b> (Speaking Part 2): фон — Past Continuous, события по порядку — Past Simple, то, что было раньше, — Past Perfect.</p>
<p><i>It <b>was raining</b> when we <b>got</b> to the station. We <b>had missed</b> the last train, so we <b>took</b> a taxi.</i></p>
<p><b>Типичная ошибка:</b> ставить Past Perfect, когда порядок и так ясен: <i>I woke up, had breakfast and left</i> — всё Past Simple.</p>`,
15:`<p><b>Страдательный залог</b> — be + 3-я форма. Важно действие или результат, а не кто его сделал.</p>
<ul><li>Present: <i>English <b>is spoken</b> here.</i> Past: <i>The bridge <b>was built</b> in 1890.</i></li>
<li>Perfect: <i>The results <b>have been published</b>.</i> Continuous: <i>The road <b>is being repaired</b>.</i></li>
<li>С модальными: <i>Plastic <b>should be recycled</b>. It <b>can be done</b> online.</i></li>
<li>Исполнитель через <b>by</b>, только если он важен: <i>The novel was written <b>by</b> Tolstoy.</i></li></ul>
<p><b>В IELTS Writing</b> пассив нужен в Task 1 (процессы: <i>the bottles are collected, washed and crushed</i>) и делает Task 2 более академичным: <i>It is often argued that …</i></p>
<p><b>Типичные ошибки:</b> <s>The house was build</s> → was <b>built</b>; <s>It was happened</s> → it <b>happened</b> (happen, appear, die не бывают в пассиве).</p>`,
17:`<p><b>Условные предложения 0, 1, 2</b></p>
<ul><li><b>Zero</b> — всегда верно: <i>If you <b>heat</b> ice, it <b>melts</b>.</i> (Present + Present)</li>
<li><b>First</b> — реальное будущее: <i>If it <b>rains</b> tomorrow, we <b>will stay</b> at home.</i> После if — Present, не will.</li>
<li><b>Second</b> — нереальное или маловероятное сейчас: <i>If I <b>had</b> more time, I <b>would travel</b> more.</i> (Past + would)</li></ul>
<p>В Second с be часто <b>were</b> для всех лиц: <i>If I <b>were</b> you, I would apply.</i></p>
<p><b>Unless</b> = if not: <i>Unless we act now, the problem will get worse.</i> Также: as long as, provided that.</p>
<p><b>Для эссе об экологии:</b> <i>If governments <b>invested</b> more in public transport, fewer people <b>would drive</b>.</i> Так удобно предлагать решения.</p>`,
18:`<p><b>Third conditional</b> — нереальное прошлое: <i>If I <b>had studied</b> harder, I <b>would have passed</b>.</i> (had + 3-я форма, would have + 3-я форма)</p>
<p><b>Смешанные условные</b>: прошлое условие → результат сейчас: <i>If I <b>had taken</b> that job, I <b>would be</b> rich now.</i></p>
<p><b>wish / if only</b> — сожаление:</p>
<ul><li>о настоящем → Past: <i>I wish I <b>knew</b> the answer. I wish I <b>were</b> taller.</i></li>
<li>о прошлом → Past Perfect: <i>I wish I <b>hadn't said</b> that.</i></li>
<li>раздражение, желание перемен → would: <i>I wish my neighbours <b>would</b> be quieter.</i></li></ul>
<p><b>Для Speaking Part 3 об образовании:</b> <i>If I had known how important languages are, I would have started earlier.</i></p>`,
19:`<p><b>Определительные придаточные</b> дают информацию о существительном.</p>
<ul><li><b>who</b> — люди, <b>which</b> — вещи, <b>that</b> — и то и другое (только в определяющих), <b>whose</b> — чей, <b>where</b> — место, <b>when</b> — время.</li>
<li><b>Определяющие</b> (без запятых, без них смысл неполный): <i>The city <b>that</b> I like most is Kazan.</i></li>
<li><b>Неопределяющие</b> (с запятыми, доп. информация, <b>that нельзя</b>): <i>Moscow, <b>which</b> is the capital, has 13 million people.</i></li></ul>
<p>Who/which/that можно опустить, если это дополнение: <i>The book (that) I read</i>, но не подлежащее: <i>The man <b>who</b> lives here</i>.</p>
<p><b>В Task 1</b> это помогает связывать данные: <i>The number of cars rose to 80, <b>which</b> was the highest figure in the period.</i></p>`
});

21:`<p><b>Косвенная речь</b> — пересказ чужих слов. После said/told время обычно сдвигается на шаг назад.</p>
<ul><li>Present → Past: <i>"I'm tired" → She said (that) she <b>was</b> tired.</i></li>
<li>Past / Present Perfect → Past Perfect: <i>"I've finished" → He said he <b>had finished</b>.</i></li>
<li>will → would, can → could, must → had to: <i>"I'll call" → She said she <b>would</b> call.</i></li>
<li>Меняются указатели: now → then, today → that day, tomorrow → the next day, here → there.</li></ul>
<p><b>say vs tell:</b> say something / say <b>to</b> somebody, но tell <b>somebody</b>: <i>She told <b>me</b> that …</i></p>
<p><b>Вопросы</b> — прямой порядок слов, без do: <i>"Where do you live?" → He asked where I <b>lived</b>. "Are you ready?" → She asked <b>if</b> I was ready.</i></p>
<p><b>Для эссе о СМИ:</b> reporting verbs звучат академичнее: <i>experts <b>claim</b>, critics <b>argue</b>, the report <b>suggests</b> that …</i></p>`,
22:`<p><b>Герундий (-ing) или инфинитив (to + глагол)?</b> Зависит от глагола перед ним.</p>
<ul><li>+ <b>-ing</b>: enjoy, avoid, mind, finish, suggest, consider, keep, give up, look forward to, be used to. <i>I enjoy <b>swimming</b>.</i></li>
<li>+ <b>to</b>: want, decide, hope, plan, agree, refuse, manage, afford, learn, seem. <i>She decided <b>to leave</b>.</i></li>
<li>После предлогов всегда -ing: <i>interested <b>in learning</b>, good <b>at cooking</b>, <b>instead of</b> driving</i>.</li>
<li>-ing как подлежащее: <i><b>Smoking</b> is harmful.</i></li></ul>
<p><b>Меняется смысл:</b> <i>I stopped <b>to smoke</b></i> (остановилась, чтобы покурить) / <i>I stopped <b>smoking</b></i> (бросила). Так же remember, forget, try.</p>
<p><b>Для эссе о здоровье:</b> <i>Avoiding processed food and taking up a sport can help people stay fit.</i></p>`,
23:`<p><b>Модальные глаголы предположения</b></p>
<ul><li>О настоящем: <b>must</b> (уверена, что да), <b>might / may / could</b> (возможно), <b>can't</b> (уверена, что нет). <i>She <b>must be</b> at home — the lights are on.</i></li>
<li>О прошлом: модальный + <b>have + 3-я форма</b>. <i>He <b>must have forgotten</b>. They <b>might have missed</b> the bus. She <b>can't have seen</b> me.</i></li>
<li>Критика прошлого: <b>should have</b> / <b>shouldn't have</b>: <i>You <b>should have told</b> me.</i></li></ul>
<p><b>Типичные ошибки:</b> <s>He must forgot</s> → must <b>have forgotten</b>; <s>mustn't have</s> для «точно не» → <b>can't have</b>.</p>
<p><b>Для Speaking о преступности:</b> <i>The thief <b>must have known</b> the owners were away.</i> Помогает рассуждать, а не только описывать.</p>`,
25:`<p><b>Future Continuous</b> — will be + -ing: процесс в определённый момент будущего. <i>This time tomorrow I'<b>ll be flying</b> to London.</i></p>
<p><b>Future Perfect</b> — will have + 3-я форма: что будет сделано <b>к</b> моменту в будущем. <i>By 2030, robots <b>will have replaced</b> many jobs.</i></p>
<ul><li>Сигналы Future Perfect: <b>by</b> + время, by the time, by the end of.</li>
<li>Future Perfect Continuous: <i>By June I'<b>ll have been working</b> here for five years.</i></li></ul>
<p><b>Для эссе о работе будущего:</b> <i>In twenty years, many people <b>will be working</b> from home, and AI <b>will have taken over</b> routine tasks.</i></p>
<p><b>Типичная ошибка:</b> <s>By next year I will finish</s> → I <b>will have finished</b>.</p>`,
26:`<p><b>Связки</b> — основа критерия Coherence and cohesion. Важна не частота, а точность.</p>
<ul><li>Добавление: moreover, furthermore, in addition, what is more.</li>
<li>Контраст: however, nevertheless, on the other hand, whereas, while, although, despite + noun/-ing.</li>
<li>Причина и следствие: because of, due to, as a result, consequently, therefore, this leads to.</li>
<li>Пример: for instance, for example, such as, a case in point is.</li>
<li>Вывод: in conclusion, overall, to sum up.</li></ul>
<p><b>Пунктуация:</b> <i>However, …</i> в начале предложения с запятой; <i>although</i> соединяет две части одного предложения.</p>
<p><b>Типичные ошибки:</b> <s>Despite it was raining</s> → Despite <b>the rain</b> / Although it was raining; <s>On the other hand</s> без «on the one hand»-контраста; связка в каждом предложении — это минус.</p>`,
27:`<p><b>Инверсия</b> — обратный порядок слов для акцента, признак уровня C1.</p>
<ul><li>После отрицательных наречий: <i><b>Never have I seen</b> such a view. <b>Rarely do</b> people admit mistakes. <b>Not only does</b> AI save time, <b>but</b> it also reduces errors.</i></li>
<li><b>Hardly / No sooner</b>: <i><b>No sooner had</b> I arrived <b>than</b> it started raining.</i></li>
<li><b>Only</b>: <i><b>Only then did</b> I understand.</i></li>
<li>Условные без if: <i><b>Had I known</b>, I would have come. <b>Should</b> you need help, call me.</i></li></ul>
<p><b>Как использовать:</b> 1–2 раза за эссе, не больше. Например во вступлении: <i>Not only has technology changed how we work, but it has also …</i></p>`
});

29:`<p><b>Cleft sentences</b> — выделяем главное: <i><b>What</b> worries me <b>is</b> the cost. <b>It was</b> my teacher <b>who</b> inspired me. <b>The reason why</b> people work long hours <b>is that</b> …</i></p>
<p><b>Номинализация</b> — глагол или прилагательное превращаем в существительное. Так текст звучит академично и плотно.</p>
<ul><li><i>People <b>consume</b> more energy → <b>Energy consumption</b> has risen.</i></li>
<li><i>Because prices <b>increased</b> → <b>The increase in</b> prices led to …</i></li>
<li><i>Workers are <b>stressed</b> → Workplace <b>stress</b> is a growing concern.</i></li></ul>
<p><b>Для Task 2 problem/solution:</b> <i>One of the main causes of poor work-life balance is <b>the expectation</b> that employees are always available. <b>What</b> companies need <b>is</b> clear rules on working hours.</i></p>
<p>Не перегружайте: 2–3 номинализации на абзац достаточно, иначе текст тяжело читать.</p>`,
30:`<p><b>Безличный пассив</b> — общепринятое мнение без указания «кто считает».</p>
<ul><li><i><b>It is believed that</b> exercise reduces stress.</i></li>
<li><i>Exercise <b>is believed to reduce</b> stress.</i> О прошлом: <i>The disease <b>is thought to have started</b> in …</i></li>
<li>Глаголы: say, believe, think, expect, report, estimate, consider, know.</li></ul>
<p><b>Смягчение (hedging)</b> — осторожные формулировки, признак академического стиля и высокого Lexical resource:</p>
<ul><li><i>tend to, appear to, seem to: People <b>tend to</b> visit doctors less often.</i></li>
<li><i>may, might, could; likely / unlikely; to some extent; in many cases; arguably.</i></li></ul>
<p>Вместо <s>All doctors are overworked</s> → <i>Many doctors <b>appear to be</b> overworked, which <b>may</b> affect the quality of care.</i></p>`,
31:`<p><b>Причастные обороты</b> сокращают придаточные и связывают идеи.</p>
<ul><li>-ing (одновременно или причина): <i><b>Living</b> near the coast, they are used to storms.</i> = Because they live …</li>
<li><b>Having</b> + 3-я форма (сначала одно, потом другое): <i><b>Having finished</b> the report, she went home.</i></li>
<li>3-я форма (пассивный смысл): <i><b>Built</b> in 1890, the bridge is still in use.</i></li>
<li>Сокращённые придаточные: <i>The policy <b>introduced</b> last year …</i> (= which was introduced), <i>people <b>living</b> in cities</i> (= who live).</li></ul>
<p><b>Главная ловушка — «висящее» причастие:</b> подлежащее у оборота и главной части должно совпадать. <s>Walking home, the rain started</s> → <i>Walking home, <b>I</b> got caught in the rain.</i></p>`,
33:`<p><b>Устойчивые сочетания (collocations)</b> — слова, которые носители ставят вместе. Их правильное использование напрямую поднимает Lexical resource.</p>
<ul><li>make vs do: <i><b>make</b> a decision, a mistake, progress, an effort; <b>do</b> research, homework, damage, harm</i>.</li>
<li>Глагол + существительное: <i>pose a threat, raise awareness, meet a need, play a role, take measures</i>.</li>
<li>Прилагательное + существительное: <i>heavy traffic, strong evidence, major impact, growing concern, wide range</i>.</li>
<li>Наречие + прилагательное: <i>highly effective, deeply rooted, widely accepted, vitally important</i>.</li></ul>
<p><b>Идиомы</b> уместны в Speaking, но не в эссе: <i>a piece of cake, once in a blue moon, hit the books</i>. В Writing заменяйте их нейтральными словами.</p>`,
34:`<p><b>Типичные ошибки русскоговорящих</b>, которые стоят баллов на IELTS:</p>
<ul><li>Артикли: <s>The life is hard</s> → Life is hard; <s>I'm student</s> → I'm <b>a</b> student.</li>
<li>Неисчисляемые: advice, information, research, news, furniture, equipment — без -s и без a.</li>
<li>Согласование: <s>The number of cars are</s> → The number <b>is</b>; <s>People is</s> → People <b>are</b>.</li>
<li>Предлоги: depend <b>on</b>, interested <b>in</b>, discuss <b>—</b> (без about), married <b>to</b>, arrive <b>in/at</b>.</li>
<li>Порядок слов в вопросах и косвенных вопросах; <s>I don't know what is it</s> → what it is.</li>
<li>Ложные друзья: <i>actual</i> (≠ актуальный → relevant), <i>sympathetic</i> (≠ симпатичный → nice), <i>magazine</i> (≠ магазин → shop).</li></ul>
<p><b>Совет:</b> посмотрите свой дневник ошибок на вкладке «Тренировка» и выпишите свои 5 самых частых в конспект этой недели.</p>`,
35:`<p><b>Сложные предложения без ошибок</b> — Grammatical range and accuracy ценит не просто длину, а точность.</p>
<ul><li>Сочетайте типы: условное + относительное + пассив: <i>If cities <b>invested</b> in cycling routes, <b>which</b> are relatively cheap, car use <b>would be reduced</b>.</i></li>
<li>Одна главная мысль на предложение. 20–30 слов — хорошая длина; 50 слов — риск ошибки.</li>
<li>Пунктуация: запятая после вводного придаточного (<i>Although …, …</i>), запятые вокруг which-уточнения; нет запятой перед that.</li>
<li>Run-on: <s>Prices rose, people bought less</s> → Prices rose, <b>so</b> people bought less / Prices rose<b>;</b> people bought less.</li></ul>
<p><b>Проверка за 3 минуты до конца эссе:</b> глаголы (время, -s), артикли, множественное число, согласование, точки в конце длинных предложений.</p>`

{h:"Present Simple: форма и когда нужен", th:`<p><b>Present Simple</b> описывает то, что верно всегда или происходит регулярно: факты, привычки, расписания.</p>
<table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr><tr><td>+</td><td>I <b>work</b></td><td>she <b>works</b></td></tr><tr><td>−</td><td>I <b>don't</b> work</td><td>she <b>doesn't</b> work</td></tr><tr><td>?</td><td><b>Do</b> you work?</td><td><b>Does</b> she work?</td></tr></table>
<p><b>Окончание -s</b> у he/she/it: work → works; после -s, -sh, -ch, -x, -o добавляем <b>-es</b>: watches, goes, does; согласная + y → <b>-ies</b>: study → studies, но play → plays. Have → <b>has</b>.</p>
<ul><li>Факт: <i>Water <b>boils</b> at 100 °C.</i></li><li>Привычка: <i>I <b>drink</b> coffee every morning.</i></li><li>Расписание: <i>The train <b>leaves</b> at 7.</i></li></ul>
<p><b>Слова-подсказки:</b> always, usually, often, sometimes, rarely, never, every day, on Mondays, twice a week.</p>`, q:[
["m","My sister ___ in a hospital.",["work","works","working"],1,"She → -s: works."],
["m","He ___ TV every evening.",["watchs","watches","watch"],1,"После -ch → -es: watches."],
["m","Water ___ at 0 °C.",["freeze","freezes","is freezing"],1,"Научный факт → Present Simple, it → -s."],
["m","She ___ English and French.",["studys","studies","study"],1,"Согласная + y → -ies."],
["m","The museum ___ at 10 am on Sundays.",["opens","open","is opening"],0,"Расписание → Present Simple."]]},
{h:"Вопросы, отрицания и наречия частоты", th:`<p>В вопросах и отрицаниях работает вспомогательный глагол <b>do / does</b>, а основной глагол остаётся в начальной форме — <b>без -s</b>.</p>
<ul><li><i><b>Does</b> he <b>live</b> here?</i> (не <s>Does he lives</s>)</li><li><i>She <b>doesn't</b> eat meat.</i> (не <s>doesn't eats</s>)</li></ul>
<p><b>Вопросы со словами:</b> <i>Where <b>do</b> you live? What time <b>does</b> the lesson start? How often <b>do</b> you exercise?</i></p>
<p><b>Наречия частоты</b> стоят <b>перед основным глаголом</b>, но <b>после be</b>:</p>
<ul><li><i>I <b>usually</b> get up at 7.</i></li><li><i>She is <b>always</b> late.</i></li></ul>
<p>Sometimes и usually можно поставить в начало: <i><b>Sometimes</b> I work from home.</i> Выражения <b>every day, once a week</b> — в конец.</p>
<p><b>Для IELTS Part 1:</b> на вопрос «How often…?» отвечайте полным предложением с наречием: <i>I go swimming about twice a week, usually on weekends.</i></p>`, q:[
["m","___ your brother play football?",["Do","Does","Is"],1,"He → Does."],
["m","She ___ like horror films.",["don't","doesn't","isn't"],1,"She → doesn't."],
["m","Which is correct?",["I go usually to bed late.","I usually go to bed late.","Usually I go to bed lately."],1,"Наречие частоты перед основным глаголом."],
["t","Where ___ your parents live?",["do"],"They → do."],
["t","He ___ (not / drink) coffee.",["doesn't drink","does not drink"],"He → doesn't + начальная форма."]]},
{h:"Present Continuous: форма и «прямо сейчас»", th:`<p><b>Present Continuous</b> — am / is / are + глагол с <b>-ing</b>. Действие происходит в момент речи или в текущий период.</p>
<table><tr><td>+</td><td>I <b>am</b> reading · she <b>is</b> reading · they <b>are</b> reading</td></tr><tr><td>−</td><td>I'm <b>not</b> reading · she <b>isn't</b> reading</td></tr><tr><td>?</td><td><b>Are</b> you reading? <b>Is</b> she reading?</td></tr></table>
<p><b>Правописание -ing:</b> make → making (немое e уходит); sit → sitting, run → running, swim → swimming (короткий слог: удваиваем согласную); lie → lying; study → studying.</p>
<ul><li>Сейчас: <i>Look! It <b>is snowing</b>.</i></li><li>Текущий период: <i>I <b>am reading</b> a great book this week.</i></li><li>Временная ситуация: <i>She <b>is living</b> with her aunt until she finds a flat.</i></li></ul>
<p><b>Слова-подсказки:</b> now, right now, at the moment, Look!, Listen!, these days, this week, currently.</p>`, q:[
["t","Look! The baby ___ (sleep).",["is sleeping","'s sleeping"],"Look! → сейчас."],
["t","They ___ (swim) in the lake right now.",["are swimming","'re swimming"],"swim → swimming (удвоение)."],
["t","I ___ (write) an essay at the moment.",["am writing","'m writing"],"write → writing."],
["t","___ you ___ (listen) to me? (вопрос)",["are listening","are / listening"],"Are you listening?"],
["t","She ___ (not / work) this week — she's on holiday.",["isn't working","is not working","'s not working"],"Временная ситуация."]]},
{h:"Simple или Continuous: постоянное и временное", th:`<p>Главный вопрос: это <b>обычно / всегда</b> или <b>сейчас / временно</b>?</p>
<table><tr><th>Present Simple</th><th>Present Continuous</th></tr><tr><td><i>I <b>live</b> in Kazan.</i> (постоянно)</td><td><i>I'<b>m living</b> in Moscow this year.</i> (временно)</td></tr><tr><td><i>He <b>works</b> in a bank.</i></td><td><i>He'<b>s working</b> from home today.</i></td></tr><tr><td><i>It often <b>rains</b> here.</i></td><td><i>It'<b>s raining</b> now.</i></td></tr></table>
<p><b>Тенденции и изменения</b> — Continuous: <i>Prices <b>are rising</b>. More people <b>are working</b> remotely.</i> Это полезно для IELTS Writing и Speaking Part 3.</p>
<p><b>Раздражающая привычка</b> — Continuous + always: <i>He'<b>s always losing</b> his keys!</i></p>
<p><b>Совет:</b> если в предложении есть <i>every day / usually</i> — почти всегда Simple; если <i>now / this week / these days</i> — Continuous.</p>`, q:[
["t","I usually ___ (walk) to work, but today I ___ (take) the bus. Две формы через пробел.",["walk am taking","walk 'm taking"],"Обычно → walk; сегодня → am taking."],
["t","More and more people ___ (buy) electric cars these days.",["are buying"],"Тенденция → Continuous."],
["t","My dad ___ (cook) dinner every Sunday.",["cooks"],"Регулярно → Simple."],
["h","Найдите ошибку: «I am going to the gym every day.»",["go","i go"],"Every day → привычка → I go."],
["h","Найдите ошибку: «Listen! Someone knocks at the door.»",["is knocking","someone is knocking"],"Listen! → сейчас → is knocking."]]},
{h:"Глаголы состояния", th:`<p>Некоторые глаголы описывают <b>состояние</b>, а не действие, и обычно <b>не ставятся в Continuous</b>:</p>
<ul><li>чувства: like, love, hate, want, prefer, need</li><li>мысли: know, believe, understand, remember, mean, think (= считать)</li><li>обладание: have (= иметь), own, belong</li><li>восприятие: see, hear, smell, taste, seem</li></ul>
<p><i>I <b>know</b> the answer.</i> (не <s>I'm knowing</s>) · <i>This bag <b>belongs</b> to me.</i></p>
<p><b>Двойное значение</b> — когда это действие, Continuous возможен:</p>
<table><tr><td><i>I <b>think</b> it's a good idea.</i> (мнение)</td><td><i>I'<b>m thinking</b> about my exam.</i> (процесс)</td></tr><tr><td><i>She <b>has</b> two cats.</i> (обладание)</td><td><i>She'<b>s having</b> lunch.</i> (действие: есть)</td></tr><tr><td><i>The soup <b>tastes</b> great.</i></td><td><i>He'<b>s tasting</b> the soup.</i> (пробует)</td></tr></table>
<p><b>Типичная ошибка русскоговорящих:</b> <s>I'm agree</s> → <b>I agree</b>; agree — обычный глагол, без am.</p>`, q:[
["h","Найдите ошибку: «I am wanting a new phone.»",["want","i want"],"Want — состояние."],
["h","Найдите ошибку: «I'm agree with you.»",["agree","i agree"],"Agree без am."],
["h","Контекст: «Be quiet, I ___ (think)!» — процесс",["am thinking","'m thinking"],"Процесс → am thinking."],
["h","Контекст: «We ___ (have) dinner now, can I call you back?»",["are having","'re having"],"Have = есть → действие → Continuous."],
["h","Найдите ошибку: «This car is belonging to my uncle.»",["belongs","this car belongs"],"Belong — состояние."]]},
{h:"Практика: рассказ о себе (IELTS Part 1)", th:`<p>Сегодня собираем всё вместе. В IELTS Speaking Part 1 вас спросят о работе, учёбе, доме, хобби. Хороший ответ = <b>прямой ответ + деталь + пример</b>, и в нём естественно смешиваются Simple и Continuous.</p>
<p><i>Q: Do you work or study?</i><br><i>A: I <b>work</b> as a designer in a small company. At the moment I'<b>m working</b> on a big project for a bank, so I'<b>m spending</b> a lot of time at the office. But usually I <b>finish</b> at six and <b>go</b> to the gym.</i></p>
<p><b>Шаблоны:</b></p><ul><li>I usually … but these days I'm …</li><li>I don't … very often, maybe once a month.</li><li>What I really enjoy is … because …</li></ul>
<p><b>Задание:</b> запишите в конспект 3 ответа о себе по этой схеме и проговорите вслух на таймер по 30 секунд.</p>`, q:[
["m","At the moment I ___ for my exams, so I rarely ___ out.",["study / go","am studying / go","am studying / am going"],1,"Сейчас → am studying; редко (привычка) → go."],
["t","Q: What do you do in your free time? A: I ___ (love) reading, and right now I ___ (read) a novel by Orwell.",["love am reading","love 'm reading"],"Love — состояние; right now → am reading."],
["t","Q: How often do you cook? A: I ___ (cook) about three times a week.",["cook"],"Частота → Simple."],
["h","Текст. Вставьте две формы через пробел: «My brother ___ (live) in Spain, but this month he ___ (stay) with us.»",["lives is staying","lives 's staying"],"Постоянно → lives; временно → is staying."],
["h","Найдите ошибку: «What are you usually doing at weekends?»",["what do you usually do","do you usually do"],"Usually → Present Simple вопрос."]]}
];

{h:"Past Simple: правильные глаголы", th:`<p><b>Past Simple</b> — законченное действие в прошлом, когда время известно или понятно из контекста.</p>
<table><tr><td>+</td><td>I <b>worked</b> · she <b>worked</b> (одинаково для всех лиц)</td></tr><tr><td>−</td><td>I <b>didn't work</b></td></tr><tr><td>?</td><td><b>Did</b> you <b>work</b>?</td></tr></table>
<p><b>Правописание -ed:</b> live → lived; stop → stopped (удвоение после короткого слога); study → studied; play → played.</p>
<p><b>Произношение -ed:</b> /t/ после глухих (worked, stopped), /d/ после звонких (played, lived), /ɪd/ после t и d (wanted, needed). Это важно для Pronunciation в Speaking.</p>
<p><b>Слова-подсказки:</b> yesterday, last week / month / year, ago, in 2015, when I was a child.</p>`, q:[
["m","We ___ the museum yesterday.",["visit","visited","have visited"],1,"Yesterday → Past Simple."],
["m","She ___ to London in 2018.",["moved","moves","has moved"],0,"In 2018 → Past Simple."],
["m","He ___ the bus and was late.",["missd","missed","misses"],1,"miss → missed."],
["m","I ___ French at school.",["studyed","studied","studied'"],1,"Согласная + y → -ied."],
["m","They ___ the game last night.",["stoped","stopped","stopping"],1,"Короткий слог → удвоение: stopped."]]},
{h:"Неправильные глаголы", th:`<p>Около 100 частых глаголов образуют прошедшее время <b>не по правилу</b>. Их нужно выучить — лучше группами:</p>
<table><tr><td>без изменений</td><td>cut – cut, put – put, let – let, cost – cost</td></tr><tr><td>-ought / -aught</td><td>buy – bought, think – thought, bring – brought, teach – taught, catch – caught</td></tr><tr><td>i → a</td><td>begin – began, drink – drank, swim – swam, sing – sang</td></tr><tr><td>ee/ea → e</td><td>feel – felt, keep – kept, sleep – slept, meet – met, leave – left</td></tr><tr><td>свои</td><td>go – went, be – was/were, have – had, do – did, see – saw, eat – ate, take – took, make – made, get – got, write – wrote</td></tr></table>
<p><b>Важно:</b> после did — начальная форма: <i>Did you <b>see</b> it?</i> (не <s>Did you saw</s>); <i>I didn't <b>go</b>.</i></p>
<p><b>Совет:</b> добавьте 10 неправильных глаголов в «Мои слова» и прогоняйте их карточками.</p>`, q:[
["m","I ___ a new jacket last weekend.",["buyed","bought","brought"],1,"buy – bought."],
["m","She ___ me a long letter.",["writed","wrote","written"],1,"write – wrote."],
["m","We ___ at a café near the station.",["meeted","met","meet"],1,"meet – met."],
["t","He ___ (teach) English in China for two years.",["taught"],"teach – taught."],
["t","Did you ___ (see) the match?",["see"],"После did — начальная форма."]]},
{h:"Вопросы и отрицания в прошлом", th:`<p>Вопросы и отрицания строятся с <b>did / didn't</b> + начальная форма — для правильных и неправильных глаголов одинаково.</p>
<ul><li><i>Where <b>did</b> you <b>go</b> on holiday?</i></li><li><i>I <b>didn't</b> like the film.</i></li><li><i>What time <b>did</b> the party <b>start</b>?</i></li></ul>
<p><b>Исключение — be:</b> <i>Were you tired? I wasn't at home. Was the hotel good?</i> — без did.</p>
<p><b>Вопрос к подлежащему</b> — без did: <i>Who <b>called</b> you? What <b>happened</b>?</i> (не <s>What did happen</s>)</p>
<p><b>Короткие ответы:</b> <i>Did you enjoy it? — Yes, I did. / No, I didn't.</i></p>`, q:[
["t","___ you enjoy the concert? (вспомогательный глагол)",["did"],"Вопрос в прошлом → Did."],
["t","She ___ (not / come) to the party.",["didn't come","did not come"],"didn't + начальная форма."],
["t","Where ___ you ___ (be) yesterday?",["were","were / —"],"Be → were, без did. Впишите: were."],
["t","Who ___ (break) the window? (вопрос к подлежащему)",["broke"],"Вопрос к подлежащему без did."],
["t","What ___ (happen) after the meeting?",["happened"],"What happened? — без did."]]},
{h:"used to и would: прошлые привычки", th:`<p><b>used to + глагол</b> — то, что было регулярно или было правдой раньше, а теперь нет.</p>
<ul><li><i>I <b>used to play</b> the piano.</i> (раньше играла, сейчас нет)</li><li><i>There <b>used to be</b> a cinema here.</i></li><li>Отрицание и вопрос — без d: <i>I <b>didn't use to</b> like fish. <b>Did</b> you <b>use to</b> live here?</i></li></ul>
<p><b>would</b> — тоже повторяющиеся действия в прошлом, но <b>только действия</b>, не состояния: <i>Every summer we <b>would go</b> to the sea.</i> Но <s>I would have long hair</s> → I <b>used to have</b> long hair.</p>
<p><b>Не путать:</b> <i>be used to + -ing</i> = привыкнуть: <i>I'<b>m used to getting</b> up early.</i></p>
<p><b>Для IELTS Part 1/2:</b> <i>When I was a child, I used to … but now I …</i> — отличный способ показать грамматику.</p>`, q:[
["t","I ___ (play) tennis when I was at school, but I stopped. (used to)",["used to play"],"Прошлая привычка → used to play."],
["t","___ you use to have a pet? (вспомогательный)",["did"],"Did you use to …?"],
["t","She ___ (not / like) vegetables as a child. (used to)",["didn't use to like","did not use to like"],"didn't use to — без d."],
["h","Найдите ошибку: «I didn't used to drink coffee.»",["didn't use to","didn't use to drink"],"После didn't — use to."],
["h","Найдите ошибку: «When I was young, I would have a dog.»",["used to have"],"Have (состояние) → used to, не would."]]},
{h:"Past Simple в рассказе", th:`<p>Рассказ о прошлом (Speaking Part 2, письмо другу) — это цепочка действий в <b>Past Simple</b>, связанных словами последовательности.</p>
<ul><li><b>First / At first</b>, … <b>Then</b> … <b>After that</b> … <b>Later</b> … <b>Finally / In the end</b> …</li><li>Время: <b>when</b> I was …, <b>two years ago</b>, <b>the next day</b>, <b>a week later</b>.</li></ul>
<p><i>Last summer I <b>went</b> to Sochi with my friends. <b>First</b>, we <b>spent</b> two days on the beach. <b>Then</b> we <b>took</b> a cable car to the mountains. <b>In the end</b>, it <b>was</b> the best trip of the year.</i></p>
<p><b>Типичные ошибки:</b> <s>I go there last year</s> → went; <s>Yesterday I have seen</s> → saw; <s>two years before</s> (о прошлом от сейчас) → two years <b>ago</b>.</p>`, q:[
["h","Найдите ошибку: «I go to Paris two years ago.»",["went","i went"],"Ago → Past Simple."],
["h","Найдите ошибку: «I met him three days before.» (от сегодня)",["ago","three days ago"],"От момента речи → ago."],
["h","Текст, две формы через пробел: «We ___ (get) to the hotel late and ___ (go) straight to bed.»",["got went"],"get – got, go – went."],
["h","Найдите ошибку: «Did she went to school yesterday?»",["did she go","go"],"После did — начальная форма."],
["h","Перефразируйте: «I was born in 2001.» → I ___ born 23 years ago. (одно слово)",["was"],"Be → was."]]},
{h:"Практика: что я делала в выходные", th:`<p>Типичный вопрос Speaking Part 1: <i>What did you do last weekend?</i> Отвечаем 3–4 предложениями в Past Simple, добавляем оценку.</p>
<p><i>On Saturday I <b>met</b> my friends in the city centre. We <b>had</b> lunch in a new Italian place and then <b>walked</b> along the river. On Sunday I <b>stayed</b> at home and <b>finished</b> a book I'd started. It <b>was</b> relaxing.</i></p>
<p><b>Чтобы звучать естественнее:</b> I didn't do anything special, but… · The highlight was… · It turned out to be…</p>
<p><b>Задание:</b> запишите в конспект свой рассказ о прошлых выходных (5–6 предложений) и проверьте все глаголы — нет ли настоящего времени.</p>`, q:[
["m","Last Saturday I ___ my grandparents.",["visit","visited","was visit"],1,"Past Simple."],
["t","We ___ (have) a picnic and then ___ (watch) a film. Две формы через пробел.",["had watched"],"have – had; watch – watched."],
["t","It ___ (be) a really nice day.",["was"],"Be → was."],
["h","Найдите ошибку: «On Sunday I stay at home and read.»",["stayed","i stayed at home and read"],"Прошлые выходные → stayed (read = read)."],
["h","Перефразируйте: «In the past I smoked, but I don't now.» → I used ___ smoke.",["to"],"used to smoke."]]}
];

{h:"Past Continuous: процесс в прошлом", th:`<p><b>Past Continuous</b> — was / were + -ing. Действие было <b>в процессе</b> в определённый момент прошлого.</p>
<table><tr><td>+</td><td>I / he / she / it <b>was working</b> · you / we / they <b>were working</b></td></tr><tr><td>−</td><td>I <b>wasn't</b> working · they <b>weren't</b> working</td></tr><tr><td>?</td><td><b>Was</b> she working? <b>Were</b> you working?</td></tr></table>
<ul><li>Момент в прошлом: <i>At 8 pm yesterday I <b>was having</b> dinner.</i></li><li>Фон истории: <i>The sun <b>was shining</b> and birds <b>were singing</b>.</i></li></ul>
<p><b>Слова-подсказки:</b> at 5 o'clock yesterday, at that moment, all evening, while.</p>`, q:[
["m","At 9 pm yesterday I ___ TV.",["watched","was watching","were watching"],1,"Момент в прошлом → was watching."],
["m","They ___ football when it started to rain.",["was playing","were playing","played"],1,"They → were."],
["m","What ___ you doing at midnight?",["was","were","did"],1,"You → were."],
["m","The children ___ sleeping when we came home.",["wasn't","weren't","didn't"],1,"Children → weren't."],
["m","It was a beautiful morning. The sun ___.",["shone","was shining","shines"],1,"Фон → Past Continuous."]]},
{h:"when и while: длинное и короткое действие", th:`<p>Часто в одном предложении два прошлых действия: <b>длинное</b> (фон, Past Continuous) и <b>короткое</b>, которое его прерывает (Past Simple).</p>
<ul><li><i>I <b>was cooking</b> <b>when</b> the phone <b>rang</b>.</i></li><li><i><b>While</b> I <b>was cooking</b>, the phone <b>rang</b>.</i></li></ul>
<p><b>when</b> обычно перед коротким действием, <b>while</b> — перед длинным.</p>
<p><b>Два параллельных процесса</b> — оба Continuous: <i>While I <b>was studying</b>, my sister <b>was watching</b> TV.</i></p>
<p><b>Действия по очереди</b> — оба Simple: <i>When she <b>saw</b> me, she <b>smiled</b>.</i> (сначала увидела, потом улыбнулась)</p>`, q:[
["m","I ___ a shower when the doorbell ___.",["had / was ringing","was having / rang","was having / was ringing"],1,"Длинное → was having; короткое → rang."],
["m","___ I was walking home, I met an old friend.",["When","While","During"],1,"While + длинное действие."],
["m","When he ___ the news, he called his mum.",["was hearing","heard","hears"],1,"По очереди → Past Simple."],
["t","While I ___ (read), my brother ___ (play) games. Две формы через пробел.",["was reading was playing"],"Параллельные процессы."],
["t","She ___ (fall) while she ___ (ski). Две формы через пробел.",["fell was skiing"],"Короткое → fell; длинное → was skiing."]]},
{h:"Past Simple или Past Continuous", th:`<p>Как выбрать: спросите себя — это <b>законченный факт / событие</b> или <b>процесс, фон</b>?</p>
<table><tr><th>Past Simple</th><th>Past Continuous</th></tr><tr><td><i>I <b>read</b> a book yesterday.</i> (прочитала)</td><td><i>I <b>was reading</b> a book at 10.</i> (была в процессе)</td></tr><tr><td><i>It <b>rained</b> all day.</i> (факт)</td><td><i>It <b>was raining</b> when I left.</i> (фон)</td></tr></table>
<p><b>Глаголы состояния</b> и здесь не ставим в Continuous: <i>I <b>knew</b> the answer</i>, не <s>was knowing</s>.</p>
<p><b>Типичная ошибка:</b> ставить Continuous для всего длинного: <s>I was living in Kazan for 5 years</s> → I <b>lived</b> in Kazan for 5 years (законченный период).</p>`, q:[
["t","I ___ (live) in Samara for three years, then moved to Moscow.",["lived"],"Законченный период → Past Simple."],
["t","What ___ you ___ (do) at 6 pm yesterday?",["were doing","were / doing"],"Момент в прошлом."],
["t","We ___ (not / know) the way, so we asked a policeman.",["didn't know","did not know"],"Know — состояние."],
["h","Найдите ошибку: «When I arrived, they had dinner.» (были в процессе)",["were having","they were having dinner"],"В процессе → were having."],
["h","Найдите ошибку: «I was knowing him at school.»",["knew","i knew him"],"Know — состояние."]]},
{h:"Строим историю: фон, события, кульминация", th:`<p>Хорошая история (Speaking Part 2) строится так:</p>
<ol><li><b>Фон</b> — Past Continuous: <i>It was a cold evening. I <b>was walking</b> home from work…</i></li><li><b>События</b> — Past Simple по порядку: <i>Suddenly I <b>heard</b> a noise. I <b>turned</b> round and <b>saw</b>…</i></li><li><b>Итог и чувства</b>: <i>I <b>felt</b> relieved. It <b>was</b> one of the strangest days of my life.</i></li></ol>
<p><b>Слова для напряжения:</b> suddenly, all of a sudden, just then, at that moment, to my surprise.</p>
<p><b>Совет:</b> 1–2 фразы фона в начале сразу показывают экзаменатору Grammatical range.</p>`, q:[
["t","It ___ (snow) heavily when we ___ (leave) the house. Две формы через пробел.",["was snowing left"],"Фон + событие."],
["t","Suddenly the lights ___ (go) out.",["went"],"Событие → went."],
["h","Текст, три формы через пробел: «I ___ (wait) for the bus when a car ___ (stop) and a man ___ (ask) for directions.»",["was waiting stopped asked"],"Фон + два события."],
["h","Найдите ошибку: «While I watched TV, the lights went out.»",["was watching","while i was watching tv"],"Длинное с while → was watching."],
["h","Найдите ошибку: «Suddenly I was hearing a loud noise.»",["heard","suddenly i heard"],"Короткое событие → heard."]]},
{h:"Ошибки и тонкости", th:`<p><b>Частые ошибки</b> в прошедших временах:</p>
<ul><li><s>I was go</s> → I <b>went</b> / I <b>was going</b> (was + -ing, не начальная форма).</li><li><s>Did you was</s> → <b>Were</b> you…?</li><li><s>When I was arriving, he left</s> → When I <b>arrived</b>, he <b>had left</b> / he <b>was leaving</b> (смотрим на смысл).</li><li><b>during</b> + существительное, <b>while</b> + предложение: <i>during the lesson / while I was having lessons</i>.</li></ul>
<p><b>Вежливая просьба</b> через Past Continuous: <i>I <b>was wondering</b> if you could help me.</i> — очень естественно звучит в письмах.</p>`, q:[
["h","Найдите ошибку: «I was go to the shop when I saw her.»",["was going","i was going"],"Was + -ing."],
["h","Найдите ошибку: «I fell asleep while the film.»",["during the film","during"],"While + предложение; during + сущ."],
["h","Найдите ошибку: «Did you was at home last night?»",["were you","were you at home"],"Be → Were you."],
["h","Перефразируйте вежливо: «Can you help me?» → I ___ if you could help me.",["was wondering"],"I was wondering if…"],
["h","Контекст: «When I got to the station, the train ___ (leave) — I could still see it moving.»",["was leaving"],"Был в процессе → was leaving."]]},
{h:"Практика: история из поездки", th:`<p>Speaking Part 2: <i>Describe a memorable trip.</i> Используйте схему: <b>где и когда → фон → 2–3 события → почему запомнилось</b>.</p>
<p><i>A few years ago I <b>went</b> to Saint Petersburg with my best friend. It <b>was raining</b> when we <b>arrived</b>, and we <b>were feeling</b> a bit disappointed. But the next day the sun <b>came</b> out, we <b>took</b> a boat trip along the canals, and in the evening we <b>were walking</b> along Nevsky Prospect when we <b>saw</b> the bridges open. That <b>was</b> unforgettable.</i></p>
<p><b>Задание:</b> напишите свою историю в конспект (8–10 предложений), подчеркните все глаголы и проверьте: фон — Continuous, события — Simple. Потом расскажите её на таймер за 2 минуты.</p>`, q:[
["m","We ___ along the beach when we saw a dolphin.",["walked","were walking","walk"],1,"Фон + событие."],
["t","When we ___ (arrive), it ___ (rain). Две формы через пробел.",["arrived was raining"],"Событие + фон."],
["t","The next day we ___ (take) a boat trip.",["took"],"Событие → took."],
["h","Текст, три формы через пробел: «While we ___ (have) lunch, a street musician ___ (start) to play, and everybody ___ (dance).»",["were having started danced"],"Фон + два события."],
["h","Найдите ошибку: «It was the best trip I was ever having.»",["i have ever had","have ever had"],"Опыт до сейчас → I have ever had."]]}
];

{h:"Present Perfect: форма", th:`<p><b>Present Perfect</b> = <b>have / has</b> + третья форма глагола (V3). Он связывает прошлое с настоящим: важен результат или опыт, а не время.</p>
<table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr><tr><td>+</td><td>I <b>have finished</b> (I've)</td><td>she <b>has finished</b> (she's)</td></tr><tr><td>−</td><td>I <b>haven't</b> finished</td><td>she <b>hasn't</b> finished</td></tr><tr><td>?</td><td><b>Have</b> you finished?</td><td><b>Has</b> she finished?</td></tr></table>
<p><b>V3 правильных глаголов</b> = -ed: work → worked. <b>Неправильные</b> надо учить: go → <b>gone</b>, see → <b>seen</b>, do → <b>done</b>, write → <b>written</b>, eat → <b>eaten</b>, take → <b>taken</b>, be → <b>been</b>, buy → <b>bought</b>, lose → <b>lost</b>.</p>
<ul><li>Результат: <i>I'<b>ve lost</b> my keys.</i> (их нет сейчас)</li><li>Новость: <i>The government <b>has announced</b> new rules.</i></li></ul>
<p><b>Ловушка:</b> she's = she is <b>или</b> she has. <i>She's gone</i> = has gone; <i>She's going</i> = is going.</p>`, q:[
["m","She ___ her homework.",["have done","has done","has did"],1,"She → has + V3 (done)."],
["m","Третья форма от write:",["wrote","writed","written"],2,"write – wrote – written."],
["m","They ___ to Spain twice.",["has been","have been","have gone"],1,"They → have; опыт поездки → been."],
["m","«I've lost my phone» значит:",["телефона нет сейчас","я потеряла его давно и нашла","я теряю его часто"],0,"Present Perfect — результат в настоящем."],
["m","___ you seen this film?",["Did","Has","Have"],2,"You → Have."]]},
{h:"Опыт: ever, never, been / gone", th:`<p>Present Perfect рассказывает об <b>опыте за всю жизнь</b>, когда <b>не важно, когда именно</b>.</p>
<ul><li><i><b>Have</b> you <b>ever</b> <b>tried</b> sushi?</i> — ever = «когда-нибудь», только в вопросах</li><li><i>I'<b>ve never been</b> to Japan.</i> — never уже отрицание, not не нужно</li><li><i>This is the best book I'<b>ve ever read</b>.</i> — после превосходной степени</li></ul>
<table><tr><th>been</th><th>gone</th></tr><tr><td><i>She <b>has been</b> to Paris.</i> — была и вернулась</td><td><i>She <b>has gone</b> to Paris.</i> — уехала и сейчас там</td></tr></table>
<p><b>Для IELTS Speaking:</b> вопрос «Have you ever…?» — хороший шанс показать время: <i>Yes, I have. I've been there twice, actually — the first time was in 2019.</i> Обратите внимание: конкретное время уже в Past Simple.</p>`, q:[
["m","I've ___ been to Italy. (никогда)",["ever","never","not never"],1,"Never без not."],
["m","Где она? — She ___ to the shop. (сейчас там)",["has been","has gone","went"],1,"Сейчас там → gone."],
["m","Have you ___ eaten oysters?",["ever","never","yet"],0,"Вопрос об опыте → ever."],
["t","It's the most beautiful place I ___ ever ___ (see).",["have seen","'ve seen","have / seen"],"Превосходная + Present Perfect."],
["t","I ___ (never / fly) in a helicopter.",["have never flown","'ve never flown"],"fly – flew – flown."]]},
{h:"just, already, yet", th:`<p>Эти слова показывают, <b>сделано ли уже</b> действие к настоящему моменту.</p>
<table><tr><th>Слово</th><th>Значение</th><th>Место</th><th>Пример</th></tr>
<tr><td><b>just</b></td><td>только что</td><td>между have и V3</td><td><i>I'<b>ve just</b> arrived.</i></td></tr>
<tr><td><b>already</b></td><td>уже (раньше, чем ждали)</td><td>между have и V3</td><td><i>She'<b>s already</b> left.</i></td></tr>
<tr><td><b>yet</b></td><td>ещё (не) / уже?</td><td>в конце, в − и ?</td><td><i>I haven't finished <b>yet</b>. Have you eaten <b>yet</b>?</i></td></tr>
<tr><td><b>still</b></td><td>всё ещё (не)</td><td>перед haven't</td><td><i>He <b>still</b> hasn't called.</i></td></tr></table>
<p><b>Частая ошибка:</b> <s>I have finished it yet</s> → в утверждении yet не ставим, говорим <i>already</i>.</p>`, q:[
["m","Have you finished ___?",["already","yet","just"],1,"Вопрос, конец предложения → yet."],
["m","I've ___ seen him — he was here a minute ago.",["yet","just","still"],1,"Только что → just."],
["t","Он ещё не позвонил. → He hasn't called ___.",["yet"],"Отрицание → yet в конце."],
["t","Поставьте already: «She has booked the tickets.»",["she has already booked the tickets","she's already booked the tickets"],"Already между has и V3."],
["t","She ___ (still / not / reply) to my email.",["still hasn't replied","still has not replied"],"Still перед hasn't."]]},
{h:"Present Perfect или Past Simple", th:`<p>Главное правило: <b>есть конкретное время в прошлом</b> → Past Simple. <b>Нет времени, важен результат или опыт</b> → Present Perfect.</p>
<table><tr><th>Present Perfect</th><th>Past Simple</th></tr><tr><td><i>I'<b>ve visited</b> London.</i></td><td><i>I <b>visited</b> London <b>in 2020</b>.</i></td></tr><tr><td><i>He'<b>s broken</b> his arm.</i> (сейчас в гипсе)</td><td><i>He <b>broke</b> his arm <b>last year</b>.</i></td></tr><tr><td>ever, never, just, already, yet, so far, recently</td><td>yesterday, ago, last week, in 2019, when…?</td></tr></table>
<p>Вопрос с <b>When</b> всегда в Past Simple: <i><b>When did</b> you <b>arrive</b>?</i> (не <s>When have you arrived</s>).</p>
<p><b>Типичный диалог:</b> сначала Perfect (новость), затем Past Simple (детали): <i>I'<b>ve passed</b> my driving test! — Great! When <b>did</b> you <b>take</b> it? — I <b>took</b> it on Monday.</i></p>`, q:[
["t","I ___ (see) this film last week.",["saw"],"Last week → Past Simple."],
["t","___ you ___ (finish) the report yet?",["have finished","have / finished"],"Yet → Present Perfect."],
["t","When ___ you ___ (start) learning English?",["did start","did / start"],"When → Past Simple."],
["h","Найдите ошибку: «I have met him two years ago.»",["met","i met him two years ago"],"Ago → Past Simple."],
["h","Найдите ошибку: «Did you ever be to London?»",["have you ever been","have you ever been to london"],"Опыт без времени → Have you ever been."]]},
{h:"Тема недели: опыт и работа", th:`<p>Present Perfect — главное время для рассказа о <b>профессиональном опыте</b> (резюме, собеседование, IELTS Part 1 «Work»).</p>
<ul><li><i>I'<b>ve worked</b> as a waitress <b>and</b> a tutor.</i></li><li><i>So far I'<b>ve completed</b> two internships.</i> (so far = на данный момент)</li><li><i>I'<b>ve gained</b> a lot of experience in customer service.</i></li><li><i>Recently I'<b>ve taken on</b> more responsibility.</i></li></ul>
<p><b>Полезные слова:</b> gain experience — получить опыт; apply for a job — подать заявку; get promoted — получить повышение; take on responsibility — взять ответственность; be in charge of — отвечать за.</p>
<p><b>Схема ответа:</b> опыт (Perfect) → конкретный случай (Past Simple) → вывод (Present): <i>I've done several part-time jobs. Last summer I worked in a café. It taught me to stay calm under pressure.</i></p>`, q:[
["t","So far I ___ (apply) for three jobs.",["have applied","'ve applied"],"So far → Present Perfect."],
["t","Получить опыт: ___ experience.",["gain","get"],"gain experience — устойчивое сочетание."],
["h","Найдите ошибку: «I work in this company since 2022.»",["have worked","i have worked in this company since 2022","i've worked"],"Since → Present Perfect."],
["h","Найдите ошибку: «Last year I have got promoted.»",["got","last year i got promoted"],"Last year → Past Simple."],
["h","Перефразируйте: «This is my first time abroad.» → I have ___ abroad before.",["never been","never travelled","never traveled"],"First time → never… before."]]},
{h:"Неделя целиком: рассказ об опыте", th:`<p>Сегодня собираем всё вместе. В хорошем ответе о жизненном опыте <b>три времени работают вместе</b>:</p>
<ol><li><b>Present Perfect</b> — общий опыт: <i>I've travelled a lot.</i></li><li><b>Past Simple</b> — конкретная история: <i>Two years ago I went to Georgia.</i></li><li><b>Present Simple</b> — вывод сейчас: <i>Now I always travel light.</i></li></ol>
<p><b>Проверка себя:</b> есть ли в предложении точное время? Оно уже закончилось? Если да — Past Simple. Если нет и важен результат — Perfect.</p>
<p><b>Задание на неделю:</b> «Что я уже делала в жизни» — 6–8 предложений, минимум 3 Present Perfect с ever / never / already / so far и 2 предложения Past Simple с деталями.</p>`, q:[
["m","Which is correct?",["I've never done it before, but I tried yesterday.","I've never done it before, but I've tried yesterday.","I never have done it before."],0,"Yesterday → tried."],
["h","Три формы через пробел: «I ___ (be) to Georgia twice. The first time I ___ (go) in 2019 and I ___ (love) it.»",["have been went loved","'ve been went loved"],"Опыт → Perfect; 2019 → Past."],
["h","Найдите ошибку: «I have finished it yet.»",["already","i have already finished it","i've already finished it"],"Утверждение → already."],
["h","Найдите ошибку: «She has gone to Rome last summer.»",["went","she went to rome last summer"],"Last summer → went."],
["h","Перефразируйте: «I started learning English five years ago.» → I have ___ English for five years.",["been learning","learned","learnt"],"For + Present Perfect."]]}
];

{h:"for и since", th:`<p>Present Perfect описывает ситуацию, которая <b>началась в прошлом и длится до сих пор</b>. Длительность показываем словами <b>for</b> и <b>since</b>.</p>
<table><tr><th>for + период</th><th>since + точка начала</th></tr><tr><td>for three years, for a week, for ages, for a long time</td><td>since 2020, since Monday, since I was a child, since last summer</td></tr></table>
<ul><li><i>I'<b>ve lived</b> here <b>for</b> ten years.</i></li><li><i>She'<b>s known</b> him <b>since</b> school.</i></li><li>Вопрос: <i><b>How long have</b> you <b>lived</b> here?</i></li></ul>
<p><b>Главная ошибка русскоговорящих:</b> «Я живу здесь 10 лет» — по-русски настоящее, по-английски <b>не</b> <s>I live here for 10 years</s>, а <i>I've lived here for 10 years</i>.</p>`, q:[
["m","I've known her ___ 2015.",["for","since","from"],1,"Точка начала → since."],
["m","We've lived here ___ six months.",["for","since","during"],0,"Период → for."],
["m","She has worked here ___ she finished university.",["for","since","ago"],1,"Since + предложение-точка."],
["m","«Я живу в Москве три года» =",["I live in Moscow for three years.","I've lived in Moscow for three years.","I lived in Moscow since three years."],1,"Длится до сих пор → Present Perfect + for."],
["m","How long ___ you had this car?",["do","did","have"],2,"How long → have you had."]]},
{h:"Past Simple и Present Perfect: закончилось или нет", th:`<p>Сравните пары — разница в том, <b>продолжается ли ситуация</b>.</p>
<table><tr><th>Ещё длится</th><th>Закончилось</th></tr><tr><td><i>I'<b>ve lived</b> in Kazan for 5 years.</i> (живу до сих пор)</td><td><i>I <b>lived</b> in Kazan for 5 years.</i> (уже не живу)</td></tr><tr><td><i>He'<b>s been</b> ill since Monday.</i></td><td><i>He <b>was</b> ill last week.</i></td></tr></table>
<p><b>Незаконченный период:</b> today, this week, this year → Perfect, если период ещё идёт: <i>I'<b>ve drunk</b> three coffees today.</i> Но <i>I <b>drank</b> three coffees this morning</i>, если утро уже прошло.</p>
<p><b>Ago</b> — только Past Simple: <i>I moved here <b>three years ago</b>.</i> Сравните: <i>I've lived here <b>for</b> three years.</i></p>`, q:[
["m","My grandfather ___ in the army for 25 years. (он умер)",["has served","served","serves"],1,"Закончилось → Past Simple."],
["m","I ___ three cups of tea today. (день ещё идёт)",["drank","have drunk","drink"],1,"Незаконченный период."],
["t","I moved here five years ___.",["ago"],"Moved + ago."],

{h:"Лексика: дом и город", th:`<p>Для описания города в IELTS важно уйти от <i>big, nice, good</i>.</p>
<table><tr><th>Вместо…</th><th>скажите</th></tr><tr><td>big city</td><td>a <b>bustling</b> / <b>densely populated</b> city</td></tr><tr><td>nice place</td><td>a <b>picturesque</b> town, a <b>vibrant</b> neighbourhood</td></tr><tr><td>old buildings</td><td><b>historic</b> architecture, <b>listed</b> buildings</td></tr><tr><td>many cars</td><td><b>heavy traffic</b>, <b>congestion</b>, <b>rush hour</b></td></tr><tr><td>a quiet area</td><td>a <b>residential</b> area, the <b>suburbs</b>, the <b>outskirts</b></td></tr></table>
<p><b>Устойчивые сочетания:</b> public transport, green spaces, the cost of living, a sense of community, local amenities (магазины, школы и т.п. рядом).</p>
<p><b>Present Perfect для изменений:</b> <i>My city <b>has changed</b> a lot. They'<b>ve built</b> a new metro line.</i></p>`, q:[
["m","Пробки:",["heavy traffic","strong traffic","big traffic"],0,"Heavy traffic — коллокация."],
["m","Окраина города:",["the outskirts","the outside","the edges"],0,"On the outskirts of the city."],
["t","Стоимость жизни: the cost of ___.",["living"],"The cost of living."],
["t","Жилой район: a ___ area.",["residential"],"Residential area."],
