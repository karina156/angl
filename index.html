{h:"Present Perfect Simple: сколько сделано", th:`<p>Когда говорим <b>сколько</b> или <b>сколько раз</b> — используем Present Perfect Simple:</p>
<ul><li><i>I'<b>ve read</b> 50 pages.</i></li><li><i>She'<b>s visited</b> Rome <b>three times</b>.</i></li><li><i>How many countries <b>have</b> you <b>been</b> to?</i></li></ul>
<p><b>Так много / впервые:</b> <i>It's <b>the first time</b> I'<b>ve been</b> here.</i> — после <b>It's the first / second time</b> всегда Present Perfect (по-русски «я здесь впервые»).</p>
<p><b>Has/have got</b> в британском английском = have (владение): <i>I'<b>ve got</b> a flat in the centre.</i> Это не Present Perfect по смыслу, а просто «у меня есть».</p>`, q:[
["t","It's the first time I ___ (eat) Thai food.",["have eaten","'ve eaten"],"It's the first time + Perfect."],
["t","How many books ___ you ___ (read) this year?",["have read","have / read"],"This year (идёт) + how many."],
["t","She ___ (call) me five times today!",["has called","'s called"],"Сколько раз + today."],
["h","Найдите ошибку: «It's the first time I visit this city.»",["have visited","it's the first time i have visited this city","i've visited"],"It's the first time + Present Perfect."],
["h","Найдите ошибку: «I've been to London in 2018.»",["went","i went to london in 2018","i was in london in 2018"],"In 2018 → Past Simple."]]},
{h:"Описание города: структура", th:`<p><b>Описание своего города (100 слов)</b> — опора для Writing и Speaking Part 2 «Describe a place».</p>
<ol><li><b>Где и что:</b> <i>I come from Kazan, a vibrant city on the Volga.</i></li><li><b>Как давно / как изменился</b> (Perfect): <i>I've lived there all my life, and it has changed dramatically.</i></li><li><b>Что есть</b>: <i>There are plenty of green spaces and the public transport is reliable.</i></li><li><b>Минусы</b>: <i>However, the traffic can be heavy during rush hour.</i></li><li><b>Вывод</b>: <i>Overall, it's a great place to grow up.</i></li></ol>
<p><b>Связки:</b> what's more, however, although, overall. <b>There is / there are</b>: <i>There <b>is</b> a lot of traffic</i> (неисчисляемое) · <i>There <b>are</b> many parks.</i></p>`, q:[
["t","There ___ many parks in my city. (is / are)",["are"],"Parks — мн. число."],
["t","There ___ a lot of traffic. (is / are)",["is"],"Traffic — неисчисляемое."],
["h","Найдите ошибку: «I live in Kazan all my life.»",["have lived","i have lived in kazan all my life","i've lived"],"До сих пор → Perfect."],
["h","Найдите ошибку: «My city changed a lot since I was a child.»",["has changed","my city has changed a lot since i was a child"],"Since → has changed."],
["h","Найдите ошибку: «There is many cafés in the centre.»",["are","there are many cafés in the centre","there are many cafes in the centre"],"Cafés — мн. → are."]]},
{h:"Неделя целиком: время и место", th:`<p>Повторяем всю неделю на одной схеме:</p>
<table><tr><th>Вопрос себе</th><th>Время</th><th>Слова</th></tr><tr><td>Длится до сих пор?</td><td>Perfect</td><td>for, since, how long, all my life</td></tr><tr><td>Закончилось и есть время?</td><td>Past Simple</td><td>ago, last, in 2019, when</td></tr><tr><td>Сколько раз / сколько сделано к сейчас?</td><td>Perfect</td><td>times, so far, today, this year</td></tr></table>
<p><b>Продвинутый приём:</b> <i>It's been ten years <b>since</b> I moved here.</i> = <i>I moved here ten years ago.</i> = <i>I've lived here for ten years.</i> Такие перефразы — частый формат в Reading (True/False) и полезны в Writing для разнообразия.</p>`, q:[
["m","Which is correct?",["It's been two years since I've seen her.","It's two years since I saw her.","It's two years ago I saw her."],1,"It's (been) + since + Past Simple."],
["h","Перефразируйте: «I last saw him in May.» → I haven't seen him ___ May.",["since"],"Since + точка."],
["h","Перефразируйте: «I bought this phone three years ago.» → I have had this phone ___ three years.",["for"],"Период → for."],
["h","Найдите ошибку: «How long do you know her?»",["have you known","how long have you known her"],"How long + Present Perfect."],
["h","Две формы через пробел: «I ___ (live) in Samara for ten years, but in 2021 I ___ (move) here.»",["lived moved"],"Закончилось → lived; 2021 → moved."]]}
];
DAYX[7] = [
{h:"will: решения, обещания, прогнозы", th:`<p><b>will + начальная форма</b> — для будущего, которое решается или предполагается <b>в момент речи</b>.</p>
<table><tr><th>Функция</th><th>Пример</th></tr><tr><td>Спонтанное решение</td><td><i>The phone's ringing. — I'<b>ll get</b> it!</i></td></tr><tr><td>Обещание</td><td><i>I <b>won't tell</b> anyone, I promise.</i></td></tr><tr><td>Предложение помощи</td><td><i>I'<b>ll help</b> you with your bags.</i></td></tr><tr><td>Прогноз-мнение</td><td><i>I think it <b>will rain</b>. Robots <b>will replace</b> many jobs.</i></td></tr></table>
<p><b>Отрицание:</b> will not = <b>won't</b>. После <b>I think / I'm sure / probably</b> обычно will: <i>She'll <b>probably</b> be late.</i> (probably после will, но перед won't: <i>She <b>probably won't</b> come.</i>)</p>`, q:[
["m","It's cold. — I ___ close the window.",["will","am going to","close"],0,"Решение сейчас → will."],
["m","I promise I ___ be late.",["don't","won't","am not"],1,"Обещание → won't."],
["m","I think computers ___ smarter than people.",["are becoming","will become","become"],1,"Прогноз-мнение → will."],
["m","She ___ come. (вероятно, не придёт)",["won't probably","probably won't","will not probably"],1,"Probably перед won't."],
["m","«Я помогу тебе» (предложение) =",["I help you.","I'll help you.","I'm helping you."],1,"Offer → will."]]},
{h:"going to: планы и очевидные прогнозы", th:`<p><b>am / is / are going to + глагол</b> — то, что <b>уже решено</b> заранее, или прогноз по <b>видимым признакам</b>.</p>
<ul><li>План: <i>I'<b>m going to study</b> medicine next year.</i> (решила раньше)</li><li>Признаки: <i>Look at those clouds — it'<b>s going to rain</b>.</i></li></ul>
<table><tr><th>will</th><th>going to</th></tr><tr><td><i>I'll call him.</i> — только что решила</td><td><i>I'm going to call him.</i> — уже собиралась</td></tr><tr><td><i>I think it'll rain.</i> — мнение</td><td><i>It's going to rain.</i> — вижу тучи</td></tr></table>
<p><b>Going to go</b> часто сокращают до <i>going to</i>: <i>I'm going (to go) to the gym.</i> В разговоре — <i>gonna</i>, но в Writing <b>никогда</b>.</p>`, q:[
["m","Look! That glass ___ fall!",["will","is going to","falls"],1,"Видимый признак → going to."],
["m","We've decided: we ___ buy a new flat.",["will","are going to","buy"],1,"Решено заранее → going to."],
["t","She ___ (going to / start) a new job in May.",["is going to start","'s going to start"],"План."],
["t","Вопрос: ___ you going to apply for the course?",["are"],"Are you going to…?"],
["t","I ___ (not / going to / watch) TV tonight.",["am not going to watch","'m not going to watch"],"Отрицание."]]},
{h:"Present Continuous и Present Simple для будущего", th:`<p><b>Present Continuous</b> — для <b>договорённостей</b> с конкретным временем и людьми (уже в календаре):</p>
<ul><li><i>I'<b>m meeting</b> Anna at 6 tonight.</i></li><li><i>We'<b>re flying</b> to Sochi on Friday.</i> (билеты куплены)</li></ul>
<p><b>Present Simple</b> — для <b>расписаний</b>: поезда, уроки, фильмы, официальные события.</p>
<ul><li><i>The train <b>leaves</b> at 8.15.</i></li><li><i>The exam <b>starts</b> at 9 tomorrow.</i></li></ul>
<table><tr><th>Время</th><th>Когда</th></tr><tr><td>will</td><td>решение сейчас, обещание, мнение</td></tr><tr><td>going to</td><td>намерение, видимый признак</td></tr><tr><td>Present Continuous</td><td>договорённость</td></tr><tr><td>Present Simple</td><td>расписание</td></tr></table>`, q:[
["t","I ___ (see) the dentist at 4 tomorrow. (записалась)",["am seeing","'m seeing"],"Договорённость → Continuous."],
["t","The film ___ (start) at 7.30.",["starts"],"Расписание → Present Simple."],
["t","What ___ you ___ (do) this weekend? (договорённости)",["are doing","are / doing"],"What are you doing…?"],
["t","Our flight ___ (leave) at 6 am.",["leaves"],"Расписание."],
["h","Найдите ошибку: «I will meet my friend at 5 — we arranged it yesterday.»",["am meeting","i'm meeting my friend at 5","i am meeting"],"Договорённость → am meeting."]]},
{h:"Будущее в придаточных: when, if, as soon as", th:`<p>После <b>when, if, as soon as, before, after, until, unless</b> о будущем говорим в <b>Present Simple</b>, а не will.</p>
<ul><li><i>I'll call you <b>when</b> I <b>arrive</b>.</i> (не <s>when I will arrive</s>)</li><li><i><b>If</b> it <b>rains</b>, we'll stay at home.</i></li><li><i>Wait here <b>until</b> I <b>come</b> back.</i></li><li><i><b>As soon as</b> I <b>get</b> the results, I'll let you know.</i></li></ul>
<p>Для результата к моменту — Present Perfect: <i>I'll go out <b>when</b> I'<b>ve finished</b> my essay.</i></p>
<p><b>Это одна из самых частых ошибок</b> в IELTS Writing на уровне B1. Проверяйте каждое when/if в своих текстах.</p>`, q:[
["t","I'll text you when I ___ (get) home.",["get"],"When + Present Simple."],
["t","If she ___ (pass) the exam, she'll go to university.",["passes"],"If + Present Simple."],
["t","We won't start until everyone ___ (arrive).",["arrives","has arrived"],"Until + Present."],
["h","Найдите ошибку: «As soon as I will finish, I'll call you.»",["finish","as soon as i finish","as soon as i've finished"],"As soon as + Present."],
["h","Найдите ошибку: «If it will rain tomorrow, we'll cancel the trip.»",["rains","if it rains tomorrow"],"If + Present Simple."]]},
{h:"Тема недели: планы и учёба", th:`<p><b>Лексика для учёбы и планов</b> (IELTS Part 1 «Study», Part 2 «Describe a plan»):</p>
<table><tr><th>Выражение</th><th>Перевод</th></tr><tr><td>enrol on a course</td><td>записаться на курс</td></tr><tr><td>do a degree in</td><td>учиться по специальности</td></tr><tr><td>take / sit an exam</td><td>сдавать экзамен</td></tr><tr><td>pass / fail an exam</td><td>сдать / провалить</td></tr><tr><td>meet a deadline</td><td>уложиться в срок</td></tr><tr><td>be planning to / intend to / hope to</td><td>планирую / намерена / надеюсь</td></tr></table>
<p><b>Как звучать естественнее:</b> вместо бесконечного <i>I will</i> чередуйте: <i>I'm planning to…, I'm hoping to…, I intend to…, I'd like to…, My goal is to…</i></p>
<p><b>Внимание:</b> «сдавать» ≠ <i>pass</i>. <i>I'm <b>taking</b> IELTS in July</i> — буду сдавать; <i>I hope to <b>pass</b></i> — надеюсь сдать успешно.</p>`, q:[
["m","«Я сдаю IELTS в июле» (процесс, не результат):",["I'm passing IELTS in July.","I'm taking IELTS in July.","I'm giving IELTS in July."],1,"Take an exam = сдавать."],
["t","Записаться на курс: enrol ___ a course.",["on","in"],"Enrol on (BrE) / in (AmE)."],
["t","Уложиться в срок: meet a ___.",["deadline"],"Meet a deadline."],
["h","Найдите ошибку: «I'm going to pass IELTS next summer, I hope I'll get 7.5.» (речь о сдаче)",["take","i'm going to take ielts next summer"],"Сдавать = take."],
["h","Найдите ошибку: «I am planning study abroad.»",["planning to study","i am planning to study abroad","i'm planning to study abroad"],"Plan + to."]]},
{h:"Неделя целиком: мои планы на год", th:`<p>Собираем все формы будущего в одном рассказе. Хороший ответ <b>не использует одно и то же время подряд</b>:</p>
<p><i>This year is going to be busy. <b>I'm taking</b> IELTS in July — <b>I've already booked</b> the date. <b>I'm going to</b> study every day, and <b>if I pass</b>, <b>I'll apply</b> to universities in Europe. My first course <b>starts</b> in September. <b>I'm hoping to</b> get a scholarship, but <b>we'll see</b>.</i></p>
<p>Найдите в тексте: договорённость, расписание, намерение, условие, мнение. Это и есть широкий грамматический диапазон (Grammatical Range) для Band 6.5+.</p>
<p><b>Задание:</b> «Мои планы на год» — 8–10 предложений, минимум 4 разные формы будущего и одно придаточное с when/if.</p>`, q:[
["m","Which sentence is correct?",["When I will finish school, I'm going to travel.","When I finish school, I'm going to travel.","When I am finishing school, I travel."],1,"When + Present."],
["h","Три формы через пробел: «My course ___ (start) on 1 Sept. I ___ (meet) my tutor on Monday — it's arranged. I think it ___ (be) hard.»",["starts am meeting will be","starts 'm meeting will be"],"Расписание, договорённость, мнение."],
["h","Найдите ошибку: «Look at the sky! It will rain.»",["is going to rain","it's going to rain","it is going to rain"],"Видимый признак → going to."],
["h","Найдите ошибку: «Don't worry, I'm going to help you!» (решение прямо сейчас)",["will help","i'll help you","i will help you"],"Спонтанное → will."],
["h","Перефразируйте: «My plan is to study law.» → I ___ to study law.",["am going","'m going","intend","plan","am planning","'m planning"],"Намерение."]]}
];

{h:"Сравнительная степень: -er и more", th:`<p><b>Сравнительная степень</b> сравнивает два предмета: прилагательное + <b>than</b>.</p>
<table><tr><th>Тип</th><th>Правило</th><th>Пример</th></tr><tr><td>1 слог</td><td>+ -er</td><td>cheap → cheap<b>er</b>, tall → tall<b>er</b></td></tr><tr><td>оканч. на -e</td><td>+ -r</td><td>large → large<b>r</b></td></tr><tr><td>согл.+гласн.+согл.</td><td>удвоение</td><td>big → bi<b>gg</b>er, hot → ho<b>tt</b>er</td></tr><tr><td>2 слога на -y</td><td>y → -ier</td><td>busy → bus<b>ier</b>, easy → eas<b>ier</b></td></tr><tr><td>2+ слога</td><td>more + прил.</td><td><b>more</b> expensive, <b>more</b> modern</td></tr></table>
<p><b>Исключения:</b> good → <b>better</b>, bad → <b>worse</b>, far → <b>further / farther</b>, many/much → <b>more</b>, little → <b>less</b>.</p>
<ul><li><i>Moscow is <b>bigger than</b> Kazan.</i></li><li><i>Online shopping is <b>more convenient than</b> going to the shops.</i></li></ul>`, q:[
["m","This bag is ___ than that one.",["cheaper","more cheap","cheapper"],0,"1 слог → -er."],
["m","Сравнительная степень от big:",["biger","bigger","more big"],1,"Удвоение согласной."],
["m","Today is ___ than yesterday.",["busyer","busier","more busy"],1,"y → -ier."],
["m","This phone is ___ than mine.",["expensiver","more expensive","most expensive"],1,"Длинное → more."],
["m","Сравнительная степень от bad:",["badder","more bad","worse"],2,"bad – worse – worst."]]},
{h:"Превосходная степень", th:`<p><b>Превосходная степень</b> — самый из группы: <b>the</b> + -est / <b>the most</b>.</p>
<table><tr><th>Прил.</th><th>Сравн.</th><th>Превосх.</th></tr><tr><td>cheap</td><td>cheaper</td><td><b>the cheapest</b></td></tr><tr><td>happy</td><td>happier</td><td><b>the happiest</b></td></tr><tr><td>beautiful</td><td>more beautiful</td><td><b>the most beautiful</b></td></tr><tr><td>good</td><td>better</td><td><b>the best</b></td></tr><tr><td>bad</td><td>worse</td><td><b>the worst</b></td></tr></table>
<p><b>Предлоги после превосходной:</b> <i>the tallest building <b>in</b> the world</i> (место), <i>the best student <b>in</b> the class</i>, но <i>the best day <b>of</b> my life</i> (период, группа).</p>
<p><b>С Present Perfect:</b> <i>It's <b>the best</b> film I'<b>ve ever seen</b>.</i></p>
<p><b>Противоположность:</b> <i>less / the least</i>: <i>the <b>least</b> expensive option</i> — самый недорогой.</p>`, q:[
["m","It's ___ restaurant in town.",["the best","the better","best"],0,"Превосх. с the."],
["m","She's the tallest girl ___ her class.",["of","in","from"],1,"Место / группа-место → in."],
["t","Превосходная степень от happy: the ___.",["happiest"],"y → -iest."],
["t","It was the ___ (bad) day of my life.",["worst"],"bad – worse – worst."],
["t","This is the ___ (interesting) book I've ever read.",["most interesting"],"Длинное → the most."]]},
{h:"as … as и усиление сравнения", th:`<p><b>as + прилагательное + as</b> — одинаково; <b>not as … as</b> — менее, чем.</p>
<ul><li><i>My flat is <b>as big as</b> yours.</i> — такая же</li><li><i>The bus is<b>n't as fast as</b> the metro.</i> = The metro is faster.</li></ul>
<p><b>Усилители перед сравнительной степенью:</b></p>
<table><tr><th>Сильная разница</th><th>Небольшая разница</th></tr><tr><td><b>much / far / a lot</b> cheaper</td><td><b>slightly / a bit / a little</b> cheaper</td></tr><tr><td><b>significantly</b> higher (для Task 1)</td><td><b>marginally</b> higher</td></tr></table>
<p><b>Ошибка:</b> <s>very cheaper</s> → <i>much cheaper</i>. Very работает только с обычным прилагательным.</p>
<p><b>The … the …:</b> <i><b>The more</b> you practise, <b>the better</b> you get.</i></p>`, q:[
["m","The bus is not ___ fast as the train.",["so","as","than"],1,"Not as … as."],
["m","This one is ___ cheaper.",["very","much","more"],1,"Much + сравн."],
["t","Моя комната такая же большая, как твоя. My room is ___ big ___ yours.",["as as","as / as"],"As … as."],
["t","The more you read, ___ better you write.",["the"],"The more…, the better…"],
["t","Перефразируйте: «Tea is cheaper than coffee.» → Coffee isn't as ___ as tea.",["cheap"],"Not as cheap as."]]},
{h:"Лексика: покупки и деньги", th:`<p><b>Лексика для покупок и денег</b> (IELTS Part 1 «Shopping», Part 3 «Consumerism»):</p>
<table><tr><th>Выражение</th><th>Значение</th></tr><tr><td>a bargain</td><td>выгодная покупка</td></tr><tr><td>value for money</td><td>соотношение цены и качества</td></tr><tr><td>on sale / in the sales</td><td>со скидкой / на распродаже</td></tr><tr><td>afford</td><td>позволить себе (can't afford it)</td></tr><tr><td>impulse buying</td><td>спонтанные покупки</td></tr><tr><td>save up for</td><td>копить на</td></tr><tr><td>be on a tight budget</td><td>жить при ограниченном бюджете</td></tr><tr><td>overpriced</td><td>слишком дорогой</td></tr></table>
<p><b>Глаголы с деньгами:</b> <b>spend</b> money <b>on</b> something; <b>pay for</b> something; <b>lend</b> (дать в долг) vs <b>borrow</b> (взять в долг); <b>cost</b> — It <b>cost</b> me £20.</p>`, q:[
["t","I spend too much money ___ clothes.",["on"],"Spend on."],
["t","Can you ___ me £10? (дать в долг)",["lend"],"Lend — дать."],
["t","I can't ___ a new car. (позволить себе)",["afford"],"Afford."],
["h","Найдите ошибку: «Can I lend your pen?» (взять)",["borrow","can i borrow your pen"],"Взять → borrow."],
["h","Найдите ошибку: «I paid this jacket £50.»",["paid for","i paid £50 for this jacket","i paid 50 for this jacket"],"Pay for something."]]},
{h:"Сравнение двух городов: структура", th:`<p>Сравнение — частая тема Writing и Speaking Part 3. Структура абзаца:</p>
<ol><li><b>Общее:</b> <i>Both cities are popular with tourists.</i></li><li><b>Различия:</b> <i>Moscow is <b>far bigger than</b> Kazan, <b>whereas</b> Kazan is <b>much more relaxed</b>.</i></li><li><b>Деньги / жизнь:</b> <i>The cost of living is <b>significantly higher</b> in Moscow.</i></li><li><b>Вывод:</b> <i>Overall, Kazan is <b>the better option</b> for families.</i></li></ol>
<p><b>Связки сравнения:</b> whereas, while, on the other hand, in contrast, similarly, both… and…, neither… nor…</p>
<p><b>Сравнение двух</b> — <i>the better of the two</i>, а не <s>the best</s>.</p>`, q:[
["t","Moscow is huge, ___ Kazan is quite compact. (тогда как)",["whereas","while"],"Whereas / while."],
["t","___ cities have good public transport. (обе)",["both"],"Both."],
["h","Найдите ошибку: «The life in Moscow is more expensive than in Kazan.»",["life","life in moscow is more expensive than in kazan"],"Life в общем — без the."],
["h","Найдите ошибку: «Kazan is more cheaper than Moscow.»",["cheaper","kazan is cheaper than moscow"],"Не more + -er."],
["h","Найдите ошибку: «It's the most cheap option.»",["cheapest","the cheapest option","it's the cheapest option"],"Cheap → the cheapest."]]},
{h:"Неделя целиком: сравнение в IELTS", th:`<p><b>Сравнение в Writing Task 1</b> — главный навык. Вместо простого -er используйте:</p>
<ul><li><i>Sales in May were <b>twice as high as</b> in January.</i></li><li><i>The figure for Spain was <b>three times higher than</b> that for Italy.</i></li><li><i>Prices rose <b>slightly</b>, while wages remained <b>roughly the same</b>.</i></li><li><i><b>The highest</b> figure was recorded in 2010.</i></li></ul>
<p><b>Замена повторов:</b> <i>that of / those of</i>: <i>The population of Tokyo is larger than <b>that of</b> London.</i></p>
<p><b>Проверка:</b> than после -er и more; as … as для равенства; the + превосходная; усилители much/far/slightly.</p>`, q:[
["m","The population of China is larger than ___ of India.",["this","that","those"],1,"That of — замена population."],

{h:"can, could, be able to", th:`<p><b>can</b> — умение, возможность, разрешение в настоящем. После модальных — <b>начальная форма без to</b>, у he/she нет -s.</p>
<table><tr><th>Время</th><th>Форма</th><th>Пример</th></tr><tr><td>Настоящее</td><td>can / can't</td><td><i>She <b>can</b> swim.</i></td></tr><tr><td>Прошлое (общее умение)</td><td>could / couldn't</td><td><i>I <b>could</b> read at four.</i></td></tr><tr><td>Прошлое (смогла в конкретный раз)</td><td>was able to / managed to</td><td><i>The fire spread, but we <b>were able to</b> escape.</i></td></tr><tr><td>Будущее, Perfect</td><td>will be able to, have been able to</td><td><i>You'<b>ll be able to</b> speak fluently.</i></td></tr></table>
<p><b>Просьба:</b> <i>Can / Could you help me?</i> — could вежливее.</p>
<p><b>Ошибки:</b> <s>She cans</s>, <s>I can to swim</s>, <s>I will can</s>.</p>`, q:[
["m","She ___ speak three languages.",["cans","can","can to"],1,"Can без -s и to."],
["m","When I was five, I ___ ride a bike.",["can","could","will can"],1,"Прошлое умение → could."],
["m","Next year you ___ drive.",["will can","will be able to","can will"],1,"Будущее → will be able to."],
["m","Вежливая просьба:",["Could you open the window?","Can to you open the window?","You could open the window?"],0,"Could you…?"],
["m","The exam was hard, but I ___ finish it in time.",["could","was able to","can"],1,"Конкретный случай → was able to."]]},
{h:"must и have to", th:`<p>Обе формы — <b>обязанность</b>, но с разным оттенком.</p>
<table><tr><th>must</th><th>have to</th></tr><tr><td>Я сама считаю нужным / письменные правила</td><td>Внешние обстоятельства, правила других</td></tr><tr><td><i>I <b>must</b> call Mum.</i></td><td><i>I <b>have to</b> wear a uniform at work.</i></td></tr></table>
<p><b>Прошлое и будущее</b> — только have to: <i>I <b>had to</b> wait. You'<b>ll have to</b> wait.</i></p>
<p><b>Отрицания — разные значения!</b></p>
<ul><li><b>mustn't</b> = нельзя: <i>You <b>mustn't</b> smoke here.</i></li><li><b>don't have to</b> = не обязательно: <i>You <b>don't have to</b> come, it's optional.</i></li></ul>`, q:[
["m","You ___ use your phone during the exam. (запрещено)",["don't have to","mustn't","haven't to"],1,"Запрет → mustn't."],
["m","It's Saturday, so I ___ get up early. (не нужно)",["mustn't","don't have to","can't"],1,"Не обязательно → don't have to."],
["t","Yesterday I ___ (have to) work late.",["had to"],"Прошлое → had to."],
["t","He ___ (have to) wear a suit at work.",["has to"],"He → has to."],
["t","___ you have to show your passport? (вопрос)",["do"],"Do you have to…?"]]},
{h:"should, ought to, had better: советы", th:`<p><b>Советы</b> от мягкого к сильному:</p>
<table><tr><th>Форма</th><th>Сила</th><th>Пример</th></tr><tr><td>You could…</td><td>вариант</td><td><i>You <b>could</b> try yoga.</i></td></tr><tr><td>should / ought to</td><td>совет</td><td><i>You <b>should</b> see a doctor. You <b>ought to</b> rest.</i></td></tr><tr><td>had better ('d better)</td><td>иначе будут проблемы</td><td><i>You'<b>d better</b> leave now or you'll miss the train.</i></td></tr><tr><td>must</td><td>настоятельно</td><td><i>You <b>must</b> see this film!</i></td></tr></table>
<p><b>Формы:</b> shouldn't; ought to (с to!); had better <b>not</b> (не <s>hadn't better</s>).</p>
<p><b>Совет в письме:</b> <i>If I were you, I would…; Why don't you…?; It might be a good idea to…</i></p>`, q:[
["t","You look tired. You ___ go to bed. (совет)",["should","ought to"],"Should."],
["t","You ___ to drink more water. (ought)",["ought"],"Ought to."],
["t","You'd better ___ (not / be) late.",["not be"],"Had better not."],
["t","If I ___ you, I would talk to her.",["were"],"If I were you."],
["h","Найдите ошибку: «You should to exercise more.»",["should exercise","you should exercise more"],"Should без to."]]},
{h:"Лексика: здоровье и правила", th:`<p><b>Здоровье</b> — частая тема IELTS (Part 1, Task 2 «Health»).</p>
<table><tr><th>Выражение</th><th>Перевод</th></tr><tr><td>a balanced diet</td><td>сбалансированное питание</td></tr><tr><td>a sedentary lifestyle</td><td>малоподвижный образ жизни</td></tr><tr><td>take regular exercise / work out</td><td>регулярно заниматься</td></tr><tr><td>cut down on sugar</td><td>сократить сахар</td></tr><tr><td>give up smoking</td><td>бросить курить</td></tr><tr><td>catch a cold / have a sore throat</td><td>простудиться / болит горло</td></tr><tr><td>get enough sleep</td><td>высыпаться</td></tr><tr><td>be under stress</td><td>быть в стрессе</td></tr></table>
<p><b>Правила (rules):</b> it's compulsory / mandatory — обязательно; it's forbidden / prohibited — запрещено; you're allowed to / not allowed to; it's optional.</p>`, q:[
["t","Малоподвижный образ жизни: a ___ lifestyle.",["sedentary"],"Sedentary."],
["t","Сократить сахар: cut ___ on sugar.",["down"],"Cut down on."],
["t","Бросить курить: give ___ smoking.",["up"],"Give up + -ing."],
["h","Найдите ошибку: «You are not allowed smoke here.»",["allowed to smoke","you are not allowed to smoke here"],"Allowed to."],
["h","Найдите ошибку: «Doctors say we must to eat more vegetables.»",["must eat","we must eat more vegetables"],"Must без to."]]},
{h:"Письмо-совет другу: структура", th:`<p><b>Письмо другу с советом (120 слов)</b> — как General Training Task 1 и хорошая тренировка модальных.</p>
<ol><li><b>Приветствие и реакция:</b> <i>Dear Anna, I'm sorry to hear you've been feeling stressed.</i></li><li><b>Совет 1 + причина:</b> <i>First, you <b>should</b> try to get more sleep, because…</i></li><li><b>Совет 2:</b> <i><b>Why don't you</b> join a gym? You <b>could</b>…</i></li><li><b>Предупреждение:</b> <i>You'<b>d better not</b> drink too much coffee.</i></li><li><b>Конец:</b> <i>Let me know how it goes. Best wishes, Karina</i></li></ol>
<p><b>Разнообразие:</b> не повторяйте should 5 раз. Чередуйте: should, could, why don't you, it might help to, if I were you.</p>`, q:[
["t","Why don't you ___ (try) meditation?",["try"],"Why don't you + V."],
["t","It might help ___ (take) a short walk every day.",["to take"],"It might help to + V."],
["h","Найдите ошибку: «If I was you, I will see a doctor.»",["were would","if i were you, i would see a doctor","if i were you i would see a doctor"],"If I were you, I would…"],
["h","Найдите ошибку: «You hadn't better eat fast food.»",["had better not","you had better not eat fast food","you'd better not eat fast food"],"Had better not."],
["h","Найдите ошибку: «Why don't you to go to bed earlier?»",["go","why don't you go to bed earlier"],"Why don't you + V без to."]]},
{h:"Неделя целиком: модальность", th:`<p>Сводная таблица модальных недели:</p>
<table><tr><th>Значение</th><th>Настоящее</th><th>Прошлое</th></tr><tr><td>Умение</td><td>can</td><td>could / was able to</td></tr><tr><td>Обязанность</td><td>must / have to</td><td>had to</td></tr><tr><td>Нет необходимости</td><td>don't have to / needn't</td><td>didn't have to</td></tr><tr><td>Запрет</td><td>mustn't / can't</td><td>wasn't allowed to / couldn't</td></tr><tr><td>Совет</td><td>should / ought to</td><td>should have done (будет позже)</td></tr></table>
<p><b>Для Task 2:</b> модальные смягчают мнение: <i>Governments <b>should</b> invest… This <b>could</b> lead to… People <b>may</b> feel…</i> Это повышает оценку за Grammatical Range.</p>`, q:[
["m","Which means «не обязательно»?",["You mustn't come.","You don't have to come.","You can't come."],1,"Don't have to."],
["h","Перефразируйте: «It isn't necessary to bring food.» → You ___ bring food.",["don't have to","do not have to","needn't","don't need to"],"Нет необходимости."],
["h","Перефразируйте: «Smoking is prohibited here.» → You ___ smoke here.",["mustn't","must not","can't","cannot","are not allowed to","aren't allowed to"],"Запрет."],
["h","Найдите ошибку: «Last year I must work every weekend.»",["had to","last year i had to work every weekend"],"Прошлое → had to."],
["h","Найдите ошибку: «I will can help you tomorrow.»",["will be able to","i will be able to help you tomorrow","i'll be able to help you tomorrow"],"Will be able to."]]}
];

{h:"Исчисляемые и неисчисляемые", th:`<p><b>Исчисляемые</b> можно посчитать: a book — two books. <b>Неисчисляемые</b> нельзя: water, money, information.</p>
<p><b>Неисчисляемые, которые по-русски считаются</b> (главная ловушка!):</p>
<table><tr><td>advice</td><td>совет(ы) → <i>a piece of advice</i></td></tr><tr><td>information</td><td>информация</td></tr><tr><td>news</td><td>новость (<i>The news <b>is</b> good</i>)</td></tr><tr><td>furniture</td><td>мебель</td></tr><tr><td>luggage / baggage</td><td>багаж</td></tr><tr><td>research, knowledge, homework, equipment, progress, traffic, accommodation</td><td>всегда без -s и без a</td></tr></table>
<p><b>Как посчитать:</b> a piece of advice, a slice of bread, a bottle of water, a cup of tea, a kilo of rice, an item of news.</p>`, q:[
["m","Can you give me some ___?",["advices","advice","an advice"],1,"Advice — неисчисляемое."],
["m","The news ___ very good today.",["are","is","were"],1,"News — ед. число."],
["m","We bought some new ___.",["furniture","furnitures","a furniture"],0,"Furniture — неисчисляемое."],
["m","I need ___ information.",["an","some","many"],1,"Some information."],
["m","Один совет:",["an advice","a piece of advice","one advice"],1,"A piece of advice."]]},
{h:"much, many, a lot of, few, little", th:`<table><tr><th></th><th>Исчисляемые</th><th>Неисчисляемые</th></tr><tr><td>Много</td><td><b>many</b> books</td><td><b>much</b> time</td></tr><tr><td>Много (утверд.)</td><td colspan="2"><b>a lot of / lots of</b> books / time</td></tr><tr><td>Мало (плохо)</td><td><b>few</b> friends</td><td><b>little</b> money</td></tr><tr><td>Немного (хорошо)</td><td><b>a few</b> friends</td><td><b>a little</b> money</td></tr><tr><td>Сколько?</td><td><b>How many</b> people?</td><td><b>How much</b> water?</td></tr></table>
<p><b>Much</b> в утверждениях звучит книжно: <i>I have <b>a lot of</b> time</i> лучше, чем <i>I have much time</i>. В вопросах и отрицаниях — much / many.</p>
<p><b>Разница a few / few:</b> <i>I have <b>a few</b> friends here</i> (есть несколько, хорошо) vs <i>I have <b>few</b> friends here</i> (почти нет, грустно).</p>`, q:[
["m","How ___ money do you need?",["many","much","few"],1,"Money → much."],
["m","There were very ___ people at the party. (почти никого)",["few","a few","little"],0,"Почти нет, исч. → few."],
["t","How ___ (many / much) students are in your group?",["many"],"Students → many."],
["t","I have ___ free time today, so let's meet. (немного, хорошо)",["a little"],"A little."],
["t","There isn't ___ (many / much) traffic on Sundays.",["much"],"Traffic — неисч."]]},
{h:"Артикли a / an и the", th:`<p><b>a / an</b> — один из многих, впервые упоминаем. <b>the</b> — конкретный, понятно какой.</p>
<ul><li><i>I saw <b>a</b> cat. <b>The</b> cat was black.</i> — сначала a, затем the</li><li><i>Close <b>the</b> door, please.</i> — понятно какую</li><li><i><b>The</b> sun, <b>the</b> moon, <b>the</b> internet</i> — единственные</li><li><i>She's <b>a</b> doctor.</i> — профессия всегда с a</li></ul>
<p><b>an</b> — перед гласным <b>звуком</b>: an apple, <b>an hour</b> (h не читается), но <b>a university</b> (звук [ju]), a European country.</p>
<p><b>The с превосходной и порядковыми:</b> <i>the best, the first, the last, the same, the only</i>.</p>`, q:[
["t","I bought ___ new phone yesterday. (a / an / the)",["a"],"Впервые упоминаем."],
["t","She is ___ engineer.",["an"],"Профессия, гласный звук."],
["t","I'll be back in ___ hour.",["an"],"H не читается → an."],
["t","She studies at ___ university in Moscow.",["a"],"University [ju] → a."],
["t","___ moon is very bright tonight.",["the"],"Единственный."]]},
{h:"Нулевой артикль: обобщения", th:`<p><b>Без артикля</b>, когда говорим <b>в общем</b> о множественном или неисчисляемом:</p>
<ul><li><i><b>Dogs</b> are loyal.</i> (собаки вообще) vs <i><b>The dogs</b> next door are noisy.</i> (конкретные)</li><li><i><b>Life</b> is short. <b>Education</b> is important. <b>Money</b> doesn't buy happiness.</i></li></ul>
<p><b>Без артикля также:</b> языки (<i>English</i>), спорт (<i>play tennis</i>), приёмы пищи (<i>have breakfast</i>), go to <b>school / work / bed / university</b> (по назначению), at home, by bus.</p>
<p><b>Для Task 2 это критично:</b> <i><b>Technology</b> has changed <b>society</b></i>, а не <s>The technology has changed the society</s>. Но: <i><b>the</b> technology <b>of the 21st century</b></i> — уточнено.</p>`, q:[
["t","I love ___ music. (вообще; поставьте the или -)",["-","no","0","нет","без артикля"],"Вообще → без артикля."],
["t","___ education is the key to success. (the или -)",["-","no","0","нет","без артикля"],"Обобщение."],
["h","Найдите ошибку: «The life in big cities is stressful.»",["life","life in big cities is stressful"],"Обобщение → Life."],
["h","Найдите ошибку: «I usually have the breakfast at 8.»",["have breakfast","i usually have breakfast at 8"],"Приёмы пищи без артикля."],
["h","Найдите ошибку: «The technology has changed our lives.» (вообще)",["technology","technology has changed our lives"],"Обобщение → без the."]]},
{h:"Лексика: еда и природа", th:`<p><b>Еда</b> (IELTS Part 1 «Food», Part 2 «Describe a meal»):</p>
<table><tr><td>a home-cooked meal</td><td>домашняя еда</td></tr><tr><td>a takeaway</td><td>еда навынос</td></tr><tr><td>processed food / junk food</td><td>обработанная / вредная еда</td></tr><tr><td>organic / locally grown</td><td>органический / местный</td></tr><tr><td>a vegetarian / vegan diet</td><td>вегетарианское питание</td></tr><tr><td>have a sweet tooth</td><td>любить сладкое</td></tr></table>
<p><b>Природа:</b> the countryside (сельская местность), wildlife (дикая природа, неисч.), the environment, natural resources, scenery (пейзаж, неисч.!), a national park.</p>
<p><b>Ловушка:</b> <i>scenery, wildlife, rubbish</i> — неисчисляемые: <s>sceneries</s>, <s>wildlifes</s>.</p>`, q:[
["t","Я люблю сладкое: I have a sweet ___.",["tooth"],"Have a sweet tooth."],
["t","Еда навынос: a ___.",["takeaway","take-away"],"Takeaway."],
["h","Найдите ошибку: «The sceneries in the mountains were amazing.»",["scenery was","the scenery in the mountains was amazing"],"Scenery — неисч., was."],
["h","Найдите ошибку: «I live in the countryside, there are many wildlifes.»",["a lot of wildlife","there is a lot of wildlife"],"Wildlife — неисч."],
["h","Найдите ошибку: «I'd like a glass of a water.»",["a glass of water","i'd like a glass of water"],"Water — без a."]]},
{h:"Неделя целиком: артикли в тексте", th:`<p><b>Алгоритм выбора артикля</b> перед существительным:</p>
<ol><li><b>Исчисляемое ед. число?</b> → нужен артикль (a / an / the) или my, this и т.п. Голое <s>I have car</s> — ошибка.</li><li><b>Понятно, какой именно?</b> (уже упоминали, единственный, уточнён of…/that…) → <b>the</b>.</li><li><b>Говорим вообще</b> (мн. ч. или неисч.) → <b>без артикля</b>.</li></ol>
<p><b>Пример абзаца:</b> <i>I had <b>a</b> wonderful meal last week. <b>The</b> restaurant was in <b>the</b> centre of <b>the</b> city. I usually avoid <b>-</b> fast food, but <b>the</b> food there was <b>-</b> fresh and healthy. It was <b>the</b> best dinner I've had this year.</i></p>
<p><b>Задание недели:</b> «Любимое блюдо» — 8 предложений, проверить каждое существительное по алгоритму.</p>`, q:[
["m","Which is correct?",["I have car.","I have a car.","I have the car."],1,"Ед. число исч. → a."],
["h","Три артикля через пробел (a / an / the / -): «___ honest man found ___ wallet. ___ wallet had no money.»",["an a the"],"Honest [ɒ] → an; новое → a; известное → the."],
["h","Найдите ошибку: «She gave me a useful advice.»",["useful advice","some useful advice","a useful piece of advice"],"Advice без a."],
["h","Найдите ошибку: «How much people came?»",["how many people","many"],"People → many."],
["h","Найдите ошибку: «I've made a big progress this month.»",["big progress","great progress","a lot of progress","i've made great progress this month"],"Progress — неисч."]]}
];

{h:"Present Perfect Continuous: форма", th:`<p><b>Present Perfect Continuous</b> = <b>have / has been + -ing</b>. Действие началось в прошлом и <b>длится до сих пор</b> (или только что закончилось), важен <b>процесс</b>.</p>
<table><tr><td>+</td><td>I <b>have been working</b> · she <b>has been working</b></td></tr><tr><td>−</td><td>I <b>haven't been</b> working · she <b>hasn't been</b> working</td></tr><tr><td>?</td><td><b>Have</b> you <b>been</b> working? <b>How long has</b> she <b>been</b> working?</td></tr></table>
<ul><li><i>I'<b>ve been learning</b> English for three years.</i></li><li><i>It'<b>s been raining</b> since morning.</i></li><li><i>How long <b>have</b> you <b>been waiting</b>?</i></li></ul>
<p><b>Русское «я … уже N лет»</b> чаще всего = Present Perfect Continuous: «Я работаю здесь уже 2 года» → <i>I've been working here for two years.</i></p>`, q:[
["m","She ___ for two hours.",["has been studying","have been studying","is studying"],0,"She → has been + -ing."],
["m","How long ___ you been living here?",["are","have","did"],1,"How long have you been…"],
["m","It ___ since 6 am.",["is raining","has been raining","rains"],1,"Since + процесс до сих пор."],
["m","«Я жду тебя уже час» =",["I wait for you for an hour.","I've been waiting for you for an hour.","I'm waiting you an hour."],1,"До сих пор → PPC."],
["m","They ___ been working all day.",["has","have","are"],1,"They → have been."]]},
{h:"Видимый результат процесса", th:`<p>Present Perfect Continuous объясняет <b>видимый сейчас результат недавнего процесса</b>:</p>
<ul><li><i>Your eyes are red. <b>Have</b> you <b>been crying</b>?</i></li><li><i>I'm exhausted — I'<b>ve been running</b>.</i></li><li><i>The ground is wet. It'<b>s been raining</b>.</i></li></ul>
<p>Здесь не нужны for / since: важно, что процесс был недавно и оставил след.</p>
<p><b>Глаголы состояния</b> (know, like, believe, own, want, understand, belong) <b>не</b> используются в Continuous: <i>I'<b>ve known</b> her for years</i> (не <s>have been knowing</s>).</p>`, q:[
["m","You're out of breath. ___ you been running?",["Have","Are","Did"],0,"Видимый результат → Have you been…"],
["m","I ___ him since 2015.",["have been knowing","have known","know"],1,"Know — состояние."],
["t","Your hands are dirty. What ___ you ___ (do)?",["have been doing","have / been doing"],"Результат процесса."],
["t","I'm tired because I ___ (work) all day.",["have been working","'ve been working"],"Процесс → усталость."],
["t","She ___ (want) this job for ages. (состояние)",["has wanted","'s wanted"],"Want — состояние."]]},
{h:"Perfect Simple или Perfect Continuous", th:`<table><tr><th>Simple: результат, сколько</th><th>Continuous: процесс, как долго</th></tr><tr><td><i>I'<b>ve written</b> three emails.</i></td><td><i>I'<b>ve been writing</b> emails all morning.</i></td></tr><tr><td><i>She'<b>s painted</b> the room.</i> (готово)</td><td><i>She'<b>s been painting</b> the room.</i> (может, ещё нет)</td></tr><tr><td>how many, how much, количество</td><td>how long, all day, for, since</td></tr></table>
<p><b>Live, work, study</b> — разницы почти нет: <i>I've lived / I've been living here for 5 years.</i> Continuous подчёркивает временность.</p>
<p><b>Правило-подсказка:</b> есть число предметов → Simple; есть «весь день / как долго» → Continuous.</p>`, q:[
["t","I ___ (read) 100 pages today.",["have read","'ve read"],"Количество → Simple."],
["t","I ___ (read) this book all afternoon.",["have been reading","'ve been reading"],"Как долго → Continuous."],
["t","How many cups of coffee ___ you ___ (drink) today?",["have drunk","have / drunk"],"How many → Simple."],
["t","She ___ (learn) Spanish for six months.",["has been learning","'s been learning"],"For + процесс."],
["h","Найдите ошибку: «I've been writing four essays this week.»",["have written","i've written four essays this week"],"Количество → Simple."]]},
{h:"Лексика: работа и карьера", th:`<p><b>Работа</b> — первая тема IELTS Speaking Part 1 («Do you work or study?»).</p>
<table><tr><td>a nine-to-five job</td><td>офисная работа с 9 до 5</td></tr><tr><td>be self-employed / freelance</td><td>работать на себя</td></tr><tr><td>job satisfaction</td><td>удовлетворённость работой</td></tr><tr><td>career prospects</td><td>карьерные перспективы</td></tr><tr><td>a demanding / rewarding job</td><td>сложная / приносящая удовлетворение</td></tr><tr><td>work–life balance</td><td>баланс работы и жизни</td></tr><tr><td>be made redundant</td><td>попасть под сокращение</td></tr><tr><td>climb the career ladder</td><td>расти по карьере</td></tr></table>
<p><b>job vs work:</b> job — исчисляемое (<i>a job</i>), work — неисчисляемое (<s>a work</s>). <b>career</b> — вся профессиональная жизнь.</p>`, q:[
["t","Работа, которая приносит удовлетворение: a ___ job.",["rewarding"],"Rewarding."],
["t","Карьерные перспективы: career ___.",["prospects"],"Prospects."],
["t","She ___ (be) self-employed since 2021.",["has been"],"Since → Perfect (be — состояние)."],
["h","Найдите ошибку: «I'm looking for a work in IT.»",["a job","i'm looking for a job in it","work"],"Work неисч. → a job."],
["h","Найдите ошибку: «I work here since three years.»",["have been working for","i have been working here for three years","i've been working here for three years","have worked for"],"Perfect + for."]]},
{h:"Speaking Part 1: Work and study", th:`<p><b>Part 1</b> — 4–5 минут коротких вопросов о вас. Ответ: <b>2–3 предложения</b>, не одно слово и не монолог.</p>
<p><b>Формула ответа:</b> прямой ответ → деталь (с временем) → причина / пример.</p>
<ul><li><b>Q:</b> Do you work or are you a student?</li><li><b>A:</b> <i>I'm a student. <b>I've been studying</b> economics at Kazan University <b>for two years</b> now, and I really enjoy it because…</i></li><li><b>Q:</b> Why did you choose this subject?</li><li><b>A:</b> <i>Well, <b>I've always been interested</b> in how markets work, and my dad <b>works</b> in finance, so…</i></li></ul>
<p><b>Начала ответа:</b> Well…, Actually…, To be honest…, I'd say… Это даёт секунду подумать и звучит естественно.</p>`, q:[
["t","I ___ (study) economics for two years now.",["have been studying","'ve been studying","have studied","'ve studied"],"Длится до сих пор."],
["t","I ___ (always / be) interested in languages.",["have always been","'ve always been"],"Always + Perfect (состояние)."],
["h","Найдите ошибку: «I am studying here since 2023.»",["have been studying","i have been studying here since 2023","i've been studying here since 2023"],"Since → PPC."],
["h","Найдите ошибку: «I have been knowing my best friend for ten years.»",["have known","i have known my best friend for ten years","i've known my best friend for ten years"],"Know — состояние."],
["h","Перефразируйте: «I started working here in 2020 and I still work here.» → I ___ working here since 2020.",["have been","'ve been"],"PPC."]]},
{h:"Неделя целиком: все Perfect-формы настоящего", th:`<table><tr><th>Ситуация</th><th>Форма</th><th>Пример</th></tr><tr><td>Опыт, результат, сколько</td><td>have done</td><td><i>I've visited 10 countries.</i></td></tr><tr><td>Процесс до сих пор, как долго</td><td>have been doing</td><td><i>I've been travelling for a month.</i></td></tr><tr><td>Видимый след процесса</td><td>have been doing</td><td><i>You look tanned — have you been sunbathing?</i></td></tr><tr><td>Состояние до сих пор</td><td>have known / had / been</td><td><i>I've had this car for years.</i></td></tr></table>
<p><b>Для Part 1</b> хороший ответ почти всегда содержит Perfect Continuous с for / since — это сразу показывает экзаменатору диапазон времён.</p>`, q:[
["m","Which is correct?",["I've been owning this flat for 5 years.","I've owned this flat for 5 years.","I own this flat for 5 years."],1,"Own — состояние."],
["h","Две формы через пробел: «I ___ (work) on this project since May and I ___ (finish) half of it.»",["have been working have finished","'ve been working 've finished"],"Процесс + результат."],
["h","Найдите ошибку: «She has been visiting Paris three times.»",["has visited","she has visited paris three times"],"Сколько раз → Simple."],
["h","Найдите ошибку: «How long are you learning English?»",["have you been learning","how long have you been learning english"],"How long → PPC."],
["h","Перефразируйте: «It started raining two hours ago. It's still raining.» → It has been raining ___ two hours.",["for"],"For + период."]]}
];
DAYX[14] = [
{h:"Past Perfect: форма и смысл", th:`<p><b>Past Perfect</b> = <b>had + V3</b>. Это «прошлое в прошлом»: действие произошло <b>раньше другого</b> прошедшего момента.</p>
<table><tr><td>+</td><td>I / she / they <b>had left</b> (I'd left)</td></tr><tr><td>−</td><td><b>hadn't</b> left</td></tr><tr><td>?</td><td><b>Had</b> you left?</td></tr></table>
<p><i>When I arrived, the film <b>had</b> already <b>started</b>.</i> — сначала начался фильм, потом я пришла.</p>
<p>Сравните: <i>When I arrived, the film <b>started</b>.</i> — фильм начался, когда я пришла (одновременно / сразу после).</p>
<p><b>Шкала:</b> <span style="white-space:nowrap">had started ← arrived ← сейчас</span></p>`, q:[
["m","When we got there, the train ___.",["already left","had already left","has already left"],1,"Раньше другого прошлого → had left."],
["m","She ___ never seen snow before she moved to Moscow.",["has","had","was"],1,"Before + прошлое → had."],
["m","Форма Past Perfect от go:",["had went","had gone","has gone"],1,"Had + V3."],
["m","«When I came home, my brother had cooked dinner.» Что было раньше?",["я пришла","брат приготовил","одновременно"],1,"Had cooked — раньше."],
["m","I ___ the book before I saw the film.",["had read","have read","was reading"],0,"Раньше другого прошлого."]]},
{h:"Когда Past Perfect нужен, а когда нет", th:`<p>Past Perfect нужен, только если <b>порядок событий иначе неясен</b> или мы «отматываем» назад.</p>
<ul><li>По порядку — Past Simple: <i>I woke up, had breakfast and left.</i></li><li>Назад — Past Perfect: <i>I left at 8. I <b>had woken up</b> at 6 and <b>had had</b> breakfast.</i></li></ul>
<p><b>С after / before</b> порядок и так понятен, Past Perfect не обязателен: <i>After I <b>finished / had finished</b> work, I went home.</i></p>
<p><b>Слова-маркеры:</b> already, just, never… before, by the time, by 2020, until then.</p>
<p><i><b>By the time</b> the ambulance arrived, the man <b>had</b> already <b>died</b>.</i></p>`, q:[
["m","By the time I woke up, everyone ___ .",["left","had left","has left"],1,"By the time → had left."],
["t","I ___ (never / fly) before my trip to Spain.",["had never flown"],"Never… before."],
["t","She was upset because she ___ (lose) her keys.",["had lost"],"Причина раньше."],
["t","By 2010 they ___ (move) to Kazan.",["had moved"],"By + год."],
["t","___ you ever ___ (be) abroad before that trip?",["had been","had / been"],"Had you ever been…"]]},
{h:"Past Perfect Continuous", th:`<p><b>had been + -ing</b> — <b>длительный процесс</b> до момента в прошлом.</p>
<ul><li><i>I <b>had been waiting</b> for an hour when she finally called.</i></li><li><i>She was tired because she <b>had been working</b> all night.</i></li></ul>
<table><tr><th>had done</th><th>had been doing</th></tr><tr><td>результат к моменту</td><td>процесс, длительность до момента</td></tr><tr><td><i>He had written 3 chapters.</i></td><td><i>He had been writing for months.</i></td></tr></table>
<p>Это время частое в Part 2 («Describe a time when…»): помогает объяснить предысторию.</p>`, q:[
["t","I ___ (wait) for 40 minutes when the bus came.",["had been waiting"],"Длительность до момента."],
["t","His eyes were red because he ___ (cry).",["had been crying"],"Видимый след в прошлом."],
["t","They ___ (live) there for ten years before they moved.",["had been living","had lived"],"Длительность до момента."],
["t","She ___ (write) three reports by lunchtime.",["had written"],"Результат, количество."],
["h","Найдите ошибку: «I was tired because I have been working all day.»",["had been working","i was tired because i had been working all day"],"Прошлое → had been."]]},
{h:"Времена рассказа", th:`<p><b>Narrative tenses</b> — набор времён для истории:</p>
<table><tr><th>Время</th><th>Роль</th><th>Пример</th></tr><tr><td>Past Simple</td><td>основные события</td><td><i>I opened the door and saw…</i></td></tr><tr><td>Past Continuous</td><td>фон, обстановка</td><td><i>It was raining and people were hurrying home.</i></td></tr><tr><td>Past Perfect</td><td>предыстория</td><td><i>I had never been there before.</i></td></tr><tr><td>Past Perfect Cont.</td><td>длительная предыстория</td><td><i>I had been planning this trip for months.</i></td></tr></table>
<p><b>Связки истории:</b> at first, then, after that, suddenly, just as, eventually, in the end, by the time.</p>
<p><b>In the end vs at the end:</b> in the end = в итоге; at the end of = в конце чего-то.</p>`, q:[
["t","___ the end, we decided to stay at home. (в итоге)",["in"],"In the end."],
["t","___ the end of the film, everyone cried. (в конце)",["at"],"At the end of."],
["h","Три формы через пробел: «It ___ (snow) when I ___ (leave) the house. I ___ (forget) my gloves.»",["was snowing left had forgotten"],"Фон, событие, предыстория."],
["h","Найдите ошибку: «When I arrived, the party already finished.»",["had already finished","the party had already finished"],"Раньше → had finished."],
["h","Найдите ошибку: «At the end, we found a nice hotel.» (в итоге)",["in the end","in the end, we found a nice hotel"],"В итоге → in the end."]]},
{h:"Part 2: рассказать о событии", th:`<p><b>Speaking Part 2</b>: 1 минута на подготовку, 2 минуты рассказа по карточке.</p>
<p><b>Карточка:</b> <i>Describe a memorable event. You should say: what it was, when and where it happened, who was there, and explain why it was memorable.</i></p>
<ol><li><b>Вступление:</b> <i>I'd like to talk about my graduation, which took place two years ago.</i></li><li><b>Предыстория</b> (Past Perfect): <i>I'd been studying for four years and I'd been looking forward to it.</i></li><li><b>Событие</b> (Past Simple + Continuous): <i>While my parents were taking photos, my name was called…</i></li><li><b>Почему запомнилось:</b> <i>It was memorable because I'd never felt so proud.</i></li></ol>
<p><b>Совет:</b> за минуту подготовки пишите ключевые слова, а не предложения.</p>`, q:[
["t","I'd like to talk ___ my graduation.",["about"],"Talk about."],
["t","It was memorable because I ___ (never / feel) so proud before.",["had never felt"],"Never… before → Past Perfect."],
["h","Найдите ошибку: «While my parents took photos, my name was called.» (фон)",["were taking","while my parents were taking photos"],"Фон → Continuous."],
["h","Найдите ошибку: «I was looking forward to it since months.»",["had been looking forward to it for months","for months"],"Past Perfect Cont. + for."],
["h","Найдите ошибку: «It took place before two years.»",["two years ago","it took place two years ago"],"Назад → ago."]]},
{h:"Неделя целиком: история с предысторией", th:`<p>Собираем все времена рассказа. Пример:</p>
<p><i>Last summer I <b>went</b> to Baikal. I <b>had wanted</b> to go there since I was a child, and I <b>had been saving</b> for the trip for a year. On the first day, the sun <b>was shining</b> and tourists <b>were swimming</b>. Suddenly a storm <b>started</b>. By the time we <b>got</b> back, we <b>had been walking</b> in the rain for two hours. <b>In the end</b>, it <b>was</b> the best trip I'<b>ve ever had</b>.</i></p>
<p>Отметьте в тексте 4 разных прошедших времени и одно Present Perfect.</p>
<p><b>Задание недели:</b> Part 2 «Describe a memorable event» — запишите 2 минуты на диктофон.</p>`, q:[
["m","Which is correct?",["By the time we arrived, they ate.","By the time we arrived, they had eaten.","By the time we arrived, they have eaten."],1,"By the time → had eaten."],
["h","Перефразируйте: «I didn't go to Paris until 2020.» → I had never ___ to Paris before 2020.",["been"],"Had never been."],
["h","Найдите ошибку: «I had been knowing him for years before we became friends.»",["had known","i had known him for years"],"Know — состояние."],
["h","Найдите ошибку: «After she had went home, I called her.»",["had gone","after she had gone home","after she went home"],"Had + V3."],
["h","Две формы через пробел: «She ___ (be) nervous because she ___ (not / sleep) well the night before.»",["was hadn't slept","was had not slept"],"Состояние + предыстория."]]}
];

{h:"Пассив: форма в настоящем и прошлом", th:`<p><b>Пассив</b> (страдательный залог) = <b>be + V3</b>. Используем, когда важно <b>действие или объект</b>, а не кто делает.</p>
<table><tr><th>Время</th><th>Актив</th><th>Пассив</th></tr><tr><td>Present Simple</td><td>They make cars here.</td><td>Cars <b>are made</b> here.</td></tr><tr><td>Past Simple</td><td>Someone stole my bike.</td><td>My bike <b>was stolen</b>.</td></tr><tr><td>Present Continuous</td><td>They are building a bridge.</td><td>A bridge <b>is being built</b>.</td></tr><tr><td>Present Perfect</td><td>They have sold the house.</td><td>The house <b>has been sold</b>.</td></tr></table>
<p><b>by</b> + исполнитель — только если он важен: <i>The novel was written <b>by</b> Tolstoy.</i></p>`, q:[
["m","English ___ all over the world.",["speaks","is spoken","is speaking"],1,"Present Simple Passive."],
["m","My phone ___ yesterday.",["was stolen","stole","is stolen"],0,"Past Simple Passive."],
["m","«Война и мир» ___ by Tolstoy.",["wrote","was written","has written"],1,"Was written by."],
["m","A new school ___ in our street now.",["is built","is being built","builds"],1,"Сейчас → is being built."],
["m","The tickets ___ already ___ .",["have / been sold","has / sold","are / sold"],0,"Present Perfect Passive."]]},
{h:"Пассив с модальными и в будущем", th:`<p><b>Модальный + be + V3:</b></p>
<ul><li><i>The rules <b>must be followed</b>.</i></li><li><i>This problem <b>can be solved</b>.</i></li><li><i>Plastic <b>should be recycled</b>.</i></li><li><i>The results <b>will be announced</b> tomorrow.</i></li></ul>
<p><b>Past Continuous и Past Perfect:</b> <i>The road <b>was being repaired</b>. The money <b>had been stolen</b>.</i></p>
<p><b>Для IELTS Task 2:</b> пассив с модальными звучит академично и объективно: <i>More funding <b>should be allocated</b> to education. Stricter laws <b>need to be introduced</b>.</i></p>`, q:[
["t","Plastic should ___ (recycle).",["be recycled"],"Should be + V3."],
["t","The results will ___ (announce) on Friday.",["be announced"],"Will be + V3."],
["t","This problem can ___ (solve) easily.",["be solved"],"Can be + V3."],
["t","The road ___ (repair) when we drove past. (Past Cont.)",["was being repaired"],"Was being + V3."],
["t","The money ___ (steal) before the police arrived. (Past Perf.)",["had been stolen"],"Had been + V3."]]},
{h:"Из актива в пассив", th:`<p><b>Алгоритм перевода в пассив:</b></p>
<ol><li>Дополнение становится подлежащим: <i>They built <b>the bridge</b></i> → <i><b>The bridge</b>…</i></li><li>Сохраняем время через be: built (Past) → <b>was</b> built</li><li>Исполнитель через by — только если нужен</li></ol>
<p><b>Два дополнения:</b> <i>They gave <b>me</b> <b>a prize</b></i> → <i><b>I was given</b> a prize</i> (чаще) / <i>A prize was given to me</i>.</p>
<p><b>Не путать:</b> <i>was born</i> (родился) — всегда пассив: <i>I <b>was born</b> in 2007</i> (не <s>I born</s>).</p>`, q:[
["t","Перефразируйте: «They built the bridge in 1990.» → The bridge ___ in 1990.",["was built"],"Past → was built."],
["t","Перефразируйте: «Someone has cleaned the room.» → The room ___ .",["has been cleaned"],"Perfect → has been cleaned."],
["t","Перефразируйте: «They gave me a prize.» → I ___ a prize.",["was given"],"I was given."],
["h","Найдите ошибку: «I born in Kazan in 2007.»",["was born","i was born in kazan in 2007"],"Was born."],
["h","Найдите ошибку: «The house was build in 1900.»",["was built","the house was built in 1900"],"Build – built – built."]]},
{h:"Лексика: наука и технологии", th:`<p><b>Наука и технологии</b> — частая тема Task 2 и Part 3.</p>
<table><tr><td>a breakthrough</td><td>прорыв</td></tr><tr><td>cutting-edge / state-of-the-art</td><td>передовой</td></tr><tr><td>carry out / conduct research</td><td>проводить исследование</td></tr><tr><td>an invention / to invent</td><td>изобретение</td></tr><tr><td>a discovery / to discover</td><td>открытие</td></tr><tr><td>be developed / be tested / be launched</td><td>разрабатываться / тестироваться / запускаться</td></tr><tr><td>rely on / be dependent on</td><td>зависеть от</td></tr><tr><td>artificial intelligence (AI)</td><td>искусственный интеллект</td></tr></table>
<p><b>invent vs discover:</b> invent — создать новое (the telephone was invented); discover — найти существующее (penicillin was discovered).</p>
<p><b>research</b> — неисчисляемое: <s>a research, researches</s> → <i>a study, some research</i>.</p>`, q:[
["t","Penicillin ___ (discover) in 1928.",["was discovered"],"Discover + Past Passive."],
["t","Проводить исследование: carry ___ research.",["out"],"Carry out."],
["h","Найдите ошибку: «The telephone was discovered by Bell.»",["invented","the telephone was invented by bell"],"Создал новое → invented."],
["h","Найдите ошибку: «Scientists have done many researches.»",["a lot of research","much research","many studies"],"Research — неисч."],
["h","Найдите ошибку: «Many people are rely on smartphones.»",["rely","many people rely on smartphones"],"Rely — актив."]]},
{h:"Первое эссе 150 слов: структура", th:`<p><b>Мини-эссе на 150 слов</b> — шаг к Task 2 (250 слов).</p>
<p><b>Тема-пример:</b> <i>Technology has made our lives easier. Do you agree?</i></p>
<ol><li><b>Введение (2 предл.):</b> перефраз темы + мнение. <i>It is often argued that modern technology <b>has simplified</b> daily life. I largely agree with this view.</i></li><li><b>Абзац 1:</b> главный аргумент + пример. <i>Firstly, many routine tasks <b>are now done</b> automatically…</i></li><li><b>Абзац 2:</b> второй аргумент / уступка. <i>However, it could be argued that…</i></li><li><b>Вывод (1–2 предл.):</b> <i>In conclusion, …</i></li></ol>
<p><b>Пассив в эссе</b> делает тон объективным: <i>It is widely believed that…, Many jobs have been replaced by…, Information can be accessed instantly.</i></p>`, q:[
["t","It is widely ___ (believe) that technology saves time.",["believed"],"It is believed that…"],
["t","Information can ___ (access) instantly.",["be accessed"],"Can be + V3."],
["h","Найдите ошибку: «Many jobs have replaced by robots.»",["have been replaced","many jobs have been replaced by robots"],"Пассив Perfect."],
["h","Найдите ошибку: «In conclusion, I am agree that technology helps.»",["i agree","in conclusion, i agree that technology helps"],"Agree — без am."],
["h","Перефразируйте: «People widely use smartphones.» → Smartphones ___ widely used.",["are"],"Пассив Present."]]},
{h:"Неделя целиком: пассив в академическом тексте", th:`<p><b>Когда пассив уместен:</b></p>

{h:"Нулевое и первое условное", th:`<table><tr><th>Тип</th><th>If-часть</th><th>Главная часть</th><th>Смысл</th></tr><tr><td><b>0</b></td><td>if + Present Simple</td><td>Present Simple</td><td>всегда так, факт</td></tr><tr><td><b>1</b></td><td>if + Present Simple</td><td>will + V</td><td>реальное будущее</td></tr></table>
<ul><li><b>0:</b> <i>If you <b>heat</b> ice, it <b>melts</b>.</i> — закон природы</li><li><b>1:</b> <i>If it <b>rains</b> tomorrow, we'<b>ll stay</b> at home.</i> — вполне возможно</li></ul>
<p><b>Главное правило:</b> в if-части <b>никогда нет will</b>: <s>If it will rain</s>.</p>
<p><b>Запятая:</b> если if-часть первая — ставим запятую; если вторая — нет: <i>We'll stay at home if it rains.</i></p>`, q:[
["m","If you mix red and white, you ___ pink.",["get","will got","got"],0,"Факт → Zero."],
["m","If it ___ tomorrow, we'll cancel the picnic.",["will rain","rains","rained"],1,"If + Present."],
["m","If she studies hard, she ___ the exam.",["passes","will pass","would pass"],1,"Реальное будущее → will."],
["m","Water boils if you ___ it to 100 °C.",["heat","will heat","heated"],0,"Zero."],
["m","Which is correct?",["If I will see him, I'll tell him.","If I see him, I'll tell him.","If I see him, I tell him tomorrow."],1,"If + Present, will."]]},
{h:"unless, as long as, in case", th:`<p>Альтернативы if в первом условном:</p>
<table><tr><th>Слово</th><th>Значение</th><th>Пример</th></tr><tr><td><b>unless</b></td><td>если не</td><td><i>You won't pass <b>unless</b> you study.</i> = if you don't study</td></tr><tr><td><b>as long as / provided that</b></td><td>при условии что</td><td><i>You can go <b>as long as</b> you're back by 10.</i></td></tr><tr><td><b>in case</b></td><td>на случай если</td><td><i>Take an umbrella <b>in case</b> it rains.</i></td></tr></table>
<p><b>Unless</b> уже содержит отрицание: <s>unless you don't study</s>.</p>
<p><b>in case ≠ if:</b> <i>I'll take an umbrella <b>if</b> it rains</i> (возьму, только когда пойдёт дождь) vs <i><b>in case</b> it rains</i> (беру заранее).</p>`, q:[
["m","You won't get better ___ you rest.",["if","unless","in case"],1,"Если не → unless."],
["m","Take some money ___ you need a taxi.",["unless","in case","as long as"],1,"На случай → in case."],
["t","Перефразируйте: «If you don't hurry, you'll miss the bus.» → ___ you hurry, you'll miss the bus.",["unless"],"Unless = if not."],
["t","You can borrow my car as ___ as you drive carefully.",["long"],"As long as."],
["t","I'll come ___ I finish work early. (если)",["if"],"Простое условие."]]},
{h:"Второе условное: нереальное настоящее", th:`<p><b>Второе условное</b> — воображаемая или маловероятная ситуация <b>сейчас или в будущем</b>.</p>
<table><tr><td>if + <b>Past Simple</b></td><td><b>would</b> + V</td></tr></table>
<ul><li><i>If I <b>had</b> more money, I <b>would travel</b>.</i> (но денег нет)</li><li><i>If I <b>won</b> the lottery, I'<b>d buy</b> a house.</i> (маловероятно)</li><li><i>What <b>would</b> you <b>do</b> if you <b>lost</b> your job?</i></li></ul>
<p><b>Be → were</b> для всех лиц (в формальном языке): <i>If I <b>were</b> rich… If he <b>were</b> here…</i></p>
<p><b>Сравните:</b> <i>If I <b>get</b> the job, I'<b>ll move</b>.</i> (реально, жду ответа) vs <i>If I <b>got</b> the job, I'<b>d move</b>.</i> (вряд ли).</p>`, q:[
["t","If I ___ (have) a car, I would drive to work.",["had"],"If + Past."],
["t","If she were here, she ___ (know) what to do.",["would know","'d know"],"Would + V."],
["t","If I ___ (be) you, I'd apologise.",["were"],"If I were you."],
["t","What ___ you do if you won a million?",["would"],"What would you do…"],
["t","If people ___ (recycle) more, there would be less waste.",["recycled"],"Second conditional."]]},

{h:"Opinion essay: структура Task 2", th:`<p><b>Opinion essay</b> («To what extent do you agree or disagree?») — самый частый тип Task 2.</p>
<ol><li><b>Введение:</b> перефраз темы + <b>чёткая позиция</b>. <i>I <b>completely agree</b> that…</i> / <i>I <b>partly agree</b>…</i></li><li><b>Body 1:</b> аргумент 1 → объяснение → пример.</li><li><b>Body 2:</b> аргумент 2 → объяснение → пример (или уступка + опровержение).</li><li><b>Вывод:</b> повтор позиции другими словами.</li></ol>
<p><b>Topic sentence</b> каждого абзаца — одна главная мысль: <i>The main reason why… is that…</i></p>
<p><b>Условные в эссе:</b> <i>If governments <b>invested</b> more in public transport, fewer people <b>would drive</b>.</i> — второе условное для гипотетических решений.</p>`, q:[
["t","I completely ___ with this statement.",["agree"],"Agree with."],
["t","The main reason ___ this is important is that…",["why"],"The main reason why…"],
["h","Найдите ошибку: «I am agree with this opinion.»",["i agree","i agree with this opinion"],"Agree — глагол."],
["h","Найдите ошибку: «If people would use bikes, the air would be cleaner.»",["used","if people used bikes"],"If + Past."],
["h","Найдите ошибку: «In my opinion, I think that…»",["in my opinion","i think that"],"Дублирование — одно из двух."]]},
{h:"Неделя целиком: условные 0–2", th:`<table><tr><th>Тип</th><th>Схема</th><th>Когда</th></tr><tr><td>0</td><td>if + Present, Present</td><td>факты, всегда</td></tr><tr><td>1</td><td>if + Present, will</td><td>реальное будущее</td></tr><tr><td>2</td><td>if + Past, would</td><td>нереальное / маловероятное</td></tr></table>
<p><b>Вариации главной части:</b> 1-е — can / may / might / should / повелительное: <i>If you see her, <b>tell</b> her.</i> 2-е — could / might: <i>If I had time, I <b>could</b> help.</i></p>
<p><b>Инверсия (С1):</b> <i><b>Should</b> you need help, call me.</i> = If you need help… <i><b>Were</b> I rich, I'd travel.</i> = If I were rich… (подробно в неделе 27).</p>`, q:[

{h:"Третье условное", th:`<p><b>Третье условное</b> — о прошлом, которое <b>уже нельзя изменить</b>: сожаления, критика, «что было бы».</p>

{h:"Смешанные условные", th:`<p><b>Смешанное условное</b> соединяет прошлое и настоящее.</p>

<p><b>Подсказка:</b> ищите <b>now / today</b> в результате → would + V; <b>yesterday / then</b> → would have + V3.</p>

{h:"wish и if only", th:`<table><tr><th>О чём жалеем</th><th>Форма</th><th>Пример</th></tr><tr><td>настоящее</td><td>wish + Past Simple</td><td><i>I <b>wish</b> I <b>had</b> more time.</i></td></tr><tr><td>прошлое</td><td>wish + Past Perfect</td><td><i>I <b>wish</b> I <b>had studied</b> harder.</i></td></tr><tr><td>раздражение, чужое поведение</td><td>wish + would</td><td><i>I <b>wish</b> you <b>would stop</b> talking.</i></td></tr><tr><td>способность</td><td>wish + could</td><td><i>I <b>wish</b> I <b>could</b> swim.</i></td></tr></table>

{h:"Лексика: образование", th:`<p><b>Образование</b> — тема Task 2 и Part 3.</p>
<table><tr><td>compulsory education</td><td>обязательное образование</td></tr><tr><td>higher / tertiary education</td><td>высшее образование</td></tr><tr><td>tuition fees</td><td>плата за обучение</td></tr><tr><td>rote learning</td><td>зубрёжка</td></tr><tr><td>critical thinking</td><td>критическое мышление</td></tr><tr><td>vocational training</td><td>профессиональное обучение</td></tr><tr><td>academic performance</td><td>успеваемость</td></tr><tr><td>distance / online learning</td><td>дистанционное обучение</td></tr><tr><td>drop out of school</td><td>бросить учёбу</td></tr></table>

{h:"Part 3: обсуждение образования", th:`<p><b>Speaking Part 3</b> — 4–5 минут абстрактных вопросов. Ответ: <b>4–6 предложений</b> с мнением, причиной, примером и уступкой.</p>
<p><b>Схема ответа (OREO):</b> Opinion → Reason → Example → Other side / Outcome.</p>
<p><b>Q:</b> <i>Should university education be free?</i></p>
<p><b>A:</b> <i>I'd say it should be, at least partly. <b>The main reason is that</b> talented students from poorer families can't afford tuition fees. <b>For example</b>, in Germany higher education is free, and… <b>Having said that</b>, if it were completely free, governments would have to raise taxes, which…</i></p>

{h:"Неделя целиком: сожаления и гипотезы", th:`<table><tr><th>Ситуация</th><th>Форма</th></tr><tr><td>Прошлое, которое не изменить</td><td>if + had done, would have done</td></tr><tr><td>Прошлое → сейчас</td><td>if + had done, would do (now)</td></tr><tr><td>Сожаление о настоящем</td><td>wish + Past</td></tr><tr><td>Сожаление о прошлом</td><td>wish + had done</td></tr></table>

{h:"where, when, why и пропуск слова", th:`<ul><li><b>where</b> — место: <i>the city <b>where</b> I was born</i></li><li><b>when</b> — время: <i>the day <b>when</b> we met</i></li><li><b>why</b> — причина: <i>the reason <b>why</b> I left</i></li></ul>

<p><b>Предлог в конце</b> (разговорно) или перед which (формально): <i>the house I grew up <b>in</b></i> = <i>the house <b>in which</b> I grew up</i>.</p>`, q:[

{h:"Неопределительные придаточные: запятые", th:`<p><b>Неопределительное</b> придаточное добавляет <b>доп. информацию</b> о уже понятном объекте. Оно выделяется <b>запятыми</b>.</p>
<table><tr><th>Определительное (без запятых)</th><th>Неопределительное (с запятыми)</th></tr><tr><td><i>My sister <b>who lives in London</b> is a nurse.</i> (у меня несколько сестёр)</td><td><i>My sister, <b>who lives in London</b>, is a nurse.</i> (сестра одна)</td></tr></table>
<p><b>Правила неопределительных:</b> <b>нельзя that</b>; нельзя пропускать who/which.</p>
<ul><li><i>Moscow, <b>which</b> is the capital of Russia, has 13 million people.</i></li><li><b>which</b> о всём предложении: <i>He passed the exam, <b>which</b> surprised everyone.</i></li></ul>`, q:[
["t","Moscow, ___ is the capital, is huge. (who / which / that)",["which"],"Неопределит. → which, не that."],
["t","My father, ___ is 60, still works. (who / that)",["who"],"Неопределит. → who."],
["t","She passed the test, ___ was a surprise. (о всём предложении)",["which"],"Which о всём предложении."],
["h","Найдите ошибку: «Paris, that is in France, is beautiful.»",["which","paris, which is in france, is beautiful"],"Неопределит. → which."],
["h","Найдите ошибку: «The man who he called me was rude.»",["who called","the man who called me was rude"],"Без he."]]},
{h:"Лексика: города и урбанизация", th:`<table><tr><td>urbanisation</td><td>урбанизация</td></tr><tr><td>urban sprawl</td><td>разрастание города</td></tr><tr><td>overcrowding</td><td>перенаселённость</td></tr><tr><td>infrastructure</td><td>инфраструктура</td></tr><tr><td>affordable housing</td><td>доступное жильё</td></tr><tr><td>inner city / city centre</td><td>центр (часто бедный) / центр</td></tr><tr><td>migrate from rural to urban areas</td><td>переезжать из села в город</td></tr><tr><td>a high-rise building / a skyscraper</td><td>высотка</td></tr><tr><td>pedestrian zone</td><td>пешеходная зона</td></tr></table>
<p><b>Придаточные помогают сжимать:</b> <i>Cities <b>which have good public transport</b> are less congested.</i> <i>People <b>who move to cities</b> often face high rents.</i></p>`, q:[
["t","Доступное жильё: ___ housing.",["affordable"],"Affordable."],
["t","Перенаселённость: ___.",["overcrowding"],"Overcrowding."],
["h","Найдите ошибку: «People which live in cities pay higher rents.»",["who","people who live in cities"],"Люди → who."],
["h","Объедините: «Many young people move to cities. They want better jobs.» → Many young people ___ want better jobs move to cities.",["who","that"],"Who."],
["h","Найдите ошибку: «This is the area where I live in.»",["where i live","the area i live in","in which i live"],"Where уже включает in."]]},
{h:"Task 1: линейный график", th:`<p><b>Writing Task 1</b> (20 минут, 150+ слов). Линейный график — изменения во времени.</p>
<ol><li><b>Введение:</b> перефраз заголовка. <i>The line graph <b>illustrates</b> the number of… between 2000 and 2020.</i></li><li><b>Overview</b> (самое важное!): 2 главных тренда без цифр. <i><b>Overall</b>, X increased significantly, while Y declined.</i></li><li><b>Body 1–2:</b> детали с цифрами, сравнение.</li></ol>
<p><b>Глаголы тренда:</b> rise / increase / grow, fall / decrease / decline / drop, fluctuate, remain stable / level off, peak at, hit a low of.</p>
<p><b>Наречия:</b> sharply, dramatically (сильно); steadily, gradually (плавно); slightly (немного).</p>
<p><b>Предлоги с цифрами:</b> rose <b>to</b> 50 (до), rose <b>by</b> 10 (на), <b>from</b> 40 <b>to</b> 50, peaked <b>at</b> 60.</p>`, q:[
["t","Sales rose ___ 20% to 35%. (с)",["from"],"From… to…"],
["t","The figure rose ___ 15%. (на)",["by"],"By = на."],
["t","Prices peaked ___ $100 in 2015.",["at"],"Peak at."],
["h","Найдите ошибку: «The number of tourists increased in 50%.»",["by 50%","increased by 50%"],"На → by."],
["h","Найдите ошибку: «Overall, in 2005 sales were 40 and in 2010 they were 55.» (overview без цифр)",["overall, sales increased","sales increased","overall sales increased"],"Overview = общий тренд."]]},
{h:"Неделя целиком: придаточные в тексте", th:`<p><b>Сокращённые придаточные</b> (Band 7+):</p>
<ul><li><i>The man <b>sitting</b> next to me</i> = who was sitting</li><li><i>The houses <b>built</b> in the 1960s</i> = which were built</li><li><i>The data <b>shown</b> in the graph</i> = which is shown</li></ul>
<p><b>В Task 1:</b> <i>The graph shows the number of people <b>who used</b> public transport</i> → <i>…people <b>using</b> public transport.</i></p>
<p><b>Чек-лист:</b> who — люди; which — вещи; that — нельзя после запятой; whose — чей; where — место; запятые — для лишней информации.</p>`, q:[
["m","The students ___ in the library are preparing for exams.",["studied","studying","who studying"],1,"Сокращённое активное → -ing."],
["h","Сократите: «The houses which were built in 1960 are old.» → The houses ___ in 1960 are old.",["built"],"Пассив → V3."],
["h","Сократите: «The woman who is talking to Tom is my aunt.» → The woman ___ to Tom is my aunt.",["talking"],"Актив → -ing."],
["h","Найдите ошибку: «The graph shows the number of people who using buses.»",["who used","using","people using buses","who use"],"Либо who used, либо using."],
["h","Найдите ошибку: «My brother, that is a lawyer, lives in Moscow.»",["who","my brother, who is a lawyer, lives in moscow"],"После запятой → who."]]}
];
